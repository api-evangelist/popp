name: Popp
description: >-
  Popp (Popp AI) is an API-first conversation engine for staffing and
  recruitment firms. It automates high-volume candidate interactions —
  screening tens of thousands of applicants, collecting and validating
  right-to-work and certification documents, running AI candidate analysis,
  auto-scheduling interviews with calendar sync, and re-qualifying dormant
  candidate databases — through a drag-and-drop workflow builder and a REST
  API. The platform exposes conversations, campaigns, documents, analysis,
  scheduling, and multi-step workflows over https://api.joinpopp.com/v1 with
  API-key authentication, SHA256-signed webhooks across four event categories,
  and a published remote MCP server for agent access. Backed by Techstars.
