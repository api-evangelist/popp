                      - date
                      - startTime
                      - endTime
                required:
                - timezone
                - timeSlots
            required:
            - isCalendarConnected
            - name
            - email
        availabilityMethod:
          type: string
          title: Availability Method
          description: Determines who must attend the meeting. COLLECTIVE books a slot that works for every participant on the panel and requires exactly one organizer. ROUND_ROBIN_MAX_AVAILABILITY routes each meeting to a single participant from a pool of 2 to 10, chosen to give the candidate the widest choice of slots, and requires no organizer.
          enum:
          - COLLECTIVE
          - ROUND_ROBIN_MAX_AVAILABILITY
          default: COLLECTIVE
          example: COLLECTIVE
        title:
          type: string
          title: Title
          description: The title of the meeting.
          example: Interview Call
        description:
          type: string
          title: Description
          description: A description for the meeting that will be included in the calendar invite.
          example: Initial screening interview
        openHours:
          type: array
          title: Open Hours
          description: Available time windows for scheduling the meeting.
          minItems: 1
          items:
            type: object
            properties:
              days:
                type: array
                title: Days
                description: Array of day numbers (0=Sunday, 1=Monday, ..., 6=Saturday).
                items:
                  type: integer
                  minimum: 0
                  maximum: 6
                minItems: 1
                example:
                - 1
