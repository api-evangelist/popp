  /v1/workflows/{workflowId}/runs:
    post:
      summary: Start workflow runs
      description: Enrols candidates in a published workflow, one run per candidate. Runs start after the call returns, so the response reports what Popp accepted rather than the runs. Follow the runs with [List workflow runs](/reference/list-workflow-runs) or the `WORKFLOW_CONTACT_RESOLVED` and `WORKFLOW_RUN_STARTED` [webhooks](/docs/workflow-events).
      operationId: start-workflow-runs
      parameters:
      - name: workflowId
        in: path
        description: The workflow ID.
        required: true
        schema:
          $ref: '#/components/schemas/workflowId'
      tags:
      - Workflows
      requestBody:
        description: Candidates to enrol into the workflow.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkflowRunsInput'
      responses:
        '202':
          description: Popp accepted the request. `summary` accounts for every entry. An entry that can't be enrolled doesn't fail the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartWorkflowRunsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    get:
      summary: List workflow runs
      description: Lists a workflow's runs. Each run includes the candidate's name, so you don't need a call per run to look the candidate up.
      operationId: list-workflow-runs
      parameters:
      - name: workflowId
        in: path
        description: The workflow ID.
        required: true
        schema:
          $ref: '#/components/schemas/workflowId'
      - name: limit
        in: query
        description: Maximum number of runs to return per page.
        required: false
        schema:
          $ref: '#/components/schemas/limit'
      - name: nextToken
        in: query
        description: Pagination cursor returned by the previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      - name: status
        in: query
        description: 'Comma-separated list of statuses to filter by. Allowed values: `RUNNING`, `COMPLETED`, `FAILED`, `CANCELLED`. Example: `RUNNING,COMPLETED`.'
        required: false
        schema:
          $ref: '#/components/schemas/status-77eec34f-669b-4d05-86b2-0457ccb4ae30'
      - name: candidateProfileId
        in: query
        description: Filter to runs for the given candidate profile.
        required: false
        schema:
          $ref: '#/components/schemas/candidateProfileId'
      - name: candidateName
        in: query
        description: Only runs whose candidate name matches these words in this order, ignoring case. `John Smith` matches `John Smith` but not `Smith John`, and `John` matches every candidate named John.
        required: false
        schema:
          $ref: '#/components/schemas/candidateName'
      tags:
      - Workflows
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowRunsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
components:
  schemas:
    CreateConversationInput:
      type: object
      properties:
        phoneNumber:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
          title: Phone Number
          description: The phone number of the candidate, in E.164 format. For SMS and WHATSAPP campaigns, required unless the campaign's email fallback resolves to enabled (emailChannelFallbackEnabled on the campaign, inheriting the organization setting when unset) and an emailAddress is provided.
        shouldSendDuringBusinessHours:
          type: boolean
          title: Should Send During Business Hours
          description: Whether to send the message during business hours. The timezone is inferred from the phone number.
        countryCode:
          type: string
          title: Country Code
          description: The country code in ISO 3166-1 alpha-2 format. This is used to format the phone number if it is not in E.164 format.
        firstName:
          type: string
          title: First Name
          description: The first name of the candidate.
        lastName:
          type: string
          title: Last Name
          description: The last name of the candidate.
        emailAddress:
          type: string
          title: Email Address
          description: The email address of the candidate. Required for EMAIL channel campaigns. For SMS and WHATSAPP campaigns, an email-only request is accepted only when the campaign's email fallback resolves to enabled; otherwise the request is rejected with 400.
        campaignId:
          type: string
          title: Campaign ID
          description: The unique identifier for the campaign.
        externalId:
          type: string
          title: External ID
          description: The unique identifier for the conversation in the external system.
        externalCampaignId:
          type: string
          title: External Campaign ID
          description: The unique identifier for the campaign in the external system.
        applicationSource:
          type: string
          title: Application Source
          description: The source where the application was submitted from (e.g., 'careers-page', 'job-board', 'referral').
        skipDuplicationCheck:
          type: boolean
          title: Skip Duplication Check
          description: 'When true, closes ongoing conversation with the same phone number/email in the SAME CAMPAIGN, then creates a new one. Use for re-engaging a candidate within the same campaign. Note: queuing behavior is still respected if conversations exist in other campaigns.'
          default: false
        closePreviousConversations:
          type: boolean
          title: Close Previous Conversations
          description: When true, closes all ongoing conversations (CREATED, QUEUED, ONGOING) with the same contact identifier (phone number for SMS/WhatsApp, email address for Email) and channel across ALL CAMPAIGNS before creating the new conversation. This completely disables queuing behavior. Applies to SMS, WhatsApp, and Email channels.
          default: false
        openingMessage:
          type: string
          maxLength: 600
          title: Opening Message
          description: 'A custom opening message that overrides the campaign''s default opening message. Must be 600 characters or less. Additional validation: For SMS campaigns, must include the ''STOP'' keyword (uppercase) for opt-out compliance. Not supported for WhatsApp campaigns (will return 400 error).'
        additionalContext:
          type: string
          minLength: 1
          title: Additional Context
          description: Custom context to provide to the AI agent for this specific conversation. This context is used alongside campaign-level and organization-level context when generating replies. Useful for passing candidate-specific information that should influence the conversation.
      required:
      - firstName
      oneOf:
      - title: Campaign ID Required
        description: Either campaignId or externalCampaignId is required.
        required:
        - campaignId
      - title: External Campaign ID Required
        description: Either externalCampaignId or campaignId is required.
        required:
        - externalCampaignId
      additionalProperties: false
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the conversation
        organizationId:
          type: string
          format: uuid
          description: Organization identifier
        campaignId:
          type: string
          format: uuid
          description: Campaign identifier
        participantPhoneNumber:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
          description: Participant's phone number in E.164 format
        participantFirstName:
          type: string
          description: Participant's first name
        participantLastName:
          type: string
          description: Participant's last name
          nullable: true
        participantEmailAddress:
          type: string
          format: email
          description: Participant's email address
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the conversation was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the conversation was last updated
        needsReview:
          type: boolean
          description: Indicates if the conversation needs review
        isHumanTakeover:
          type: boolean
          description: Indicates if human has taken over the conversation
        screeningQuestionsOutcome:
          type: array
          description: Outcome of screening questions
          nullable: true
          items:
            type: object
            properties:
              questionOutcome:
                type: string
                enum:
                - FAILED
                - NOT_COMPLETED
                - PASSED
                description: The outcome of the screening question
              responseSummary:
                type: string
                description: Summary of the participant's response
              screeningQuestion:
                type: string
                description: The screening question asked
            required:
            - questionOutcome
            - responseSummary
            - screeningQuestion
            additionalProperties: false
        sentAt:
          type: string
          format: date-time
          description: Timestamp when the conversation was sent
          nullable: true
        completedAt:
          type: string
          format: date-time
          description: Timestamp when the conversation was completed
          nullable: true
        timeToFirstResponse:
          type: number
          description: Time taken for first response
          nullable: true
        timeToComplete:
          type: number
          description: Time taken to complete the conversation
          nullable: true
        messagesCount:
          type: integer
          minimum: 0
          description: Total number of messages in the conversation
        repliesCount:
          type: integer
          minimum: 0
          description: Total number of replies in the conversation
        conversationStatus:
          type: string
          enum:
          - COMPLETED_SCREENING_PASSED
          - CLOSED
          - COMPLETED_SCREENING_FAILED
          - OPTED_OUT
          - ONGOING
          - CREATED
          - QUEUED
          - DELIVERY_FAILED
          description: Current status of the conversation
        scorecardTotalValue:
          type: number
          description: Total scorecard value derived from preferred-answer scoring across the conversation's open questions. Null when the conversation has not produced a scorecard.
          nullable: true
        externalId:
          type: string
          description: Caller-supplied identifier passed when the conversation was created via POST /v1/conversations or POST /v1/workflows/{workflowId}/runs. Null when the caller did not supply one.
          nullable: true
        workflowRunId:
          type: string
          description: Identifier of the workflow run that owns this conversation. Null when the conversation was not created by a workflow run.
          nullable: true
        workflowNodeId:
          type: string
          description: Identifier of the workflow node that owns this conversation. Null when the conversation was not created by a workflow run.
          nullable: true
        bookingId:
          type: string
          description: Identifier of the calendar booking associated with this conversation. Null when no booking has been made.
          nullable: true
        scoreCardOutcomes:
          type: array
          description: Per-question scorecard outcomes for open questions evaluated during the conversation.
          nullable: true
          items:
            type: object
            properties:
              question:
                type: string
                description: The open question that was asked.
              responseSummary:
                type: string
                description: Summary of the candidate's response to the question.
                nullable: true
              score:
                type: number
                description: Score awarded to the candidate's answer.
                nullable: true
              requirementOutcomes:
                type: array
                description: Per-requirement evaluation results for the question.
                nullable: true
                items:
                  type: object
                  properties:
                    content:
                      type: string
                      description: The requirement content evaluated against the candidate's answer.
                    evidence:
                      type: string
                      description: Evidence from the candidate's answer that supported or contradicted the requirement.
                      nullable: true
                    isMet:
                      type: boolean
                      description: Whether the requirement was met by the candidate's answer.
                  required:
                  - content
                  - isMet
                  additionalProperties: false
            required:
            - question
            additionalProperties: false
      required:
      - id
      - organizationId
      - campaignId
      - participantPhoneNumber
      - participantFirstName
      - createdAt
      - updatedAt
      - needsReview
      - isHumanTakeover
      - messagesCount
      - repliesCount
      - conversationStatus
      additionalProperties: false
    ErrorResponse:
      type: object
    ListConversationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Unique identifier for the conversation
              organizationId:
                type: string
                format: uuid
                description: Organization identifier
              campaignId:
                type: string
                format: uuid
                description: Campaign identifier
              participantPhoneNumber:
                type: string
                pattern: ^\+[1-9]\d{1,14}$
                description: Participant's phone number in E.164 format
              participantFirstName:
                type: string
                description: Participant's first name
              participantLastName:
                type: string
                description: Participant's last name
                nullable: true
              participantEmailAddress:
                type: string
                format: email
                description: Participant's email address
                nullable: true
              createdAt:
                type: string
                format: date-time
                description: Timestamp when the conversation was created
              updatedAt:
                type: string
                format: date-time
                description: Timestamp when the conversation was last updated
              needsReview:
                type: boolean
                description: Indicates if the conversation needs review
              isHumanTakeover:
                type: boolean
                description: Indicates if human has taken over the conversation
              screeningQuestionsOutcome:
                type: array
                description: Outcome of screening questions
                nullable: true
                items:
                  type: object
                  properties:
                    questionOutcome:
                      type: string
                      enum:
                      - FAILED
                      - NOT_COMPLETED
                      - PASSED
                      description: The outcome of the screening question
                    responseSummary:
                      type: string
                      description: Summary of the participant's response
                    screeningQuestion:
                      type: string
                      description: The screening question asked
                  required:
                  - questionOutcome
                  - responseSummary
                  - screeningQuestion
                  additionalProperties: false
              sentAt:
                type: string
                format: date-time
                description: Timestamp when the conversation was sent
                nullable: true
              completedAt:
                type: string
                format: date-time
                description: Timestamp when the conversation was completed
                nullable: true
              timeToFirstResponse:
                type: number
                description: Time taken for first response
                nullable: true
              timeToComplete:
                type: number
                description: Time taken to complete the conversation
                nullable: true
              messagesCount:
                type: integer
                minimum: 0
                description: Total number of messages in the conversation
              repliesCount:
                type: integer
                minimum: 0
                description: Total number of replies in the conversation
              conversationStatus:
                type: string
                enum:
                - COMPLETED_SCREENING_PASSED
                - CLOSED
                - COMPLETED_SCREENING_FAILED
                - OPTED_OUT
                - ONGOING
                - CREATED
                - QUEUED
                - DELIVERY_FAILED
                description: Current status of the conversation
              scorecardTotalValue:
                type: number
                description: Total scorecard value derived from preferred-answer scoring across the conversation's open questions. Null when the conversation has not produced a scorecard.
                nullable: true
              externalId:
                type: string
                description: Caller-supplied identifier passed when the conversation was created via POST /v1/conversations or POST /v1/workflows/{workflowId}/runs. Null when the caller did not supply one.
                nullable: true
              workflowRunId:
                type: string
                description: Identifier of the workflow run that owns this conversation. Null when the conversation was not created by a workflow run.
                nullable: true
              workflowNodeId:
                type: string
                description: Identifier of the workflow node that owns this conversation. Null when the conversation was not created by a workflow run.
                nullable: true
              bookingId:
                type: string
                description: Identifier of the calendar booking associated with this conversation. Null when no booking has been made.
                nullable: true
              scoreCardOutcomes:
                type: array
                description: Per-question scorecard outcomes for open questions evaluated during the conversation.
                nullable: true
                items:
                  type: object
                  properties:
                    question:
                      type: string
                      description: The open question that was asked.
                    responseSummary:
                      type: string
                      description: Summary of the candidate's response to the question.
                      nullable: true
                    score:
                      type: number
                      description: Score awarded to the candidate's answer.
                      nullable: true
                    requirementOutcomes:
                      type: array
                      description: Per-requirement evaluation results for the question.
                      nullable: true
                      items:
                        type: object
                        properties:
                          content:
                            type: string
                            description: The requirement content evaluated against the candidate's answer.
                          evidence:
                            type: string
                            description: Evidence from the candidate's answer that supported or contradicted the requirement.
                            nullable: true
                          isMet:
                            type: boolean
                            description: Whether the requirement was met by the candidate's answer.
                        required:
                        - content
                        - isMet
                        additionalProperties: false
                  required:
                  - question
                  additionalProperties: false
            required:
            - id
            - organizationId
            - campaignId
            - participantPhoneNumber
            - participantFirstName
            - createdAt
            - updatedAt
            - needsReview
            - isHumanTakeover
            - messagesCount
            - repliesCount
            - conversationStatus
            additionalProperties: false
        nextToken:
          type: string
          nullable: true
      required:
      - data
      additionalProperties: false
    campaignId:
      type: string
    limit:
      type: integer
    nextToken:
      type: string
    phoneNumber:
      type: string
    emailAddress:
      type: string
      format: email
    externalId:
      type: string
    status:
      type: string
      enum:
      - COMPLETED_SCREENING_PASSED
      - CLOSED
      - COMPLETED_SCREENING_FAILED
      - OPTED_OUT
      - ONGOING
      - CREATED
      - QUEUED
      - DELIVERY_FAILED
    sortDirection:
      type: string
      enum:
      - ASC
      - DESC
    conversationId:
      type: string
    ListConversationMessagesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the message
              conversationId:
                type: string
                description: ID of the conversation this message belongs to
              body:
                type: string
                description: The content of the message
              sender:
                type: string
                enum:
                - AGENT
                - PROSPECT
                - USER
                description: The sender of the message
              status:
                type: string
                enum:
                - NOT_SENT
                - READ
                - RECEIVED_SUCCESS
                - SENT
                - SENT_FAILED
                - SENT_SKIPPED
                - SENT_SUCCESS
                description: The delivery status of the message
                nullable: true
              createdAt:
                type: string
                format: date-time
                description: When the message was created
              updatedAt:
                type: string
                format: date-time
                description: When the message was last updated
              deliveredAt:
                type: string
                format: date-time
                description: When the message was delivered
                nullable: true
              readAt:
                type: string
                format: date-time
                description: When the message was read
                nullable: true
              isInitial:
                type: boolean
                description: Whether this is the initial message in the conversation
                nullable: true
              isFallback:
                type: boolean
                description: Whether this is a fallback message
                nullable: true
              isNegativeSentiment:
                type: boolean
                description: Whether the message has negative sentiment
                nullable: true
              sentimentName:
                type: string
                description: The sentiment classification of the message
                nullable: true
              emailSubjectLine:
                type: string
                description: The email subject line if this is an email message
                nullable: true
              isEmailOpened:
                type: boolean
                description: Whether the email has been opened
                nullable: true
              media:
                type: object
                description: Media attached to the message
                nullable: true
                properties:
                  fileName:
                    type: string
                    description: Name of the media file
                  contentType:
                    type: string
                    description: MIME type of the media
                  size:
                    type: integer
                    description: Size of the media in bytes
                    nullable: true
                  classifiedDocumentType:
                    type: string
                    description: Classified type of the document
                    nullable: true
            required:
            - id
            - conversationId
            - body
            - sender
            - createdAt
            - updatedAt
            additionalProperties: false
        nextToken:
          type: string
