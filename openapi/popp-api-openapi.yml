  /v1/candidates:
    post:
      summary: Create a candidate
      description: 'Creates a candidate profile in the caller''s organization, or upserts an existing one when the same `externalId` is re-posted. Organization context is taken from the authenticated API key, never from the body. `mode` controls only how much of the work the request waits for — specifically, whether the document is downloaded before responding. In `SYNC` mode the profile is created and, when `documentUrl` is supplied, the document is downloaded during the request (201 when newly created, 200 when an existing profile was upserted), so a failed download surfaces as a 502 on this call. In `ASYNC` mode the work is queued and 202 is returned immediately with the resolved candidate id, and the document is downloaded in the background. CV parsing and vectorization are **always** asynchronous, in both modes: a 2xx means the profile exists — and in `SYNC`, that the document was fetched — never that the CV has been parsed or indexed. A CV can be attached via `documentUrl` or inline
        `documentBase64` (`SYNC` only). `documentUrl` is fetched server-side: the organization group''s stored credential is sent when one is registered, and the URL is fetched unauthenticated when it is not, so a presigned or otherwise public URL works without any credential being set up. The destination must be an `https` URL resolving to a public address and is not followed through redirects; one that is refused is a 400, not a 502, because retrying cannot help.'
      operationId: create-candidate
      parameters: []
      tags:
      - Candidates
      requestBody:
        required: true
        description: Candidate payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCandidateResponse'
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCandidateResponse'
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCandidateAcceptedResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
