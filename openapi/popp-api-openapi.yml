          - Google Meet
          - Microsoft Teams
          example: Google Meet
        location:
          type: string
          title: Location
          description: The physical location for the meeting. Required when videoConferencing is false; must contain at least one non-space character and is trimmed. Cannot be used when videoConferencing is enabled.
