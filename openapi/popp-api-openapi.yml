    ParseAvailabilityInput:
      type: object
      properties:
        messages:
          type: array
          title: Conversation Messages
          description: OpenAI-style chat history. Include prior turns for multi-turn clarification.
          minItems: 1
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                - user
                - assistant
              content:
                type: string
                minLength: 1
            required:
            - role
            - content
            additionalProperties: false
        context:
          type: object
          title: Parse Context
          description: Bounds for the parsed availability.
          properties:
            timezone:
              type: string
              description: IANA timezone identifier, e.g. 'Europe/London'.
            startDate:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: Start of the target date range (inclusive, YYYY-MM-DD). Must be before endDate.
            endDate:
              type: string
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: End of the target date range (inclusive, YYYY-MM-DD). Maximum 90 days after startDate.
          required:
          - timezone
          - startDate
          - endDate
          additionalProperties: false
      required:
      - messages
      - context
      additionalProperties: false
    ParseAvailabilityResponse:
      type: object
      properties:
        message:
          type: string
          title: Assistant Message
          description: Human-readable assistant reply to display. A confirmation when status=complete, a follow-up question when status=clarification_needed, or an explanation when status=error.
        availability:
          title: Parsed Availability
          description: Populated when status=complete; null otherwise.
          type: object
          properties:
            timezone:
              type: string
              description: IANA timezone for the returned time slots.
            timeSlots:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: Slot date (YYYY-MM-DD).
                  startTime:
                    type: string
                    pattern: ^\d{2}:\d{2}$
                    description: Local start time (HH:MM, 24h).
                  endTime:
                    type: string
                    pattern: ^\d{2}:\d{2}$
                    description: Local end time (HH:MM, 24h).
                required:
                - date
                - startTime
                - endTime
                additionalProperties: false
          required:
          - timezone
          - timeSlots
          additionalProperties: false
          nullable: true
        status:
          type: string
          enum:
          - complete
          - clarification_needed
          - error
          description: complete = slots ready (client may save); clarification_needed = ask follow-up; error = input not parseable.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Model confidence in the result.
      required:
      - message
      - availability
      - status
      - confidence
      additionalProperties: false
