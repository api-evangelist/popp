    BulkCreateConversationsInput:
      type: object
      properties:
        campaignId:
          type: string
          title: Campaign ID
          description: The unique identifier for the campaign.
        externalCampaignId:
          type: string
          title: External Campaign ID
          description: The unique identifier for the campaign in the external system.
        shouldSendDuringBusinessHours:
          type: boolean
          title: Should Send During Business Hours
          description: Whether to send messages during business hours. Applies to all contacts in the batch. The timezone is inferred from each contact's phone number.
        skipDuplicationCheck:
          type: boolean
          title: Skip Duplication Check
          description: When true, closes ongoing conversation with the same phone number/email in the SAME CAMPAIGN, then creates a new one. Applies to all contacts in the batch.
          default: false
        contacts:
          type: array
          title: Contacts
          description: Array of contacts to create conversations for.
          minItems: 1
          items:
            type: object
            properties:
              phoneNumber:
                type: string
                pattern: ^\+[1-9]\d{1,14}$
                title: Phone Number
                description: The phone number of the contact, in E.164 format. For SMS and WHATSAPP campaigns, required unless the campaign's email fallback resolves to enabled (emailChannelFallbackEnabled on the campaign, inheriting the organization setting when unset) and an emailAddress is provided.
              countryCode:
                type: string
                title: Country Code
                description: The country code in ISO 3166-1 alpha-2 format.
              firstName:
                type: string
                title: First Name
                description: The first name of the contact.
              lastName:
                type: string
                title: Last Name
                description: The last name of the contact.
              emailAddress:
                type: string
                title: Email Address
                description: The email address of the contact. For SMS and WHATSAPP campaigns, an email-only contact is accepted only when the campaign's email fallback resolves to enabled; otherwise the contact is rejected.
              externalId:
                type: string
                title: External ID
                description: The unique identifier for the conversation in the external system.
              applicationSource:
                type: string
                title: Application Source
                description: The source where the application was submitted from.
              closePreviousConversations:
                type: boolean
                title: Close Previous Conversations
                description: When true, closes all ongoing conversations with the same contact identifier across ALL CAMPAIGNS before creating the new conversation.
                default: false
              openingMessage:
                type: string
                maxLength: 600
                title: Opening Message
                description: A custom opening message that overrides the campaign's default opening message. Must be 600 characters or less.
              additionalContext:
                type: string
                minLength: 1
                title: Additional Context
                description: Custom context to provide to the AI agent for this specific conversation.
              calendarMeetingTemplateId:
                type: string
                title: Calendar Meeting Template ID
                description: The calendar meeting template identifier.
            required:
            - firstName
            additionalProperties: false
      required:
      - contacts
      oneOf:
      - title: Campaign ID Required
        required:
        - campaignId
      - title: External Campaign ID Required
        required:
        - externalCampaignId
      additionalProperties: false
    BulkCreateConversationsResponse:
      type: object
      properties:
        message:
          type: string
        total:
          type: integer
          description: Total number of candidates processed.
        queued:
          type: integer
          description: Number of candidates successfully queued.
        failed:
          type: integer
          description: Number of candidates that failed to process.
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: The index of the candidate in the input array.
              firstName:
                type: string
                description: The first name of the candidate.
              status:
                type: string
                enum:
                - queued
                - failed
                description: The processing status.
              error:
                type: string
                description: Error message if the candidate failed to process.
            required:
            - index
            - firstName
            - status
      required:
      - message
      - total
      - queued
      - failed
      - results
      additionalProperties: false
    Campaign:
      title: Campaign
      description: Schema for a campaign
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the campaign
        organizationId:
          type: string
          format: uuid
          description: Identifier of the organization that owns the campaign
        type:
          type: string
          enum:
          - APPLICANT_OUTREACH
          - NEW_CANDIDATE_OUTREACH
          - ENGAGEMENT_OUTREACH
          description: Type of the campaign
          nullable: true
        channel:
          type: string
          enum:
          - SMS
          - WHATSAPP
          - WEB_CHAT
          - WEB_CHAT_VIA_EMAIL
          description: Channel through which the campaign is conducted
          nullable: true
        emailChannelFallbackEnabled:
          type: boolean
          description: Campaign-level email fallback setting. null means the campaign inherits the organization-level setting; true or false is an explicit campaign override.
          nullable: true
        closingMethod:
          type: string
          enum:
          - CUSTOM
          - CALENDAR_MEETING_INTEGRATION
          description: Closing method for the campaign
          nullable: true
        templateId:
          type: string
          description: ID of the template used for the campaign
          nullable: true
        campaignTitle:
          type: string
          description: Title of the campaign
          nullable: true
        campaignDescription:
          type: string
          description: Description of the job for the campaign
          nullable: true
        additionalContext:
          type: string
          description: Additional context or notes for the campaign
          nullable: true
        externalId:
          type: string
          description: External identifier for the campaign
          nullable: true
        isWorkflowManaged:
          type: boolean
          description: True when the campaign is managed by Workflow Builder. Mutation endpoints (POST /v1/conversations, POST /v1/conversations/bulk, POST /v1/conversations/scheduling, PATCH /v1/campaigns/{id}, POST /v1/campaigns/{id}/stop) reject such campaigns with 400 — start work via POST /v1/workflows/{workflowId}/runs instead. See the Workflow Builder guide.
          nullable: true
        workflowId:
          type: string
          description: Identifier of the workflow that owns this campaign. Null when the campaign is not workflow-managed.
          nullable: true
        workflowVersionId:
          type: string
          description: Identifier of the workflow version that owns this campaign. Null when the campaign is not workflow-managed.
          nullable: true
        workflowNodeId:
          type: string
          description: Identifier of the workflow node that owns this campaign. Null when the campaign is not workflow-managed.
          nullable: true
        conversationTimeout:
          type: number
          description: Time in hours to automatically close conversations
          nullable: true
        owner:
          type: string
          format: email
          description: Owner's email address
          nullable: true
        rejectionMessage:
          type: string
          description: Message sent upon rejection
          nullable: true
        closingMessage:
          type: string
          description: Message sent when the campaign is closed
          nullable: true
        customRequest:
          type: string
          description: Custom request for the campaign
          nullable: true
        campaignStatus:
          type: string
          enum:
          - ARCHIVED
          - DISCONNECTED
          - DRAFT
          - FINISHED_GENERATING
          - FINISHED_SENDING
          - GENERATING_MESSAGES
          - LIVE
          - PAUSED
          - PROCESSING
          - SCHEDULED
          - SENDING_MESSAGES
          description: Current status of the campaign
        needsReview:
          type: boolean
          description: Indicates if the campaign needs review
        disableNudging:
          type: boolean
          description: When true, automatic follow-up messages (nudges) are disabled for all conversations in this campaign
          nullable: true
        nudgeSettings:
          type: array
          description: 'Custom nudge timing configuration. Each entry represents one follow-up nudge. Null when using default behavior (3 nudges at 24-hour intervals). Note: for WhatsApp campaigns, nudges are only sent after the candidate replies.'
          nullable: true
          items:
            type: object
            properties:
              delayHours:
                type: integer
                description: Hours to wait since the previous message before sending this nudge.
                minimum: 1
        jobDescriptionParsed:
          type: object
          description: Parsed job description details
          required:
          - employerName
          - jobTitle
          - summaryOfRole
          additionalProperties: false
          nullable: true
          properties:
            employerName:
              type: string
              description: Name of the employer
            jobTitle:
              type: string
              description: Title of the job
            summaryOfRole:
              type: string
              description: Summary of the role
        agent:
          type: object
          description: Agent managing the campaign
          required:
          - id
          - agentName
          additionalProperties: false
          nullable: true
          properties:
            id:
              type: string
              format: uuid
              description: ID of the agent
            agentName:
              type: string
              description: Name of the agent
            agentTone:
              type: string
              enum:
              - CASUAL
              - PROFESSIONAL
              - NEUTRAL
              - FRIENDLY
              - MOTIVATIONAL
              - CUSTOM
              - ENCOURAGING
              description: Tone used by the agent
              nullable: true
        questions:
          type: array
          description: List of screening questions for the campaign
          nullable: true
          items:
            type: object
            oneOf:
            - properties:
                questionType:
                  type: string
                  enum:
                  - TEXT
                  description: Type of the question
                isMandatory:
                  type: boolean
                  description: Indicates if the question is mandatory
                  nullable: true
                content:
                  type: string
                  description: Content of the question
                documentTypes:
                  type: array
                  description: Deprecated free-text list of document types required. Null on TEXT questions and on DOCUMENT questions that use `documentItems` instead.
                  nullable: true
                  items:
                    type: string
                documentItems:
                  type: array
                  description: Typed references to DocumentType records. Null on TEXT questions and on DOCUMENT questions that use the deprecated `documentTypes` field instead.
                  nullable: true
                  items:
                    type: object
                    properties:
                      documentTypeId:
                        type: string
                        format: uuid
                      documentTypeName:
                        type: string
                        nullable: true
                hasPreferredAnswer:
                  type: boolean
                  description: Whether this question has preferred answer criteria
                  nullable: true
                preferredAnswerRequirements:
                  type: array
                  description: List of requirements the preferred answer should meet
                  nullable: true
                  items:
                    type: string
                preferredAnswerText:
                  type: string
                  description: Example of a preferred answer text
                  nullable: true
              required:
              - questionType
              - isMandatory
              - content
              additionalProperties: false
            - properties:
                questionType:
                  type: string
                  enum:
                  - DOCUMENT
                  description: Type of the question
                isMandatory:
                  type: boolean
                  description: Indicates if the question is mandatory
                  nullable: true
                content:
                  type: string
                  description: Content of the question
                  nullable: true
                documentTypes:
                  type: array
                  description: Deprecated free-text list of document types required. Null when the question uses `documentItems` instead.
                  nullable: true
                  items:
                    type: string
                documentItems:
                  type: array
                  description: Typed references to DocumentType records. Null when the question uses the deprecated `documentTypes` field instead.
                  nullable: true
                  items:
                    type: object
                    properties:
                      documentTypeId:
                        type: string
                        format: uuid
                      documentTypeName:
                        type: string
                        nullable: true
              required:
              - questionType
              - isMandatory
              additionalProperties: false
        language:
          type: string
          enum:
          - en_ca
          - en_gb
          - en_us
          - de
          - es
          - fr
          - it
          - nl
          - nl_be
          - pt
          - pt_br
          - zh_hk
          - ar
          - ja
          - ko
          - ru
          - pl
          - tr
          - hu
          - sv
          - 'no'
          - da
          description: 'Language the campaign operates in: en_ca (Canadian English), en_gb (British English), en_us (American English), de (German), es (Spanish), fr (French), it (Italian), nl (Dutch), nl_be (Flemish), pt (Portuguese), pt_br (Brazilian Portuguese), zh_hk (Chinese), ar (Arabic), ja (Japanese), ko (Korean), ru (Russian), pl (Polish), tr (Turkish), hu (Hungarian), sv (Swedish), no (Norwegian), da (Danish).'
          nullable: true
      required:
      - id
      - organizationId
      - status
      - needsReview
      additionalProperties: false
    CreateCampaignRequest:
      description: Request to create a new campaign
      type: object
      properties:
        campaignType:
          title: Campaign Type
          description: The type of campaign to create
          type: string
          enum:
          - APPLICANT_OUTREACH
          - NEW_CANDIDATE_OUTREACH
          - ENGAGEMENT_OUTREACH
          - SCHEDULING
        closingMethod:
          title: Closing Method
          description: How the campaign conversation should be closed. Defaults to CALENDAR_MEETING_INTEGRATION for SCHEDULING campaigns. CUSTOM requires `customMessage`; CALENDAR_MEETING_INTEGRATION requires `calendarMeetingTemplateId`.
          type: string
          enum:
          - CUSTOM
          - CALENDAR_MEETING_INTEGRATION
        channel:
          title: Channel
          description: Communication channel used for the campaign
          type: string
          enum:
          - SMS
          - WHATSAPP
          - EMAIL
        emailChannelFallbackEnabled:
          type: boolean
          description: 'Controls falling back to email when an SMS or WhatsApp message cannot be delivered (invalid or missing phone number). When omitted, the campaign inherits the organization-level email fallback setting, including future changes to it. An explicit value overrides the organization setting in either direction: true enables fallback for this campaign even if the organization has it disabled, false disables it even if the organization has it enabled. Not applicable to EMAIL channel campaigns.'
        campaignTitle:
          type: string
          description: Title of the campaign
        campaignDescription:
          type: string
          description: Detailed description of the campaign
          format: textarea
        closingMessage:
          type: string
          description: Message sent when the candidate is not interested.
        rejectionMessage:
          type: string
          description: Message sent when a candidate is rejected (fails mandatory/knockout questions).
        customMessage:
          type: string
          description: Message sent to the candidate when they successfully complete the conversation. Required when closingMethod is CUSTOM.
        company:
          type: string
          description: Company name for the role.
        location:
          type: string
          description: Location of the role.
        contractType:
          type: string
          description: Contract type for the role (e.g. Permanent, Contract, Temporary). Only used for APPLICANT_OUTREACH and NEW_CANDIDATE_OUTREACH campaigns. When provided, it overrides the contract type Popp would otherwise infer from campaignDescription.
        questions:
          type: array
          description: List of screening questions included in the campaign. Not allowed for SCHEDULING campaigns.
          minItems: 1
          items:
            type: object
            oneOf:
            - title: Text Question
              description: A text-based screening question
              type: object
              properties:
                questionType:
                  type: string
                  enum:
                  - TEXT
                isMandatory:
                  type: boolean
                  description: When true, failing this question will reject the candidate (knockout question)
                content:
                  type: string
                  description: The question text
                preferredAnswerRequirements:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: List of preferred answer criteria for scoring
                preferredAnswerText:
                  type: string
                  description: Description of the preferred answer
              required:
              - questionType
              - isMandatory
              - content
              additionalProperties: false
            - title: Document Request
              description: A document upload request
              type: object
              properties:
                questionType:
                  type: string
                  enum:
                  - DOCUMENT
                isMandatory:
                  type: boolean
                  description: When true, the document is required to proceed
                documentTypes:
                  type: array
                  items:
                    type: string
                  description: Deprecated free-text list of accepted document types (e.g. 'CV', 'Passport'). Provide `documentItems` instead to reference DocumentType records by id. A question must carry either `documentTypes` or `documentItems`, never both.
                  minItems: 1
                documentItems:
                  type: array
                  items:
                    type: object
                    properties:
                      documentTypeId:
                        type: string
                        format: uuid
                        description: Id of a DocumentType in the caller's organization (created via `POST /v1/document-types`). Must not be archived.
                    required:
                    - documentTypeId
                    additionalProperties: false
                  description: Typed references to DocumentType records. The server resolves each id to its canonical name and rejects unknown / archived ids with 400. A question must carry either `documentTypes` or `documentItems`, never both.
                  minItems: 1
              required:
              - questionType
              - isMandatory
              additionalProperties: false
        additionalContext:
          type: string
          description: Additional context or instructions for the AI agent (minimum 10 characters)
          format: textarea
        conversationTimeout:
          type: integer
          minimum: 24
          description: Timeout for conversations in hours (minimum 24 hours). Defaults to 48 hours.
        owner:
          type: string
          format: email
          description: Email address of the campaign owner. Must be a user in the organization.
        campaignStatus:
          type: string
          enum:
          - LIVE
          - DRAFT
          description: Status of the campaign. DRAFT creates the campaign without sending. Defaults to LIVE.
          default: LIVE
        openingMessageTemplateId:
          type: string
          description: ID of the opening message template. Must match the specified channel and campaignType. Mutually exclusive with customTemplatedMessage.
          format: uuid
        customTemplatedMessage:
          type: string
          description: Custom opening message template text (minimum 10 characters). SMS and Email channels only. Mutually exclusive with openingMessageTemplateId. Must contain the word STOP (uppercase) for opt-out compliance. Supports {{SCREAMING_SNAKE_CASE}} placeholders, filled in per candidate; which ones are available depends on campaignType, so see "Personalising the Opening Message" in the Campaigns guide for the table. {{CANDIDATE_FIRST_NAME}}, {{CANDIDATE_LAST_NAME}}, {{AGENT_NAME}} and {{ORGANIZATION_NAME}} work on every campaign type; SCHEDULING campaigns must also include {{MEETING_URL}}. An unrecognised name returns 400 "Unknown placeholder found"; a valid name that campaignType cannot fill returns 400 "Missing value for template variable".
        customTemplatedSubjectLine:
          type: string
          description: Subject line for Email campaigns using customTemplatedMessage. Required when using customTemplatedMessage with Email channel. Maximum 200 characters. Takes the same placeholder names as customTemplatedMessage; an unrecognised name returns 400 "Invalid placeholder in subject line". Note that only the name is validated here, not whether campaignType can fill it.
          maxLength: 200
        agentName:
          type: string
          description: AI agent name (case-insensitive, Unicode letters only, maximum 3 words). There is no agentId field — an agent cannot be referenced by ID; supply agentName together with agentTone instead. If the pair does not match your organization's default agent, a new agent is created with this name and tone.
        agentTone:
          type: string
          description: Tone used by the AI agent. Must be provided together with agentName.
          enum:
          - CASUAL
          - ENCOURAGING
          - FRIENDLY
          - MOTIVATIONAL
          - NEUTRAL
          - PROFESSIONAL
        externalId:
          type: string
          title: External ID
          description: Your unique identifier for the campaign in your external system.
        calendarMeetingTemplateId:
          type: string
          title: Calendar Meeting Template ID
          description: ID of the calendar meeting template. Used when closingMethod is CALENDAR_MEETING_INTEGRATION.
          format: uuid
        disableNudging:
          type: boolean
          description: When true, automatic follow-up messages (nudges) will be disabled for all conversations in this campaign. Defaults to false. Cannot be used together with a non-empty nudgeSettings array.
          default: false
        nudgeSettings:
          type: array
          description: 'Custom nudge timing configuration. Each entry represents one follow-up nudge with a delayHours field specifying the wait time since the previous message. The array length determines the total number of nudges. An empty array disables nudging. A non-empty array cannot be used together with disableNudging: true. When omitted, defaults to 3 nudges at 24-hour intervals. Note: for WhatsApp campaigns, nudges are only sent after the candidate replies.'
          maxItems: 10
          example:
          - delayHours: 24
          - delayHours: 48
          nullable: true
          items:
            type: object
            properties:
              delayHours:
                type: integer
                description: Hours to wait since the previous message before sending this nudge.
                minimum: 1
            required:
            - delayHours
        language:
          type: string
          enum:
          - en_ca
          - en_gb
          - en_us
          - de
          - es
          - fr
          - it
          - nl
          - nl_be
          - pt
          - pt_br
          - zh_hk
          - ar
          - ja
          - ko
          - ru
          - pl
          - tr
          - hu
          - sv
          - 'no'
          - da
          description: 'Language the campaign operates in: en_ca (Canadian English), en_gb (British English), en_us (American English), de (German), es (Spanish), fr (French), it (Italian), nl (Dutch), nl_be (Flemish), pt (Portuguese), pt_br (Brazilian Portuguese), zh_hk (Chinese), ar (Arabic), ja (Japanese), ko (Korean), ru (Russian), pl (Polish), tr (Turkish), hu (Hungarian), sv (Swedish), no (Norwegian), da (Danish). When omitted, it is derived from the language of openingMessageTemplateId, then from the organization''s language when it supports only one, and finally defaults to en_us. WHATSAPP campaigns are rejected with a 400 when the language has no approved WhatsApp templates for the organization, because WhatsApp follow-up messages require a pre-approved template in the campaign language; set disableNudging to true to opt out of follow-ups and skip that check.'
          default: en_us
      required:
      - campaignType
      - closingMethod
      - channel
      - campaignTitle
      - campaignDescription
      - closingMessage
      - rejectionMessage
      - agentName
      - agentTone
