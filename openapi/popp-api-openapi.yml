openapi: 3.0.0
info:
  title: Popp API
  description: Popp API documentation
  version: '1'
security:
- popp_api_key: []
  organization_id: []
servers:
- url: https://api.joinpopp.com
  description: Development server
paths:
  /v1/agents:
    get:
      summary: List agents
      description: List all agents belonging to the authenticated organization
      operationId: list-agents
      parameters: []
      tags:
      - Agents
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/analyses:
    post:
      summary: Create analysis
      description: Creates a new analysis with the given title, job description, and requirements. Immediately starts processing.
      operationId: create-analysis
      parameters: []
      tags:
      - Analysis
      requestBody:
        description: The input to create an analysis
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisInput'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    get:
      summary: List analyses
      description: 'Lists the organization''s analyses, with optional filtering. Analyses managed by Workflow Builder (`isWorkflowManaged: true`) are left out. A page can hold fewer items than `limit`, or none, and still return a `nextToken`: keep paging until `nextToken` is null.'
      operationId: list-analyses
      parameters:
      - name: limit
        in: query
        description: Maximum number of results to return (1-50)
        required: false
        schema:
          $ref: '#/components/schemas/limit'
      - name: nextToken
        in: query
        description: Pagination token from a previous response
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      - name: status
        in: query
        description: Filter analyses by status
        required: false
        schema:
          $ref: '#/components/schemas/status-3c845253-19cc-46fa-bf36-1e2b52143644'
      - name: externalId
        in: query
        description: Filter analyses by external ID
        required: false
        schema:
          $ref: '#/components/schemas/externalId'
      tags:
      - Analysis
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAnalysesResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/analyses/generate-requirements:
    post:
      summary: Generate requirements
      description: Uses AI to extract requirements from a job description. Stateless - does not create or modify any data.
      operationId: generate-requirements
      parameters: []
      tags:
      - Analysis
      requestBody:
        description: The job description to extract requirements from
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequirementsInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateRequirementsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/analyses/{id}:
    get:
      summary: Get analysis
      description: Get a single analysis with full requirements
      operationId: get-analysis
      parameters:
      - name: id
        in: path
        description: The ID of the analysis to get
        required: true
        schema:
          $ref: '#/components/schemas/id'
      tags:
      - Analysis
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    put:
      summary: Update analysis
      description: Update analysis metadata (title, job description, external ID). Does not update requirements.
      operationId: update-analysis
      parameters:
      - name: id
        in: path
        description: The ID of the analysis to update
        required: true
        schema:
          $ref: '#/components/schemas/id'
      tags:
      - Analysis
      requestBody:
        description: The fields to update (at least one required)
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnalysisInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/analyses/{id}/archive:
    post:
      summary: Archive analysis
      description: 'Archives an analysis (soft delete). Only DRAFT or LIVE analyses can be archived. Archiving an already-archived analysis is idempotent. An analysis managed by Workflow Builder can''t be archived here: the request returns 400, even if the analysis is already archived.'
      operationId: archive-analysis
      parameters:
      - name: id
        in: path
        description: The ID of the analysis to archive
        required: true
        schema:
          $ref: '#/components/schemas/id'
      tags:
      - Analysis
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/analyses/{id}/update-requirements-and-reanalyse:
    post:
      summary: Update requirements and reanalyse
      description: Replaces all requirements on the analysis and triggers re-analysis of existing candidates. Requirements with an ID are updated, without an ID are created, and existing requirements not in the array are deleted. Only DRAFT or LIVE analyses can be updated.
      operationId: update-requirements-and-reanalyse
      parameters:
      - name: id
        in: path
        description: The ID of the analysis to update requirements for
        required: true
        schema:
          $ref: '#/components/schemas/id'
      tags:
      - Analysis
      requestBody:
        description: The new set of requirements
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequirementsInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/analysis/candidates:
    post:
      summary: Create analysis candidate
      description: Queues a CV or questionnaire for scoring against an analysis.
      operationId: create-analysis-candidate
      parameters: []
      tags:
      - Analysis
      requestBody:
        description: The input to create an analysis candidate
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisCandidateInput'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnalysisCandidateResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/ats/jobs:
    get:
      summary: List ATS jobs
      description: Returns a paginated list of the authenticated organization's ATS jobs, read live from your connected ATS and annotated with what each job is connected to in Popp (`workflow`, `campaign`, or `analysis`). Each job includes the available detail — `description` (which may contain HTML), location, salary, employment type, screening questions, hiring-pipeline stages, and any ATS custom fields. Use this to discover the `atsJobId` you need to wire an ATS entry pathway when building an ATS-driven workflow. Results are cursor-paginated — pass the returned `next` value back as the `next` query parameter to fetch the following page. Filtering by a single `atsJobId` still returns an array — of length 0 or 1, never a bare object or a 404. Returns `422` if your connected ATS does not support jobs, or `502` if the ATS integration returns an error.
      operationId: list-ats-jobs
      parameters:
      - name: status
        in: query
        description: 'Filter by normalized job status. Allowed values: `OPEN`, `CLOSED`, `DRAFT`, `ARCHIVED`.'
        required: false
        schema:
          $ref: '#/components/schemas/status-8a98e189-83b3-4600-a5a6-22ce67b183c7'
      - name: updatedAfter
        in: query
        description: Only return jobs updated at or after this ISO-8601 timestamp.
        required: false
        schema:
          $ref: '#/components/schemas/updatedAfter'
      - name: atsJobIds
        in: query
        description: Comma-separated list of `atsJobId`s to restrict the result to. A single-job lookup still returns an array — of length 0 or 1, never a bare object or a 404.
        required: false
        schema:
          $ref: '#/components/schemas/atsJobIds'
      - name: nameContains
        in: query
        description: Filter to jobs whose title contains this keyword.
        required: false
        schema:
          $ref: '#/components/schemas/nameContains'
      - name: jobCodes
        in: query
        description: Comma-separated list of provider requisition / job codes to filter by.
        required: false
        schema:
          $ref: '#/components/schemas/jobCodes'
      - name: pageSize
        in: query
        description: Maximum number of jobs to return per page. Must be an integer between 1 and 250; values outside this range are rejected with a 400.
        required: false
        schema:
          $ref: '#/components/schemas/pageSize'
      - name: next
        in: query
        description: Opaque pagination cursor returned by the previous call. Omit for the first page.
        required: false
        schema:
          $ref: '#/components/schemas/next'
      tags:
      - ATS
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAtsJobsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '502':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/ats/jobs/{atsJobId}/stages:
    get:
      summary: List ATS job stages
      description: Returns the interview pipeline stages for a single ATS job, read live from your connected ATS. Discover the `atsJobId` via [`GET /v1/ats/jobs`](/docs/list-ats-jobs). Returns `422` if your connected ATS does not support job stages, or `502` if the ATS integration returns an error. An empty `stages` list means the job has none configured.
      operationId: list-ats-job-stages
      parameters:
      - name: atsJobId
        in: path
        description: The `atsJobId` (from `GET /v1/ats/jobs`) whose pipeline stages to list.
        required: true
        schema:
          $ref: '#/components/schemas/atsJobId'
      tags:
      - ATS
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAtsJobStagesResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '502':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/ats/rejection-reasons:
    get:
      summary: List ATS rejection reasons
      description: Returns the rejection reasons configured in the authenticated organization's connected ATS, read live. Use the `atsReasonId` values when configuring workflow behaviour that rejects a candidate in the ATS. Returns `422` if your connected ATS does not support rejection reasons, or `502` if the ATS integration returns an error. An empty `rejectionReasons` list means none are configured.
      operationId: list-ats-rejection-reasons
      parameters: []
      tags:
      - ATS
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAtsRejectionReasonsResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '502':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/availability/parse:
    post:
      summary: Parse Availability
      description: Parses natural-language availability text into structured time slots. Supports multi-turn clarification via the messages array. Does NOT save the availability — call PUT /v1/user-calendars/{userCalendarId}/availability after the user confirms.
      operationId: parse-availability
      parameters: []
      tags:
      - Scheduling
      requestBody:
        description: Conversation messages and date/timezone context
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseAvailabilityInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseAvailabilityResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/bookings:
    get:
      summary: List calendar bookings
      description: 'List calendar bookings belonging to the authenticated organization.


        All filters are optional. Results are always scoped to the authenticated organization.


        Results are paginated using a cursor (`nextToken`). To fetch the next page, pass the

        `nextToken` from the previous response back as a query parameter.

        '
      operationId: list-bookings
      parameters:
      - name: campaignId
        in: query
        description: Filter by the campaign that generated the booking
        required: false
        schema:
          $ref: '#/components/schemas/campaignId'
      - name: conversationId
        in: query
        description: Filter by the conversation that generated the booking
        required: false
        schema:
          $ref: '#/components/schemas/conversationId'
      - name: status
        in: query
        description: Filter by booking status
        required: false
        schema:
          $ref: '#/components/schemas/status-fdf66607-6c16-48bb-bc03-7dea3c78657e'
      - name: fromDateTime
        in: query
        description: Only include bookings starting on or after this ISO-8601 datetime
        required: false
        schema:
          $ref: '#/components/schemas/fromDateTime'
      - name: toDateTime
        in: query
        description: Only include bookings starting on or before this ISO-8601 datetime
        required: false
        schema:
          $ref: '#/components/schemas/toDateTime'
      - name: limit
        in: query
        description: 'Maximum number of results to return (1-100, default: 20)'
        required: false
        schema:
          $ref: '#/components/schemas/limit-b96ef13b-e584-424a-928f-64183cf295c1'
      - name: nextToken
        in: query
        description: Pagination cursor from a previous response
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Scheduling
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/bookings/{bookingId}:
    patch:
      summary: Update Booking
      description: "Update an existing booking. Supports updating the title, time, duration,\ndescription, location, and attendees of the meeting. The underlying calendar\nevent is updated and participants are notified by default.\n\nCannot be used on cancelled bookings or to set a start time in the past.\n\nWhen you change the time, the new slot is validated against the meeting\ntemplate it was booked from. The request returns 400, with the reason in the\nresponse message, if the new slot:\n\n  - falls outside the template's open hours\n  - falls inside the template's minimum notice period\n  - falls beyond the template's booking window\n  - overlaps another meeting on the assigned interviewer's calendar,\n    including the template's buffer either side\n\nMoving a booking within its own existing slot is always allowed. Changes\nthat do not alter the time are not validated against the template.\n\nThe request also returns 400 if the template's rules cannot be read at all —\nfor example\
        \ if its scheduler configuration is missing open hours, a notice\nperiod or a booking window, or if the booking's organizer calendar cannot be\nresolved. These are reported separately from a rule that was evaluated and\nfailed, so you can tell \"your time is outside the open hours\" from \"we could\nnot read this template\".\n\nReturns 404 if the booking does not exist, or if it belongs to a different\norganisation than the one tied to the API key.\n"
      operationId: update-booking
      parameters:
      - name: bookingId
        in: path
        description: The unique identifier of the booking
        required: true
        schema:
          $ref: '#/components/schemas/bookingId'
      tags:
      - Scheduling
      requestBody:
        description: The fields to update on the booking
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    get:
      summary: Get a calendar booking
      description: 'Get full details of a calendar booking by ID.


        Returns the booking record only if it belongs to the authenticated organization.

        '
      operationId: get-booking
      parameters:
      - name: bookingId
        in: path
        description: The unique identifier of the calendar booking
        required: true
        schema:
          $ref: '#/components/schemas/bookingId'
      tags:
      - Scheduling
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/bookings/{bookingId}/cancel:
    post:
      summary: Cancel Booking
      description: 'Cancel an existing booking. The underlying calendar event is cancelled

        via Nylas and a cancellation notification is sent to all participants

        by default.


        Returns 404 if the booking does not exist, or if it belongs to a different

        organisation than the one tied to the API key. Returns 409 if the booking

        has already been cancelled. Returns 400 if the booking has already started.

        '
      operationId: cancel-booking
      parameters:
      - name: bookingId
        in: path
        description: The unique identifier of the booking
        required: true
        schema:
          $ref: '#/components/schemas/bookingId'
      tags:
      - Scheduling
      requestBody:
        description: Optional cancellation reason and notification settings
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelBookingResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
