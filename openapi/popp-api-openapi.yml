              description: 'Custom email subject line. Supports placeholders: {{INTERVIEWER_NAME}}, {{CANDIDATE_FIRST_NAME}}, {{AGENT_NAME}}, {{ORGANIZATION_NAME}}, {{CAMPAIGN_OWNER_NAME}}, {{MEETING_AVAILABILITY_TEXT}}.'
              example: Hi {{INTERVIEWER_NAME}}, availability needed
            customTemplatedMessage:
              type: string
              description: Custom email body. Supports the same placeholders as customTemplatedSubjectLine. {{MEETING_AVAILABILITY_TEXT}} expands to the concrete ask (window, hours, timezone) derived from requiredHours and periodDays; it is optional and not validated, so a message that omits it is accepted and the interviewer receives no concrete availability request.
              example: 'Hi {{INTERVIEWER_NAME}},


                {{MEETING_AVAILABILITY_TEXT}}


                Thanks,

                {{AGENT_NAME}}'
            nudgeSettings:
              type: array
              description: 'Follow-up nudge configuration. Each entry represents one nudge. Array length determines total nudges. Default: 3 nudges at 24h intervals.'
              items:
                type: object
                properties:
                  delayHours:
                    type: integer
                    description: Hours to wait since the previous message before sending this nudge.
                    minimum: 1
                required:
                - delayHours
              maxItems: 10
              example:
              - delayHours: 12
              - delayHours: 24
            additionalRecipients:
              type: array
              description: Email addresses CC'd on all outreach communications.
              items:
                type: string
                format: email
              example:
              - recruiter@company.com
