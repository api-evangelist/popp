          type: boolean
          title: Video Conferencing
          description: Whether to include video conferencing for the meeting. If true, videoConferencingProvider is required and location cannot be specified. If false, location is required.
          example: true
        videoConferencingProvider:
          type: string
          title: Video Conferencing Provider
          description: The video conferencing provider to use. Required when videoConferencing is true.
