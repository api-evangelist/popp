                    type: string
                    description: Custom email body for the outreach email to this participant. Supports the same placeholders as customTemplatedSubjectLine. {{MEETING_AVAILABILITY_TEXT}} expands to the concrete ask (window, hours, timezone) derived from requiredHours and periodDays; it is optional and not validated, so a message that omits it is accepted and the participant receives no concrete availability request.
                  nudgeSettings:
                    type: array
                    description: Follow-up nudge configuration. Each entry represents one nudge with a delayHours field. Array length determines total nudges. Empty array disables nudging.
                    items:
                      type: object
                      properties:
                        delayHours:
                          type: integer
                          description: Hours to wait since the previous message before sending this nudge.
                          minimum: 1
                      required:
                      - delayHours
                    maxItems: 10
                  additionalRecipients:
                    type: array
                    description: Email addresses CC'd on all outreach communications (initial email, reply-backs, nudges, cancellation).
                    items:
                      type: string
                      format: email
              availability:
                type: object
                title: Availability
                description: Pre-defined availability time slots for the participant. Only applicable when isCalendarConnected is false.
                properties:
                  timezone:
                    type: string
                    title: Timezone
                    description: IANA timezone string (e.g., 'America/New_York', 'Europe/London'). Must be a valid IANA timezone identifier.
                    example: Europe/London
                  timeSlots:
                    type: array
                    title: Time Slots
                    description: Array of available time windows. All time slots must be in the future.
                    minItems: 1
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          pattern: ^\d{4}-([0][1-9]|1[0-2])-([0][1-9]|[12]\d|3[01])$
                          title: Date
                          description: The date in YYYY-MM-DD format (e.g., '2025-01-15').
                        startTime:
                          type: string
                          pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                          title: Start Time
                          description: The start time in HH:mm format (e.g., '09:00').
                        endTime:
                          type: string
                          pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                          title: End Time
                          description: The end time in HH:mm format (e.g., '17:00').
