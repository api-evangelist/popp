  /v1/meeting-templates/{templateId}:
    get:
      summary: Get meeting template
      description: 'Get full details of a meeting template by ID.


        Returns the complete meeting template configuration including availability settings,

        buffer times, reminder settings, and participant information.


        Use this endpoint when you need the full configuration details. For a list overview

        of meeting templates, use the `/v1/meeting-templates` endpoint instead.


        Returns 404 if the template does not exist, or if it belongs to a different

        organization than the one tied to the API key.

        '
      operationId: get-meeting-template
      parameters:
      - name: templateId
        in: path
        description: The unique identifier of the meeting template
        required: true
        schema:
          $ref: '#/components/schemas/templateId'
      tags:
      - Scheduling
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeetingTemplateResponse'
          headers: {}
        '400':
          description: ''
          content:
