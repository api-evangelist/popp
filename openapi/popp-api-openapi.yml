  /v1/candidates/{id}:
    patch:
      summary: Update a candidate
      description: 'Partially updates an existing candidate profile. Send only the fields you want to change: omitting a field leaves the stored value alone, while sending `null` clears it. This endpoint never creates — an id that does not exist in the caller''s organization group returns 404, so a mistyped id cannot silently produce a new candidate (use `POST /v1/candidates` to create or upsert). Organization context is taken from the authenticated API key, never from the body. A supplied `documentUrl` or `documentBase64` is downloaded during the request, so a failed fetch surfaces as a 502. `documentUrl` is fetched with the organization group''s stored credential when one is registered and unauthenticated when it is not, so a presigned or public URL works; the destination must be an `https` URL resolving to a public address and is not followed through redirects, and one that is refused is a 400 rather than a 502. CV parsing and vectorization always continue asynchronously afterwards, so
        a 200 means the fields are stored, never that the CV has been parsed or indexed. Resending a document with the same bytes keeps its parsed data rather than parsing it again; to force a fresh parse use the reparse endpoint.'
      operationId: update-candidate
      parameters:
      - name: id
        in: path
        description: Candidate profile id (UUID).
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      tags:
      - Candidates
      requestBody:
        required: true
        description: The fields to change
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCandidateResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
