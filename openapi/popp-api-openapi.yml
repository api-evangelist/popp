              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    put:
      summary: Update Meeting Template
      description: 'Updates a calendar meeting template by ID.


        Nearly every field is required, so in practice a call supplies the template''s

        whole configuration rather than a patch. The optional fields behave

        differently: **omitting one leaves the stored value unchanged — it does not

        clear it.** `guestLabel` accepts `null` to clear it explicitly, and

        `availabilityOutreachSettings` is merged field by field, so you can send only

        the keys you want to change and the rest are preserved. `availabilityMethod`

        follows the same rule: omit it and the template keeps its current method

        instead of reverting to `COLLECTIVE`, and the participants you send are

        validated against whichever method results.


        `location` does not keep its stored value on an in-person template

        (`videoConferencing: false`). Send it on every update, also when the stored

        template already has an address, or the update returns 400.


        **`meetingParticipants` is also an exception, and the sharp edge: the array you

        send becomes the template''s entire panel, so a participant currently on the

        template but missing from your payload is removed from it.** There is no

        partial update of a single participant.


        The intended flow is read-modify-write. Call

        [Get Meeting Template](#operation/get-meeting-template), change what you need,

        and send the whole thing back. Every field this endpoint requires is returned

        by that read except `isCalendarConnected`, which you supply per participant.

        `openHours` is returned alongside `availability` in exactly the shape this

        endpoint expects, and `videoConferencingProvider` comes back for templates

        that use video conferencing.


        Returns 404 if the template does not exist, or if it belongs to a different

        organization than the one tied to the API key.

        '
      operationId: update-meeting-template
      parameters:
      - name: templateId
        in: path
        description: The unique identifier of the meeting template
        required: true
        schema:
          $ref: '#/components/schemas/templateId'
      tags:
      - Scheduling
      requestBody:
        description: The updated meeting template configuration
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeetingTemplateInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMeetingTemplateResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    delete:
      summary: Delete Meeting Template
      description: 'Deletes a calendar meeting template by ID.


        Returns 404 if the template does not exist, or if it belongs to a different

        organisation than the one tied to the API key.


        Returns 409 Conflict if the template is referenced by an active campaign or

        has scheduled future bookings.

        '
      operationId: delete-meeting-template
      parameters:
