    StartWorkflowRunsInput:
      type: object
      description: Send at least one candidate across `candidateProfileIds`, `candidateProfileExternalIds` and `contacts`, and no more than 5,000 in total.
      properties:
        candidateProfileIds:
          type: array
          title: Candidate Profile IDs
          description: List of Popp candidate profile IDs to enrol into the workflow.
          items:
            type: string
            minLength: 1
            title: Candidate Profile ID
            description: Popp candidate profile identifier.
        candidateProfileExternalIds:
          type: array
          title: Candidate Profile External IDs
          description: Your external IDs for existing candidate profiles in your organization.
          items:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[\w.-]+$
            title: Candidate Profile External ID
            description: External identifier in the format ^[\w.-]+$.
        contacts:
          type: array
          title: Contacts
          description: Inline contact details. Each contact is resolved to or created as a candidate profile, then enrolled into the workflow. Use this when you do not yet have a Popp candidate profile for the contact.
          items:
            type: object
            properties:
              firstName:
                type: string
                minLength: 1
                title: First Name
                description: Contact's first name.
              lastName:
                type: string
                title: Last Name
                description: Contact's last name.
              email:
                type: string
                format: email
                title: Email
                description: Contact's email address. At least one of `email` or `phoneNumber` is required per contact.
              phoneNumber:
                type: string
                pattern: ^\+[1-9]\d{1,14}$
                title: Phone Number
                description: Contact's phone number in E.164 format. At least one of `email` or `phoneNumber` is required per contact.
              externalId:
                type: string
                minLength: 1
                maxLength: 256
                pattern: ^[\w.-]+$
                title: External ID
                description: Your own ID for the contact.
              tags:
                type: array
                title: Tags
                description: 'Plain candidate tags for this contact. Only inline contacts carry tags: `candidateProfileIds` and `candidateProfileExternalIds` do not. Popp trims each tag and collapses repeated whitespace, keeping casing and punctuation, and stores tags that differ only in casing or repeated whitespace once, with the first spelling sent. Blank tags, tags over 250 characters, and tags past a contact''s 4,096-byte budget (UTF-8 size of the tag list as a JSON array) are dropped rather than rejected; only a malformed shape returns 400. Tags are added to your organization''s tag catalog shortly after the run is created.'
                items:
                  type: string
                  title: Tag
                example:
                - nurse
                - night-shift
              tagsObject:
                type: object
                title: Tags Object
                description: Key/value candidate tags for this contact. Each entry becomes a `key:value` tag (no space after the colon), added after `tags`. Popp trims the key and the value separately; a blank key or a blank value produces no tag. Composed tags then follow the same rules as `tags`. A non-string value returns 400.
                additionalProperties:
                  type: string
                example:
                  recruiter_id: '1234567890'
                  recruiter_name: John Doe
                  recruiter_email: john.doe@example.com
            required:
            - firstName
            additionalProperties: false
        triggerMetadata:
          type: string
          title: Trigger Metadata
          description: Your metadata for this batch of runs, as a JSON-encoded string. It appears in each run's `context` when applicable.
      additionalProperties: false
    StartWorkflowRunsResponse:
      type: object
