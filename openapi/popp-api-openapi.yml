          type: integer
          title: Notice Period Minutes
          description: Minimum notice required for booking in minutes.
          minimum: 0
          default: 0
          example: 60
        availableDaysInTheFuture:
          type: integer
          title: Available Days In The Future
          description: How far ahead a candidate may book on the booking page, in days. Distinct from availabilityOutreachSettings.periodDays, which controls the window interviewers are asked to offer availability within. Neither field caps the other.
