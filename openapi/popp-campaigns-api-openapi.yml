openapi: 3.2.0
info:
  title: Popp Campaigns API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Campaigns
paths:
  /v1/campaigns:
    post:
      summary: Create Campaign
      description: Creates a campaign in Popp application.
      operationId: create-campaign
      parameters: []
      tags:
      - Campaigns
      requestBody:
        description: Create Campaign Request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCampaignResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    get:
      summary: List campaigns
      description: List all campaigns in Popp application
      operationId: list-campaigns
      parameters:
      - name: limit
        in: query
        description: The limit parameter
        required: false
        schema:
          $ref: '#/components/schemas/limit'
      - name: nextToken
        in: query
        description: The next token parameter
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      - name: campaignTitle
        in: query
        description: Filter campaigns by title
        required: false
        schema:
          $ref: '#/components/schemas/campaignTitle'
      - name: campaignStatus
        in: query
        description: Filter campaigns by status (comma-separated for multiple values)
        required: false
        schema:
          $ref: '#/components/schemas/campaignStatus'
      - name: campaignType
        in: query
        description: Filter campaigns by type
        required: false
        schema:
          $ref: '#/components/schemas/campaignType-3b31177b-4f80-4990-b9e7-b07ee5ae2ade'
      - name: channel
        in: query
        description: Filter campaigns by communication channel
        required: false
        schema:
          $ref: '#/components/schemas/channel-d7b2fd6e-9a72-4b90-adf5-a8c00a58fa0d'
      - name: needsReview
        in: query
        description: Filter campaigns by review status
        required: false
        schema:
          $ref: '#/components/schemas/needsReview'
      - name: closingMethod
        in: query
        description: Filter campaigns by closing method
        required: false
        schema:
          $ref: '#/components/schemas/closingMethod'
      - name: externalId
        in: query
        description: Filter campaigns by external ID
        required: false
        schema:
          $ref: '#/components/schemas/externalId'
      tags:
      - Campaigns
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCampaignsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/campaigns/{campaignId}:
    get:
      summary: Get campaign
      description: Get a campaign
      operationId: get-campaign
      parameters:
      - name: campaignId
        in: path
        description: The ID of the campaign to get
        required: true
        schema:
          $ref: '#/components/schemas/campaignId'
      tags:
      - Campaigns
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    put:
      summary: Update Campaign
      description: Updates an existing campaign. All fields are optional but at least one must be provided. Questions cannot be updated after creation. Setting campaignStatus to ARCHIVED will stop the campaign. Setting campaignStatus to LIVE will activate a DRAFT campaign.
      operationId: update-campaign
      parameters:
      - name: campaignId
        in: path
        description: The ID of the campaign to update
        required: true
        schema:
          $ref: '#/components/schemas/campaignId'
      tags:
      - Campaigns
      requestBody:
        description: Update Campaign Request
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCampaignResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/campaigns/{campaignId}/stop:
    post:
      summary: Stop Campaign
      description: Stops a campaign and optionally sends a cancellation message to candidates
      operationId: stop-campaign
      parameters:
      - name: campaignId
        in: path
        description: The ID of the campaign to stop
        required: true
        schema:
          $ref: '#/components/schemas/campaignId'
      tags:
      - Campaigns
      requestBody:
        description: Stop Campaign Request
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopCampaignRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopCampaignResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/generate-preferred-answer-requirements:
    post:
      summary: Generate Preferred Answer Requirements
      description: Turns a campaign question and its preferred answer into a list of scoring statements. The returned list can be posted straight back as that question's preferredAnswerRequirements on create or update campaign. Stateless - does not create or modify any data.
      operationId: generate-preferred-answer-requirements
      parameters: []
      tags:
      - Campaigns
      requestBody:
        description: The question and the preferred answer to derive scoring statements from
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePreferredAnswerRequirementsInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratePreferredAnswerRequirementsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/generate-questions:
    post:
      summary: Generate Questions
      description: Generates interview questions from a job description using Popp agent
      operationId: generate-questions
      parameters: []
      tags:
      - Campaigns
      requestBody:
        description: Generate screening questions for a campaign from a job description
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQuestionsInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateQuestionsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
components:
  schemas:
    GenerateQuestionsResponse:
      type: object
      properties:
        closedQuestions:
          type: array
          title: Closed Questions
          description: List of closed-ended questions generated from the job description.
          items:
            type: object
            properties:
              content:
                type: string
                description: The question text.
            required:
            - content
        openEndedQuestions:
          type: array
          title: Open Ended Questions
          description: List of open-ended questions generated from the job description.
          items:
            type: object
            properties:
              content:
                type: string
                description: The question text.
              preferredAnswer:
                type: string
                description: The preferred answer for this question.
            required:
            - content
            - preferredAnswer
      required:
      - closedQuestions
      - openEndedQuestions
      additionalProperties: false
    GeneratePreferredAnswerRequirementsResponse:
      type: object
      required:
      - preferredAnswerRequirements
      properties:
        preferredAnswerRequirements:
          type: array
          description: Scoring statements derived from the preferred answer. Pass this list back as the question's preferredAnswerRequirements when creating or updating a campaign.
          items:
            type: string
      additionalProperties: false
    Campaign:
      title: Campaign
      description: Schema for a campaign
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the campaign
        organizationId:
          type: string
          format: uuid
          description: Identifier of the organization that owns the campaign
        type:
          type:
          - string
          - 'null'
          enum:
          - APPLICANT_OUTREACH
          - NEW_CANDIDATE_OUTREACH
          - ENGAGEMENT_OUTREACH
          description: Type of the campaign
        channel:
          type:
          - string
          - 'null'
          enum:
          - SMS
          - WHATSAPP
          - WEB_CHAT
          - WEB_CHAT_VIA_EMAIL
          description: Channel through which the campaign is conducted
        emailChannelFallbackEnabled:
          type:
          - boolean
          - 'null'
          description: Campaign-level email fallback setting. null means the campaign inherits the organization-level setting; true or false is an explicit campaign override.
        closingMethod:
          type:
          - string
          - 'null'
          enum:
          - CUSTOM
          - CALENDAR_MEETING_INTEGRATION
          description: Closing method for the campaign
        templateId:
          type:
          - string
          - 'null'
          description: ID of the template used for the campaign
        campaignTitle:
          type:
          - string
          - 'null'
          description: Title of the campaign
        campaignDescription:
          type:
          - string
          - 'null'
          description: Description of the job for the campaign
        additionalContext:
          type:
          - string
          - 'null'
          description: Additional context or notes for the campaign
        externalId:
          type:
          - string
          - 'null'
          description: External identifier for the campaign
        isWorkflowManaged:
          type:
          - boolean
          - 'null'
          description: True when the campaign is managed by Workflow Builder. Mutation endpoints (POST /v1/conversations, POST /v1/conversations/bulk, POST /v1/conversations/scheduling, PATCH /v1/campaigns/{id}, POST /v1/campaigns/{id}/stop) reject such campaigns with 400 — start work via POST /v1/workflows/{workflowId}/runs instead. See the Workflow Builder guide.
        workflowId:
          type:
          - string
          - 'null'
          description: Identifier of the workflow that owns this campaign. Null when the campaign is not workflow-managed.
        workflowVersionId:
          type:
          - string
          - 'null'
          description: Identifier of the workflow version that owns this campaign. Null when the campaign is not workflow-managed.
        workflowNodeId:
          type:
          - string
          - 'null'
          description: Identifier of the workflow node that owns this campaign. Null when the campaign is not workflow-managed.
        conversationTimeout:
          type:
          - number
          - 'null'
          description: Time in hours to automatically close conversations
        owner:
          type:
          - string
          - 'null'
          format: email
          description: Owner's email address
        rejectionMessage:
          type:
          - string
          - 'null'
          description: Message sent upon rejection
        closingMessage:
          type:
          - string
          - 'null'
          description: Message sent when the campaign is closed
        customRequest:
          type:
          - string
          - 'null'
          description: Custom request for the campaign
        campaignStatus:
          type: string
          enum:
          - ARCHIVED
          - DISCONNECTED
          - DRAFT
          - FINISHED_GENERATING
          - FINISHED_SENDING
          - GENERATING_MESSAGES
          - LIVE
          - PAUSED
          - PROCESSING
          - SCHEDULED
          - SENDING_MESSAGES
          description: Current status of the campaign
        needsReview:
          type: boolean
          description: Indicates if the campaign needs review
        disableNudging:
          type:
          - boolean
          - 'null'
          description: When true, automatic follow-up messages (nudges) are disabled for all conversations in this campaign
        nudgeSettings:
          type:
          - array
          - 'null'
          description: 'Custom nudge timing configuration. Each entry represents one follow-up nudge. Null when using default behavior (3 nudges at 24-hour intervals). Note: for WhatsApp campaigns, nudges are only sent after the candidate replies.'
          items:
            type: object
            properties:
              delayHours:
                type: integer
                description: Hours to wait since the previous message before sending this nudge.
                minimum: 1
        jobDescriptionParsed:
          type:
          - object
          - 'null'
          description: Parsed job description details
          required:
          - employerName
          - jobTitle
          - summaryOfRole
          additionalProperties: false
          properties:
            employerName:
              type: string
              description: Name of the employer
            jobTitle:
              type: string
              description: Title of the job
            summaryOfRole:
              type: string
              description: Summary of the role
        agent:
          type:
          - object
          - 'null'
          description: Agent managing the campaign
          required:
          - id
          - agentName
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
              description: ID of the agent
            agentName:
              type: string
              description: Name of the agent
            agentTone:
              type:
              - string
              - 'null'
              enum:
              - CASUAL
              - PROFESSIONAL
              - NEUTRAL
              - FRIENDLY
              - MOTIVATIONAL
              - CUSTOM
              - ENCOURAGING
              description: Tone used by the agent
        questions:
          type:
          - array
          - 'null'
          description: List of screening questions for the campaign
          items:
            type: object
            oneOf:
            - properties:
                questionType:
                  type: string
                  enum:
                  - TEXT
                  description: Type of the question
                isMandatory:
                  type:
                  - boolean
                  - 'null'
                  description: Indicates if the question is mandatory
                content:
                  type: string
                  description: Content of the question
                documentTypes:
                  type:
                  - array
                  - 'null'
                  description: Deprecated free-text list of document types required. Null on TEXT questions and on DOCUMENT questions that use `documentItems` instead.
                  items:
                    type: string
                documentItems:
                  type:
                  - array
                  - 'null'
                  description: Typed references to DocumentType records. Null on TEXT questions and on DOCUMENT questions that use the deprecated `documentTypes` field instead.
                  items:
                    type: object
                    properties:
                      documentTypeId:
                        type: string
                        format: uuid
                      documentTypeName:
                        type:
                        - string
                        - 'null'
                hasPreferredAnswer:
                  type:
                  - boolean
                  - 'null'
                  description: Whether this question has preferred answer criteria
                preferredAnswerRequirements:
                  type:
                  - array
                  - 'null'
                  description: List of requirements the preferred answer should meet
                  items:
                    type: string
                preferredAnswerText:
                  type:
                  - string
                  - 'null'
                  description: Example of a preferred answer text
              required:
              - questionType
              - isMandatory
              - content
              additionalProperties: false
            - properties:
                questionType:
                  type: string
                  enum:
                  - DOCUMENT
                  description: Type of the question
                isMandatory:
                  type:
                  - boolean
                  - 'null'
                  description: Indicates if the question is mandatory
                content:
                  type:
                  - string
                  - 'null'
                  description: Content of the question
                documentTypes:
                  type:
                  - array
                  - 'null'
                  description: Deprecated free-text list of document types required. Null when the question uses `documentItems` instead.
                  items:
                    type: string
                documentItems:
                  type:
                  - array
                  - 'null'
                  description: Typed references to DocumentType records. Null when the question uses the deprecated `documentTypes` field instead.
                  items:
                    type: object
                    properties:
                      documentTypeId:
                        type: string
                        format: uuid
                      documentTypeName:
                        type:
                        - string
                        - 'null'
              required:
              - questionType
              - isMandatory
              additionalProperties: false
        language:
          type:
          - string
          - 'null'
          enum:
          - en_ca
          - en_gb
          - en_us
          - de
          - es
          - fr
          - it
          - nl
          - nl_be
          - pt
          - pt_br
          - zh_hk
          - ar
          - ja
          - ko
          - ru
          - pl
          - tr
          - hu
          - sv
          - 'no'
          - da
          description: 'Language the campaign operates in: en_ca (Canadian English), en_gb (British English), en_us (American English), de (German), es (Spanish), fr (French), it (Italian), nl (Dutch), nl_be (Flemish), pt (Portuguese), pt_br (Brazilian Portuguese), zh_hk (Chinese), ar (Arabic), ja (Japanese), ko (Korean), ru (Russian), pl (Polish), tr (Turkish), hu (Hungarian), sv (Swedish), no (Norwegian), da (Danish).'
      required:
      - id
      - organizationId
      - status
      - needsReview
      additionalProperties: false
    campaignType-3b31177b-4f80-4990-b9e7-b07ee5ae2ade:
      type: string
      enum:
      - APPLICANT_OUTREACH
      - ENGAGEMENT_OUTREACH
      - NEW_CANDIDATE_OUTREACH
    limit:
      type: integer
    GeneratePreferredAnswerRequirementsInput:
      type: object
      required:
      - content
      - preferredAnswerText
      properties:
        content:
          type: string
          minLength: 1
          description: The question text, as it is asked of the candidate.
        preferredAnswerText:
          type: string
          minLength: 1
          description: A free-text description of what a strong answer to the question looks like.
      additionalProperties: false
    externalId:
      type: string
    closingMethod:
      type: string
      enum:
      - CUSTOM
      - CALENDAR_MEETING_INTEGRATION
    campaignTitle:
      type: string
    StopCampaignRequest:
      description: Request to stop a campaign
      type: object
      properties:
        sendCancellationMessage:
          type: boolean
          description: Whether to send a cancellation message to candidates
          default: false
        cancellationMessage:
          type: string
          description: The cancellation message to send to candidates. Required when sendCancellationMessage is true.
          minLength: 1
          maxLength: 1000
        availabilityOutreachCancellationMessage:
          type: string
          description: Optional cancellation message sent to interviewer/availability-outreach conversations when a scheduling campaign stop cascades to its linked availability-outreach campaign. A system default is used if omitted.
          minLength: 1
          maxLength: 1000
      additionalProperties: false
    needsReview:
      type: string
      enum:
      - 'true'
      - 'false'
    campaignStatus:
      type: string
      enum:
      - ARCHIVED
      - DISCONNECTED
      - DRAFT
      - FINISHED_GENERATING
      - FINISHED_SENDING
      - GENERATING_MESSAGES
      - LIVE
      - PAUSED
      - PROCESSING
      - SCHEDULED
      - SENDING_MESSAGES
    CreateCampaignResponse:
      title: Create Campaign Response
      description: Response for creating a new campaign
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the campaign
        organizationId:
          type: string
          format: uuid
          description: Identifier of the organization that owns the campaign
        type:
          type:
          - string
          - 'null'
          enum:
          - APPLICANT_OUTREACH
          - NEW_CANDIDATE_OUTREACH
          - ENGAGEMENT_OUTREACH
          description: Type of the campaign
        channel:
          type:
          - string
          - 'null'
          enum:
          - SMS
          - WHATSAPP
          - WEB_CHAT
          - WEB_CHAT_VIA_EMAIL
          description: Channel through which the campaign is conducted
        emailChannelFallbackEnabled:
          type:
          - boolean
          - 'null'
          description: Campaign-level email fallback setting. null means the campaign inherits the organization-level setting; true or false is an explicit campaign override.
        closingMethod:
          type:
          - string
          - 'null'
          enum:
          - CUSTOM
          - CALENDAR_MEETING_INTEGRATION
          description: Closing method for the campaign
        templateId:
          type:
          - string
          - 'null'
          description: ID of the template used for the campaign
        campaignTitle:
          type:
          - string
          - 'null'
          description: Title of the campaign
        campaignDescription:
          type:
          - string
          - 'null'
          description: Description of the job for the campaign
        additionalContext:
          type:
          - string
          - 'null'
          description: Additional context or notes for the campaign
        externalId:
          type:
          - string
          - 'null'
          description: External identifier for the campaign
        isWorkflowManaged:
          type:
          - boolean
          - 'null'
          description: True when the campaign is managed by Workflow Builder. Mutation endpoints (POST /v1/conversations, POST /v1/conversations/bulk, POST /v1/conversations/scheduling, PATCH /v1/campaigns/{id}, POST /v1/campaigns/{id}/stop) reject such campaigns with 400 — start work via POST /v1/workflows/{workflowId}/runs instead. See the Workflow Builder guide.
        workflowId:
          type:
          - string
          - 'null'
          description: Identifier of the workflow that owns this campaign. Null when the campaign is not workflow-managed.
        workflowVersionId:
          type:
          - string
          - 'null'
          description: Identifier of the workflow version that owns this campaign. Null when the campaign is not workflow-managed.
        workflowNodeId:
          type:
          - string
          - 'null'
          description: Identifier of the workflow node that owns this campaign. Null when the campaign is not workflow-managed.
        conversationTimeout:
          type:
          - number
          - 'null'
          description: Time in hours to automatically close conversations
        owner:
          type:
          - string
          - 'null'
          format: email
          description: Owner's email address
        rejectionMessage:
          type:
          - string
          - 'null'
          description: Message sent upon rejection
        closingMessage:
          type:
          - string
          - 'null'
          description: Message sent when the campaign is closed
        customRequest:
          type:
          - string
          - 'null'
          description: Custom request for the campaign
        campaignStatus:
          type: string
          enum:
          - ARCHIVED
          - DISCONNECTED
          - DRAFT
          - FINISHED_GENERATING
          - FINISHED_SENDING
          - GENERATING_MESSAGES
          - LIVE
          - PAUSED
          - PROCESSING
          - SCHEDULED
          - SENDING_MESSAGES
          description: Current status of the campaign
        needsReview:
          type: boolean
          description: Indicates if the campaign needs review
        disableNudging:
          type:
          - boolean
          - 'null'
          description: When true, automatic follow-up messages (nudges) are disabled for all conversations in this campaign
