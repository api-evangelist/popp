openapi: 3.2.0
info:
  title: Popp Candidate Lists API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Candidate Lists
paths:
  /v1/candidates/lists:
    get:
      summary: List candidate lists
      description: Returns the candidate lists in the caller's organization, most recently created first. Paginated with `limit` + `nextToken`, and filterable by `title` and/or `externalId`. To fetch a single list by external id, prefer `GET /v1/candidates/lists/by-external-id/{externalId}`.
      operationId: list-candidate-lists
      parameters:
      - name: limit
        in: query
        description: Maximum number of items per page (1-50). Defaults to 20.
        required: false
        schema:
          $ref: '#/components/schemas/limit-a3b97378-091e-4028-9712-d5c4378acc90'
      - name: nextToken
        in: query
        description: Pagination token returned by a previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      - name: title
        in: query
        description: Filter to lists whose title contains this value (case-sensitive substring).
        required: false
        schema:
          $ref: '#/components/schemas/title'
      - name: externalId
        in: query
        description: Filter to the list with this exact external id.
        required: false
        schema:
          $ref: '#/components/schemas/externalId-54b05c44-4f05-495b-9986-cd68c2e6bcbc'
      - name: sortDirection
        in: query
        description: Sort direction by creation date. Defaults to DESC.
        required: false
        schema:
          $ref: '#/components/schemas/sortDirection'
      tags:
      - Candidate Lists
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCandidateListsResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a candidate list
      description: Creates an empty candidate list in the caller's organization. `title` is required; `description`, `externalId` and `owner` are optional. `externalId` must be unique within the organization. `owner` is the email of the user who owns the list, defaulting to the API key's user; it must be a user of the organization.
      operationId: create-candidate-list
      parameters: []
      tags:
      - Candidate Lists
      requestBody:
        required: true
        description: Candidate list payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateListRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateList'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/lists/by-external-id/{externalId}:
    get:
      summary: Get a candidate list by external ID
      description: Returns the candidate list in the caller's organization with the given external ID, together with a page of its members. Members are paginated with `limit` + `nextToken`. Returns 404 when no list matches.
      operationId: get-candidate-list-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Caller-supplied external identifier matching ^[\w.-]+$ (1-256 characters).
        required: true
        schema:
          $ref: '#/components/schemas/externalId-92fa0687-a4e8-42af-8325-3c8bb6e02144'
      - name: limit
        in: query
        description: Maximum number of members per page (1-50). Defaults to 20.
        required: false
        schema:
          $ref: '#/components/schemas/limit-7f749a1b-a0e6-492a-87db-e427ce2e68ab'
      - name: nextToken
        in: query
        description: Pagination token for members returned by a previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Candidate Lists
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateListWithMembers'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update a candidate list by external ID
      description: 'Updates the candidate list with the given external ID. Updates `title`, `description`, `owner` and/or `externalId`; at least one field must be provided; pass `description: null` to clear it. Pass `externalId` to set or change the list''s external ID (after which the old one no longer finds it), or `externalId: null` to clear it; the list''s id does not change. An `externalId` already held by another list in the organization returns 409, and lookups by external ID can take a moment to reflect a change. Pass `owner` (an email) to hand the list to another user of the organization; an unknown email or one outside the organization returns 400. Returns 404 when no list matches.'
      operationId: update-candidate-list-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Caller-supplied external identifier matching ^[\w.-]+$ (1-256 characters).
        required: true
        schema:
          $ref: '#/components/schemas/externalId-e07e9c24-bfca-47cc-b768-50d539759d7b'
      tags:
      - Candidate Lists
      requestBody:
        required: true
        description: Fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateListRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateList'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a candidate list by external ID
      description: Deletes the candidate list with the given external ID and all of its memberships. Returns 204 on success and 404 when no list matches in the caller's organization.
      operationId: delete-candidate-list-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Caller-supplied external identifier matching ^[\w.-]+$ (1-256 characters).
        required: true
        schema:
          $ref: '#/components/schemas/externalId-43d6255b-2122-4ebc-ab6c-22b914867dc8'
      tags:
      - Candidate Lists
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/lists/by-external-id/{externalId}/candidates:
    post:
      summary: Add candidates to a list by external ID
      description: Adds one or more candidate profiles to the list with the given external ID, addressed by profile id (`candidateIds`) and/or external id (`candidateProfileExternalIds`). Candidates already on the list are skipped, so the call is idempotent. Returns 204 on success, 400 when a candidate external id matches no candidate, and 404 when no list matches.
      operationId: add-candidates-to-list-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Caller-supplied external identifier matching ^[\w.-]+$ (1-256 characters).
        required: true
        schema:
          $ref: '#/components/schemas/externalId-f6b2ce10-5419-4daa-933a-80df9ef7df5e'
      tags:
      - Candidate Lists
      requestBody:
        required: true
        description: Candidates to add, by profile id and/or external id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateListMembersRequest'
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove candidates from a list by external ID
      description: Removes one or more candidate profiles from the list with the given external ID, addressed by profile id (`candidateIds`) and/or external id (`candidateProfileExternalIds`). Candidates not on the list are ignored. Returns 204 on success, 400 when a candidate external id matches no candidate, and 404 when no list matches.
      operationId: remove-candidates-from-list-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Caller-supplied external identifier matching ^[\w.-]+$ (1-256 characters).
        required: true
        schema:
          $ref: '#/components/schemas/externalId-368f8beb-4afa-46e9-9595-5b8756ba01e6'
      tags:
      - Candidate Lists
      requestBody:
        required: true
        description: Candidates to remove, by profile id and/or external id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateListMembersRequest'
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/lists/{id}:
    get:
      summary: Get a candidate list
      description: Returns a candidate list with a page of its members. Members are paginated with `limit` + `nextToken`; each member includes the candidate profile id, external id (when available), name, email, title, company and the `addedAt` timestamp (when the candidate was added to the list). Returns 404 when the list is not found in the caller's organization.
      operationId: get-candidate-list
      parameters:
      - name: id
        in: path
        description: Candidate list id (UUID).
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      - name: limit
        in: query
        description: Maximum number of members per page (1-50). Defaults to 20.
        required: false
        schema:
          $ref: '#/components/schemas/limit-dbeebae8-4f90-464f-adc1-b18e5e7bf516'
      - name: nextToken
        in: query
        description: Pagination token for members returned by a previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Candidate Lists
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateListWithMembers'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update a candidate list
      description: 'Updates a candidate list''s `title`, `description`, `owner` and/or `externalId`. At least one field must be provided; pass `description: null` to clear it. Pass `externalId` to set or change the list''s external ID, or `externalId: null` to clear it; the list''s id does not change. An `externalId` already held by another list in the organization returns 409, and lookups by external ID can take a moment to reflect a change. Pass `owner` (an email) to hand the list to another user of the organization; an unknown email or one outside the organization returns 400. Returns 404 when the list is not found in the caller''s organization.'
      operationId: update-candidate-list
      parameters:
      - name: id
        in: path
        description: Candidate list id (UUID).
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      tags:
      - Candidate Lists
      requestBody:
        required: true
        description: Fields to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateListRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateList'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a candidate list
      description: Deletes a candidate list and all of its memberships. Returns 204 on success and 404 when the list is not found in the caller's organization.
      operationId: delete-candidate-list
      parameters:
      - name: id
        in: path
        description: Candidate list id (UUID).
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      tags:
      - Candidate Lists
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/lists/{id}/candidates:
    post:
      summary: Add candidates to a list
      description: Adds one or more candidate profiles to a list, addressed by profile id (`candidateIds`) and/or external id (`candidateProfileExternalIds`). Candidates already on the list are skipped, so the call is idempotent. Returns 204 on success, 400 when an external id matches no candidate, and 404 when the list is not found in the caller's organization.
      operationId: add-candidates-to-list
      parameters:
      - name: id
        in: path
        description: Candidate list id (UUID).
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      tags:
      - Candidate Lists
      requestBody:
        required: true
        description: Candidates to add, by profile id and/or external id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateListMembersRequest'
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove candidates from a list
      description: Removes one or more candidate profiles from a list, addressed by profile id (`candidateIds`) and/or external id (`candidateProfileExternalIds`). Candidates not on the list are ignored. Returns 204 on success, 400 when an external id matches no candidate, and 404 when the list is not found in the caller's organization.
      operationId: remove-candidates-from-list
      parameters:
      - name: id
        in: path
        description: Candidate list id (UUID).
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      tags:
      - Candidate Lists
      requestBody:
        required: true
        description: Candidates to remove, by profile id and/or external id
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateListMembersRequest'
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    externalId-368f8beb-4afa-46e9-9595-5b8756ba01e6:
      type: string
      pattern: ^[\w.-]+$
      minLength: 1
      maxLength: 256
    CandidateList:
      type: object
      description: A candidate list — a named, user-curated collection of candidate profiles within an organization.
      properties:
        id:
          type: string
          format: uuid
          title: List ID
          description: Unique identifier for the candidate list.
        title:
          type: string
          title: Title
          description: Human-readable name of the list.
        description:
          type:
          - string
          - 'null'
          title: Description
          description: Optional free-text description of the list.
        externalId:
          type:
          - string
          - 'null'
          title: External ID
          description: Caller-supplied external identifier for the list, when set.
        owner:
          type:
          - string
          - 'null'
          format: email
          title: Owner
          description: Email of the user who owns the list. Null when that user no longer exists.
        candidatesCount:
          type: integer
          title: Candidates Count
          description: Number of candidate profiles currently on the list.
        createdAt:
          type: string
          format: date-time
          title: Created At
          description: When the list was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          title: Updated At
          description: When the list was last updated (ISO 8601).
      required:
      - id
      - title
      - description
      - externalId
      - owner
      - candidatesCount
      - createdAt
      - updatedAt
      additionalProperties: false
    externalId-43d6255b-2122-4ebc-ab6c-22b914867dc8:
      type: string
      pattern: ^[\w.-]+$
      minLength: 1
      maxLength: 256
    limit-a3b97378-091e-4028-9712-d5c4378acc90:
      type: integer
      minimum: 1
      maximum: 50
    ListCandidateListsResponse:
      type: object
      properties:
        items:
          type: array
          description: Candidate lists in the caller's organization.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              description:
                type:
                - string
                - 'null'
              externalId:
                type:
                - string
                - 'null'
              owner:
                type:
                - string
                - 'null'
                format: email
              candidatesCount:
                type: integer
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
            required:
            - id
            - title
            - description
            - externalId
            - owner
            - candidatesCount
            - createdAt
            - updatedAt
            additionalProperties: false
        nextToken:
          type:
          - string
          - 'null'
          description: Pass back as `nextToken` to fetch the next page. Null when there are no more results.
      required:
      - items
      - nextToken
      additionalProperties: false
    externalId-54b05c44-4f05-495b-9986-cd68c2e6bcbc:
      type: string
      pattern: ^[\w.-]+$
    externalId-e07e9c24-bfca-47cc-b768-50d539759d7b:
      type: string
      pattern: ^[\w.-]+$
      minLength: 1
      maxLength: 256
    CandidateListWithMembers:
      type: object
      description: A candidate list together with a page of its members.
      properties:
        id:
          type: string
          format: uuid
          title: List ID
          description: Unique identifier for the candidate list.
        title:
          type: string
          title: Title
          description: Human-readable name of the list.
        description:
          type:
          - string
          - 'null'
          title: Description
          description: Optional free-text description of the list.
        externalId:
          type:
          - string
          - 'null'
          title: External ID
          description: Caller-supplied external identifier for the list, when set.
        owner:
          type:
          - string
          - 'null'
          format: email
          title: Owner
          description: Email of the user who owns the list. Null when that user no longer exists.
        candidatesCount:
          type: integer
          title: Candidates Count
          description: Number of candidate profiles currently on the list.
        createdAt:
          type: string
          format: date-time
          title: Created At
          description: When the list was created (ISO 8601).
        updatedAt:
          type: string
          format: date-time
          title: Updated At
          description: When the list was last updated (ISO 8601).
        candidates:
          type: array
          title: Members
          description: A page of candidate profiles on this list.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Candidate profile id.
              externalId:
                type:
                - string
                - 'null'
                description: Caller-supplied external identifier of the candidate profile, when available.
              name:
                type:
                - string
                - 'null'
                description: Candidate's name.
              email:
                type:
                - string
                - 'null'
                description: Candidate's email address.
              title:
                type:
                - string
                - 'null'
                description: Candidate's job title.
              company:
                type:
                - string
                - 'null'
                description: Candidate's company.
              addedAt:
                type: string
                format: date-time
                description: When the candidate was added to the list (ISO 8601).
            required:
            - id
            - externalId
            - name
            - email
            - title
            - company
            - addedAt
            additionalProperties: false
        nextToken:
          type:
          - string
          - 'null'
          description: Pass back as `nextToken` to fetch the next page of members. Null when there are no more results.
      required:
      - id
      - title
      - description
      - externalId
      - owner
      - candidatesCount
      - createdAt
      - updatedAt
      - candidates
      - nextToken
      additionalProperties: false
    CandidateListMembersRequest:
      type: object
      description: Candidates to add to or remove from a list, addressable by Popp candidate profile id and/or by caller-supplied external id. Provide at least one id across the two fields; the combined total cannot exceed 100.
      properties:
        candidateIds:
          type: array
          description: Candidate profile ids (UUIDs).
          maxItems: 100
          items:
            type: string
            format: uuid
        candidateProfileExternalIds:
          type: array
          description: Candidate profile external ids, resolved to profile ids within the caller's organization. An external id that matches no candidate returns 400.
