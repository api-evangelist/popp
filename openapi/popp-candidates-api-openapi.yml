openapi: 3.2.0
info:
  title: Popp Candidates API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Candidates
paths:
  /v1/candidates:
    post:
      summary: Create a candidate
      description: 'Creates a candidate profile in the caller''s organization, or upserts an existing one when the same `externalId` is re-posted. Organization context is taken from the authenticated API key, never from the body. `mode` controls only how much of the work the request waits for — specifically, whether the document is downloaded before responding. In `SYNC` mode the profile is created and, when `documentUrl` is supplied, the document is downloaded during the request (201 when newly created, 200 when an existing profile was upserted), so a failed download surfaces as a 502 on this call. In `ASYNC` mode the work is queued and 202 is returned immediately with the resolved candidate id, and the document is downloaded in the background. CV parsing and vectorization are **always** asynchronous, in both modes: a 2xx means the profile exists — and in `SYNC`, that the document was fetched — never that the CV has been parsed or indexed. A CV can be attached via `documentUrl` or inline `documentBase64` (`SYNC` only). `documentUrl` is fetched server-side: the organization group''s stored credential is sent when one is registered, and the URL is fetched unauthenticated when it is not, so a presigned or otherwise public URL works without any credential being set up. The destination must be an `https` URL resolving to a public address and is not followed through redirects; one that is refused is a 400, not a 502, because retrying cannot help.'
      operationId: create-candidate
      parameters: []
      tags:
      - Candidates
      requestBody:
        required: true
        description: Candidate payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCandidateResponse'
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCandidateResponse'
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCandidateAcceptedResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/by-email/{email}:
    delete:
      summary: Delete candidates by email
      description: As `DELETE /v1/candidates/{id}`, addressed by email. An address can match several candidates; every match in your organization is deleted and the response lists their ids.
      operationId: delete-candidate-by-email
      parameters:
      - name: email
        in: path
        description: URL-encoded email address. Matched case-insensitively.
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_email'
      tags:
      - Candidates
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCandidateResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/by-external-id/{externalId}:
    patch:
      summary: Update a candidate by external ID
      description: 'Partially updates an existing candidate profile, addressed by the caller''s own identifier rather than Popp''s. Behaves exactly like `PATCH /v1/candidates/{id}`: send only the fields you want to change — omitting a field leaves the stored value alone, while sending `null` clears it — and the endpoint never creates. An `externalId` with no candidate in the caller''s organization group returns 404, so a mistyped identifier cannot silently produce a new candidate (use `POST /v1/candidates` to create or upsert). Organization context is taken from the authenticated API key, never from the body. A supplied `documentUrl` or `documentBase64` is downloaded during the request, so a failed fetch surfaces as a 502. `documentUrl` is fetched with the organization group''s stored credential when one is registered and unauthenticated when it is not, so a presigned or public URL works; the destination must be an `https` URL resolving to a public address and is not followed through redirects, and one that is refused is a 400 rather than a 502. CV parsing and vectorization always continue asynchronously afterwards, so a 200 means the fields are stored, never that the CV has been parsed or indexed. Resending a document with the same bytes keeps its parsed data rather than parsing it again; to force a fresh parse use the reparse endpoint.'
      operationId: update-candidate-by-external-id
      parameters:
      - name: externalId
        in: path
        description: The caller-supplied identifier the candidate was created with.
        required: true
        schema:
          $ref: '#/components/schemas/externalId'
      tags:
      - Candidates
      requestBody:
        required: true
        description: The fields to change
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCandidateResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Get a candidate by external ID
      description: Returns a candidate profile addressed by the caller's own identifier. The lookup is scoped to the authenticated organization group, so an external id in use by another tenant is never reachable and returns 404 — the same response as an external id that exists nowhere. Where more than one candidate in the group somehow shares an external id, the first match is returned and the collision is logged. The response is identical in shape to `GET /v1/candidates/{id}`.
      operationId: get-candidate-by-external-id
      parameters:
      - name: externalId
        in: path
        description: The caller-supplied identifier, in the format ^[\w.-]+$.
        required: true
        schema:
          $ref: '#/components/schemas/externalId'
      tags:
      - Candidates
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCandidateResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a candidate by external ID
      description: As `DELETE /v1/candidates/{id}`, addressed by your own external identifier.
      operationId: delete-candidate-by-external-id
      parameters:
      - name: externalId
        in: path
        description: The caller-supplied identifier, in the format ^[\\w.-]+$.
        required: true
        schema:
          $ref: '#/components/schemas/externalId'
      tags:
      - Candidates
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCandidateResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/by-external-id/{externalId}/document:
    delete:
      summary: Remove a candidate CV by external ID
      description: Addressed by the caller's own identifier. Removes the candidate's CV without deleting the candidate. Every stored version of the document is deleted, the CV-extracted values (the fromCv fields, jobs, education and the like) are cleared, and the candidate is re-indexed on the data you provided, so it stays searchable on that alone. Skills and qualifications are kept as stored. A candidate with no CV returns 200 with a message saying it is already unparsed. A candidate still being processed returns 409; retry once processing completes.
      operationId: remove-candidate-document-by-external-id
      parameters:
      - name: externalId
        in: path
        description: The caller-supplied identifier the candidate was created with.
        required: true
        schema:
          $ref: '#/components/schemas/externalId'
      tags:
      - Candidates
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateCvResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/by-external-id/{externalId}/notes:
    get:
      summary: List a candidate's notes by external ID
      description: 'Every note held about this candidate, newest first: notes added through this API and notes synced from your ATS. Notes are free text written by a recruiter and are searchable — they feed the same index as the candidate''s CV. They are never shown to candidates.'
      operationId: list-candidate-notes-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Your own id for the candidate
        required: true
        schema:
          $ref: '#/components/schemas/externalId'
      - name: limit
        in: query
        description: Notes per page, 1 to 50. Defaults to 20.
        required: false
        schema:
          $ref: '#/components/schemas/limit'
      - name: nextToken
        in: query
        description: 'Token from a previous response, to fetch the next page. Keep paging until nextToken is null: a page can hold fewer than limit.'
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Candidates
      responses:
        '200':
          description: The candidate's notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCandidateNotesResponse'
        '401':
          description: Missing or invalid API key.
        '404':
          description: No candidate with this external ID in your organization.
    post:
      summary: Add a note to a candidate by external ID
      description: Records a note against the candidate. Notes are free text and searchable — they feed the same index as the candidate's CV, so the candidate becomes findable on words in the note shortly afterwards. Notes are never shown to candidates. `priority` and `sourceTime` place the re-index in the processing queue, exactly as on a candidate update; they default to priority 0 and the time of the request.
      operationId: create-candidate-note-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Your own id for the candidate
        required: true
        schema:
          $ref: '#/components/schemas/externalId'
      tags:
      - Candidates
      requestBody:
        required: false
        description: The note to add.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateNoteRequest'
      responses:
        '201':
          description: The note as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateNoteResponse'
        '400':
          description: The note is empty or longer than 20,000 characters.
        '404':
          description: No candidate with this external ID in your organization.
  /v1/candidates/by-external-id/{externalId}/reparse:
    post:
      summary: Re-parse a candidate CV by external ID
      description: Addressed by the caller's own identifier. Parses the candidate's stored CV again and re-indexes the candidate, even when the document is unchanged. Use it when parsing failed or should be refreshed. Allowed in any status. Returns 202 once queued; the outcome arrives as the CANDIDATE_PROCESSING_STARTED, CANDIDATE_PROCESSING_COMPLETED and CANDIDATE_PROCESSING_FAILED webhooks. Each re-parse runs a full extraction.
      operationId: reparse-candidate-cv-by-external-id
      parameters:
      - name: externalId
        in: path
        description: The caller-supplied identifier the candidate was created with.
        required: true
        schema:
          $ref: '#/components/schemas/externalId'
      tags:
      - Candidates
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateCvResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/by-phone-number/{phoneNumber}:
    delete:
      summary: Delete candidates by phone number
      description: As `DELETE /v1/candidates/{id}`, addressed by phone number. A number can match several candidates; every match in your organization is deleted and the response lists their ids.
      operationId: delete-candidate-by-phone-number
      parameters:
      - name: phoneNumber
        in: path
        description: URL-encoded phone number in E.164 format, e.g. %2B447700900123. A local-format number without a country code is rejected rather than guessed at.
        required: true
        schema:
          $ref: '#/components/schemas/phoneNumber'
      tags:
      - Candidates
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCandidateResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/{id}:
    patch:
      summary: Update a candidate
      description: 'Partially updates an existing candidate profile. Send only the fields you want to change: omitting a field leaves the stored value alone, while sending `null` clears it. This endpoint never creates — an id that does not exist in the caller''s organization group returns 404, so a mistyped id cannot silently produce a new candidate (use `POST /v1/candidates` to create or upsert). Organization context is taken from the authenticated API key, never from the body. A supplied `documentUrl` or `documentBase64` is downloaded during the request, so a failed fetch surfaces as a 502. `documentUrl` is fetched with the organization group''s stored credential when one is registered and unauthenticated when it is not, so a presigned or public URL works; the destination must be an `https` URL resolving to a public address and is not followed through redirects, and one that is refused is a 400 rather than a 502. CV parsing and vectorization always continue asynchronously afterwards, so a 200 means the fields are stored, never that the CV has been parsed or indexed. Resending a document with the same bytes keeps its parsed data rather than parsing it again; to force a fresh parse use the reparse endpoint.'
      operationId: update-candidate
      parameters:
      - name: id
        in: path
        description: Candidate profile id (UUID).
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      tags:
      - Candidates
      requestBody:
        required: true
        description: The fields to change
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCandidateRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCandidateResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Get a candidate
      description: Returns a candidate profile by its Popp id. Organization context is taken from the authenticated API key, never from the path. A candidate that does not exist and one that belongs to a different organization group both return 404 — the two are deliberately not distinguished, so an id cannot be probed against another tenant. The response carries the canonical fields alongside a `fromCv` block holding what CV parsing extracted; those are read-only and may differ from the canonical values where a caller has supplied its own. `location.geoCoordinates` is populated asynchronously by processing, so a candidate read shortly after a create may carry a location with no coordinates yet.
      operationId: get-candidate
      parameters:
      - name: id
        in: path
        description: Candidate profile id (UUID).
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      tags:
      - Candidates
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCandidateResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a candidate
      description: 'Permanently deletes the candidate with this Popp id and everything held about them: profile, notes, list memberships, attachments, every CV version, the screening answers from each ATS application, the vector index and the Twilio conversation. Analysis records, their score history and conversations are kept with personal data stripped, so reporting counts stay intact. Requirement results and score history keep whether each requirement was met, but not the evidence quoted for it or the screening answers. Returns 202 as soon as the work is queued; the work itself runs asynchronously and completion is signalled by the CANDIDATE_DELETED webhook. Irreversible. Backups retain pre-deletion values for up to 35 days. Imported workflow contacts are deleted only where they were already matched to this candidate; an unmatched import row is left, because nothing on it identifies which candidate it belongs to.'
      operationId: delete-candidate
      parameters:
      - name: id
        in: path
        description: Candidate profile id (UUID).
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      tags:
      - Candidates
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCandidateResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/{id}/document:
    delete:
      summary: Remove a candidate CV
      description: Removes the candidate's CV without deleting the candidate. Every stored version of the document is deleted, the CV-extracted values (the fromCv fields, jobs, education and the like) are cleared, and the candidate is re-indexed on the data you provided, so it stays searchable on that alone. Skills and qualifications are kept as stored. A candidate with no CV returns 200 with a message saying it is already unparsed. A candidate still being processed returns 409; retry once processing completes.
      operationId: remove-candidate-document
      parameters:
      - name: id
        in: path
        description: Candidate profile id (UUID).
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      tags:
      - Candidates
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateCvResponse'
        '400':
          description: ''
          content:
            application/json:
