openapi: 3.2.0
info:
  title: Popp Document Credentials API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Document Credentials
paths:
  /v1/document-credentials:
    post:
      summary: Register Document Credential
      description: 'Register a credential Popp uses to fetch a candidate''s protected documentUrl. Stored at the organization-group level behind your API key. Only one credential is allowed per organization group; if one already exists, this returns 409 (update it with PATCH or remove it first). The token is write-only: it is encrypted at rest and never returned. Popp sends it as the {headerTokenKey} header over HTTPS. Authenticated with your API key alone.'
      operationId: create-document-credential
      parameters: []
      tags:
      - Document Credentials
      security:
      - popp_api_key: []
      requestBody:
        description: The credential to register.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentCredentialRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCredential'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    get:
      summary: List Document Credentials
      description: List the document-fetch credentials for the organization group behind your API key (paginated). Tokens are never returned. Authenticated with your API key alone.
      operationId: list-document-credentials
      parameters:
      - name: limit
        in: query
        description: Maximum number of items per page (1-50). Defaults to 20.
        required: false
        schema:
          $ref: '#/components/schemas/limit-104ed3a6-fe93-428e-850f-2c854880f17b'
      - name: nextToken
        in: query
        description: Pagination token returned by a previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Document Credentials
      security:
      - popp_api_key: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDocumentCredentialsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/document-credentials/{id}:
    patch:
      summary: Update Document Credential
      description: 'Update or rotate a document-fetch credential. Send only the fields you are changing (for example { "token": "..." } to rotate the key). The token is write-only and never returned. A credential in another organization group returns 404. Authenticated with your API key alone.'
      operationId: update-document-credential
      parameters:
      - name: id
        in: path
        description: The document credential id.
        required: true
        schema:
          $ref: '#/components/schemas/id'
      tags:
      - Document Credentials
      security:
      - popp_api_key: []
      requestBody:
        description: The fields to change.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentCredentialRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCredential'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    delete:
      summary: Delete Document Credential
      description: Remove a document-fetch credential. A credential in another organization group returns 404. Authenticated with your API key alone.
      operationId: delete-document-credential
      parameters:
      - name: id
        in: path
        description: The document credential id.
        required: true
        schema:
          $ref: '#/components/schemas/id'
      tags:
      - Document Credentials
      security:
      - popp_api_key: []
      responses:
        '204':
          description: ''
          content: {}
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
components:
  schemas:
    ListDocumentCredentialsResponse:
      title: ListDocumentCredentialsResponse
      type: object
      properties:
        items:
          type: array
          description: Document-fetch credentials in the organization group. Tokens are never returned.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              headerTokenKey:
                type: string
              createdAt:
                type: string
                format: date-time
            required:
            - id
            - name
            - headerTokenKey
            - createdAt
            additionalProperties: false
        nextToken:
          type:
          - string
          - 'null'
      required:
      - items
      - nextToken
      additionalProperties: false
    UpdateDocumentCredentialRequest:
      title: UpdateDocumentCredentialRequest
      type: object
      description: Send only the fields you are changing. At least one is required.
      minProperties: 1
      properties:
        name:
          type: string
        headerTokenKey:
          type: string
        token:
          type: string
          description: New token value to rotate to (max 4096 bytes). Encrypted at rest and never returned.
      additionalProperties: false
    nextToken:
      type: string
    CreateDocumentCredentialRequest:
      title: CreateDocumentCredentialRequest
      type: object
      required:
      - name
      - headerTokenKey
      - token
      properties:
        name:
          type: string
          description: A label for the credential.
        headerTokenKey:
          type: string
          description: Header name Popp should send the token under, e.g. x-api-key or Authorization.
        token:
          type: string
          description: The API key value (max 4096 bytes). Encrypted at rest and never returned.
      additionalProperties: false
    limit-104ed3a6-fe93-428e-850f-2c854880f17b:
      type: integer
      minimum: 1
      maximum: 50
    ErrorResponse:
      type: object
    id:
      type: string
    DocumentCredential:
      title: DocumentCredential
      type: object
      description: A document-fetch credential. The token is write-only and is never returned.
      properties:
        id:
          type: string
        name:
          type: string
        headerTokenKey:
          type: string
          description: Header name Popp sends the token under, e.g. x-api-key.
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - headerTokenKey
      - createdAt
      additionalProperties: false
  securitySchemes:
    popp_api_key:
      description: Your Popp API key for authentication
      type: apiKey
      name: x-api-key
      in: header
    organization_id:
      description: Your organization's unique identifier
      type: apiKey
      name: x-organization-id
      in: header
