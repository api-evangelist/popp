              description: true protects this characteristic and the search agent refuses to search on it; false allows it.
            pregnancyStatusBias:
              type: boolean
              description: true protects this characteristic and the search agent refuses to search on it; false allows it.
            veteranStatusBias:
              type: boolean
              description: true protects this characteristic and the search agent refuses to search on it; false allows it.
            criminalHistoryBias:
              type: boolean
              description: true protects this characteristic and the search agent refuses to search on it; false allows it.
            medicalConditionsBias:
              type: boolean
              description: true protects this characteristic and the search agent refuses to search on it; false allows it.
            englishProficiencyBias:
              type: boolean
              description: true protects this characteristic and the search agent refuses to search on it; false allows it.
          additionalProperties: false
      minProperties: 1
      additionalProperties: false
    ErrorResponse:
      type: object
    externalOrganizationId:
      type: string
    CreateOrganizationConfigRequest:
      type: object
      properties:
        agentId:
          type: string
          description: A valid ID of an existing agent. Cannot be used together with agentName and agentTone.
        agentName:
          type: string
          description: Name of the agent. Must be provided together with agentTone. Cannot be used with agentId.
        agentTone:
          type: string
          enum:
          - CASUAL
          - ENCOURAGING
          - FRIENDLY
          - MOTIVATIONAL
          - NEUTRAL
          - PROFESSIONAL
          description: Tone of the agent. Must be provided together with agentName. Cannot be used with agentId.
        conversationTimeout:
          type: number
          minimum: 24
