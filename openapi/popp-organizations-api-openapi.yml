openapi: 3.2.0
info:
  title: Popp Organizations API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Organizations
paths:
  /v1/organizations:
    get:
      summary: List Organizations
      description: 'List the organizations the authenticated user can access. Organization-group admins receive every organization in their group; other users receive the organizations they are a member of. This endpoint is authenticated with your API key alone: the `x-organization-id` header is not required (it is scoped to the user behind the API key). Use a returned organization id as the `x-organization-id` header to scope subsequent requests to that organization.'
      operationId: list-organizations
      parameters:
      - name: limit
        in: query
        description: Maximum number of items per page (1-50). Defaults to 20.
        required: false
        schema:
          $ref: '#/components/schemas/limit-7528f827-6a22-4938-8e75-e72819e20066'
      - name: nextToken
        in: query
        description: Pagination token returned by a previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Organizations
      security:
      - popp_api_key: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrganizationsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/organizations/{id}:
    patch:
      summary: Update Organization
      description: Update an organization's name and/or your own external identifier for it. Provide at least one field. Scoped to the organization group behind your API key; an organization in another group returns 404. Authenticated with your API key alone.
      operationId: update-organization-details
      parameters:
      - name: id
        in: path
        description: The organization id.
        required: true
        schema:
          $ref: '#/components/schemas/id'
      tags:
      - Organizations
      security:
      - popp_api_key: []
      requestBody:
        description: The organization fields to update.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    get:
      summary: Get Organization
      description: Get a single organization by id, including your own external identifier for it. Scoped to the organization group behind your API key; an organization in another group returns 404. Authenticated with your API key alone.
      operationId: get-organization-details
      parameters:
      - name: id
        in: path
        description: The organization id.
        required: true
        schema:
          $ref: '#/components/schemas/id'
      tags:
      - Organizations
      security:
      - popp_api_key: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
components:
  schemas:
    UpdateOrganizationRequest:
      title: UpdateOrganizationRequest
      description: At least one of name or externalOrganizationId must be provided.
      type: object
      properties:
        name:
          type: string
          description: The organization's display name.
        externalOrganizationId:
          type: string
          description: Your own identifier for this organization, echoed back on user and organization responses.
      minProperties: 1
      additionalProperties: false
    nextToken:
      type: string
    ListOrganizationsResponse:
      type: object
      properties:
        items:
          type: array
          description: Organizations the authenticated user can access.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              organizationGroupId:
                type:
                - string
                - 'null'
              externalOrganizationId:
                type:
                - string
                - 'null'
                description: Your own external identifier for the organization, or null if none is set.
              isHidden:
                type: boolean
                description: Whether the organization is hidden.
            required:
            - id
            - name
            - organizationGroupId
            - externalOrganizationId
            - isHidden
            additionalProperties: false
        nextToken:
          type:
          - string
          - 'null'
          description: Pass back as `nextToken` to fetch the next page. Null when there are no more results.
      required:
      - items
      - nextToken
      additionalProperties: false
    ErrorResponse:
      type: object
    limit-7528f827-6a22-4938-8e75-e72819e20066:
      type: integer
      minimum: 1
      maximum: 50
    id:
      type: string
    OrganizationSummary:
      title: OrganizationSummary
      description: An organization's identity fields.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the organization.
        name:
          type: string
          description: Name of the organization.
        organizationGroupId:
          type:
          - string
          - 'null'
          description: The organization group this organization belongs to.
        externalOrganizationId:
          type:
          - string
          - 'null'
          description: Your own identifier for this organization, if one has been set.
        isHidden:
          type: boolean
          description: Whether the organization is hidden.
      required:
      - id
      - name
      - organizationGroupId
      - externalOrganizationId
      - isHidden
      additionalProperties: false
  securitySchemes:
    popp_api_key:
      description: Your Popp API key for authentication
      type: apiKey
      name: x-api-key
      in: header
    organization_id:
      description: Your organization's unique identifier
      type: apiKey
      name: x-organization-id
      in: header
