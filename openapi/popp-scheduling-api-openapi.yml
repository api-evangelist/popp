  /v1/meeting-templates:
    get:
      summary: List meeting templates
      description: 'Search and list meeting templates belonging to the authenticated organization.


        All search filters are optional. Results are always scoped to the authenticated organization.


        **Note:** For full meeting template details (including configuration options like buffer,

        reminder settings, and availability), use the `/v1/meeting-templates/{templateId}` endpoint.'
      operationId: list-meeting-templates
      parameters:
      - name: title
        in: query
        description: Search by title (partial match supported)
        required: false
        schema:
          $ref: '#/components/schemas/title'
      - name: status
        in: query
        description: Filter by status
        required: false
        schema:
          $ref: '#/components/schemas/status-68e07924-ed96-48a5-906e-ede3549d53d4'
      - name: location
        in: query
        description: Search by location (partial match supported)
        required: false
        schema:
          $ref: '#/components/schemas/location'
      - name: isVideoConference
        in: query
        description: Filter by video conferencing enabled
        required: false
        schema:
          $ref: '#/components/schemas/isVideoConference'
      - name: limit
        in: query
        description: 'Maximum number of results to return (1-100, default: 100)'
        required: false
        schema:
          $ref: '#/components/schemas/limit-272b2660-f5ad-4a2e-aaf5-9174ff8f57b9'
      - name: nextToken
        in: query
        description: Pagination token from previous response
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Scheduling
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMeetingTemplatesResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    post:
      summary: Create Meeting Template
      description: Creates a calendar meeting template for scheduling meetings. The template defines meeting parameters such as duration, participants, availability, and video conferencing settings.
      operationId: create-meeting-template
      parameters: []
      tags:
      - Scheduling
      requestBody:
        description: The input to create a meeting template
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingTemplateInput'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMeetingTemplateResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/meeting-templates/{templateId}:
    get:
      summary: Get meeting template
      description: 'Get full details of a meeting template by ID.


        Returns the complete meeting template configuration including availability settings,

        buffer times, reminder settings, and participant information.


        Use this endpoint when you need the full configuration details. For a list overview

        of meeting templates, use the `/v1/meeting-templates` endpoint instead.


        Returns 404 if the template does not exist, or if it belongs to a different

        organization than the one tied to the API key.'
      operationId: get-meeting-template
      parameters:
      - name: templateId
        in: path
        description: The unique identifier of the meeting template
        required: true
        schema:
          $ref: '#/components/schemas/templateId'
      tags:
      - Scheduling
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeetingTemplateResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    put:
      summary: Update Meeting Template
      description: 'Updates a calendar meeting template by ID.


        Nearly every field is required, so in practice a call supplies the template''s

        whole configuration rather than a patch. The optional fields behave

        differently: **omitting one leaves the stored value unchanged — it does not

        clear it.** `guestLabel` accepts `null` to clear it explicitly, and

        `availabilityOutreachSettings` is merged field by field, so you can send only

        the keys you want to change and the rest are preserved. `availabilityMethod`

        follows the same rule: omit it and the template keeps its current method

        instead of reverting to `COLLECTIVE`, and the participants you send are

        validated against whichever method results.


        `location` does not keep its stored value on an in-person template

        (`videoConferencing: false`). Send it on every update, also when the stored

        template already has an address, or the update returns 400.


        **`meetingParticipants` is also an exception, and the sharp edge: the array you

        send becomes the template''s entire panel, so a participant currently on the

        template but missing from your payload is removed from it.** There is no

        partial update of a single participant.


        The intended flow is read-modify-write. Call

        Get Meeting Template, change what you need,

        and send the whole thing back. Every field this endpoint requires is returned

        by that read except `isCalendarConnected`, which you supply per participant.

        `openHours` is returned alongside `availability` in exactly the shape this

        endpoint expects, and `videoConferencingProvider` comes back for templates

        that use video conferencing.


        Returns 404 if the template does not exist, or if it belongs to a different

        organization than the one tied to the API key.'
      operationId: update-meeting-template
      parameters:
      - name: templateId
        in: path
        description: The unique identifier of the meeting template
        required: true
        schema:
          $ref: '#/components/schemas/templateId'
      tags:
      - Scheduling
      requestBody:
        description: The updated meeting template configuration
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeetingTemplateInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMeetingTemplateResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    delete:
      summary: Delete Meeting Template
      description: 'Deletes a calendar meeting template by ID.


        Returns 404 if the template does not exist, or if it belongs to a different

        organisation than the one tied to the API key.


        Returns 409 Conflict if the template is referenced by an active campaign or

        has scheduled future bookings.'
      operationId: delete-meeting-template
      parameters:
      - name: templateId
        in: path
        description: The unique identifier of the meeting template
        required: true
        schema:
          $ref: '#/components/schemas/templateId'
      tags:
      - Scheduling
      responses:
        '204':
          description: ''
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/scheduling/conversations:
    post:
      summary: Create auto-schedule conversation
      description: Creates a scheduling conversation in Popp application. This endpoint is used for meeting scheduling workflows where participants can provide their availability and a meeting will be scheduled automatically.
      operationId: create-scheduling-conversation
      parameters: []
      tags:
      - Scheduling
      requestBody:
        description: The input to create a scheduling conversation
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchedulingConversationInput'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSchedulingConversationResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/user-calendars:
    get:
      summary: List User Calendars
      description: List user calendars connected to the requesting organization. Use this to discover the `userCalendarId` needed to publish availability via PUT /v1/user-calendars/{userCalendarId}/availability.
      operationId: list-user-calendars
      parameters:
      - name: provider
        in: query
        description: Filter by provider.
        required: false
        schema:
          $ref: '#/components/schemas/provider'
      - name: status
        in: query
        description: Filter by connection status.
        required: false
        schema:
          $ref: '#/components/schemas/status-e42c6b84-3eed-4a37-8a05-cf2140d60597'
      - name: email
        in: query
        description: Exact-match email lookup.
        required: false
        schema:
          $ref: '#/components/schemas/email'
      - name: limit
        in: query
        description: Maximum number of items per page (1–50). Defaults to 20.
        required: false
        schema:
          $ref: '#/components/schemas/limit-af1e6b3b-98fc-4525-898e-9eaf97e70859'
      - name: nextToken
        in: query
        description: Pagination token returned by a previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Scheduling
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserCalendarsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/user-calendars/{userCalendarId}:
    get:
      summary: Get User Calendar
      description: Fetch a single user calendar by id. Returns 404 if the calendar does not exist or does not belong to the requesting organization (the API does not leak existence across organizations).
      operationId: get-user-calendar
      parameters:
      - name: userCalendarId
        in: path
        description: The user calendar ID (discoverable via GET /v1/user-calendars).
        required: true
        schema:
          $ref: '#/components/schemas/userCalendarId'
      tags:
      - Scheduling
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCalendar'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/user-calendars/{userCalendarId}/availability:
    put:
      summary: Set User Calendar Availability
      description: Saves confirmed availability time slots to a participant's virtual calendar. Once all required participants for a meeting have availability recorded, the scheduling link is generated and sent to the candidate automatically.
      operationId: set-user-calendar-availability
      parameters:
      - name: userCalendarId
        in: path
        description: The ID of the virtual calendar to save availability against (discoverable via GET /v1/user-calendars).
        required: true
        schema:
          $ref: '#/components/schemas/userCalendarId'
      tags:
      - Scheduling
