components:
  schemas:
    ResendBookingUrlResponse:
      type: object
      title: Resend Booking URL Response
      description: Response from the resend booking URL endpoint.
      properties:
        message:
          type: string
          title: Message
          description: A confirmation message indicating the booking URL resend has been scheduled.
          example: Booking URL resend triggered
        conversationId:
          type: string
          title: Conversation ID
          description: The ID of the conversation that will receive the new booking URL.
          example: conv_abc123
        calendarMeetingTemplateId:
          type: string
          title: Calendar Meeting Template ID
          description: The ID of the meeting template used for generating the booking URL.
          example: cmt_xyz789
      required:
      - message
      - conversationId
      - calendarMeetingTemplateId
      additionalProperties: false
    BookingResponse:
      type: object
      properties:
        bookingId:
          type: string
          title: Booking ID
          example: booking-123
        conversationId:
          type: string
          title: Conversation ID
          example: conv-123
        campaignId:
          type: string
          title: Campaign ID
          example: camp-123
        title:
          type: string
          title: Title
          example: Technical Interview Round 2
        startDateTime:
          type: string
          format: date-time
          title: Start Date Time
          example: '2026-03-20T14:00:00Z'
        endDateTime:
          type: string
          format: date-time
          title: End Date Time
          example: '2026-03-20T14:45:00Z'
        description:
          type: string
          title: Description
          example: Technical deep-dive
        location:
          type: string
          title: Location
          example: Room 3B
        attendees:
          type: array
          title: Attendees
          items:
            type: object
            properties:
              email:
                type: string
                format: email
              name:
                type: string
            required:
            - email
            - name
        status:
          type: string
          title: Status
          enum:
          - SCHEDULED
          - CANCELLED
          - RESCHEDULED
          - RESCHEDULING_REQUESTED
          example: SCHEDULED
      required:
      - bookingId
      - conversationId
      - campaignId
      - title
      - startDateTime
      - endDateTime
      - description
      - location
      - attendees
      - status
      additionalProperties: false
    CreateMeetingTemplateResponse:
      type: object
      properties:
        message:
          type: string
          title: Message
          example: Meeting template created successfully
        data:
          type: object
          properties:
            id:
              type: string
              title: ID
              description: The unique identifier of the created meeting template.
              example: template-123
          required:
          - id
          additionalProperties: false
      required:
      - message
      - data
      additionalProperties: false
    ParseAvailabilityResponse:
      type: object
      properties:
        message:
          type: string
          title: Assistant Message
          description: Human-readable assistant reply to display. A confirmation when status=complete, a follow-up question when status=clarification_needed, or an explanation when status=error.
        availability:
          title: Parsed Availability
          description: Populated when status=complete; null otherwise.
          type:
          - object
          - 'null'
          properties:
            timezone:
              type: string
              description: IANA timezone for the returned time slots.
            timeSlots:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: Slot date (YYYY-MM-DD).
                  startTime:
                    type: string
                    pattern: ^\d{2}:\d{2}$
                    description: Local start time (HH:MM, 24h).
                  endTime:
                    type: string
                    pattern: ^\d{2}:\d{2}$
                    description: Local end time (HH:MM, 24h).
                required:
                - date
                - startTime
                - endTime
                additionalProperties: false
          required:
          - timezone
          - timeSlots
          additionalProperties: false
        status:
          type: string
          enum:
          - complete
          - clarification_needed
          - error
          description: complete = slots ready (client may save); clarification_needed = ask follow-up; error = input not parseable.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Model confidence in the result.
      required:
      - message
      - availability
      - status
      - confidence
      additionalProperties: false
    status-68e07924-ed96-48a5-906e-ede3549d53d4:
      type: string
      enum:
      - ACTIVE
      - ARCHIVED
    location:
      type: string
    bookingId:
      type: string
    UpdateMeetingTemplateInput:
      type: object
      properties:
        meetingParticipants:
          type: array
          title: Meeting Participants
          description: 'The complete participant panel for the meeting. The array you send becomes the panel, so a participant currently on the template but absent from this list is removed from it. There is no way to update a single participant in isolation — read the template first with Get Meeting Template and send its meetingParticipants back with isCalendarConnected added to each. For a COLLECTIVE meeting exactly one participant must be the organizer; for a round-robin availabilityMethod the pool must contain 2 to 10 participants and no organizer is required. Every participant must be able to supply availability one of three ways: a connected calendar (isCalendarConnected true), pre-defined availability.timeSlots, or autoCollectAvailability.'
          minItems: 1
          items:
            type: object
            properties:
              isOrganizer:
                type: boolean
                title: Is Organizer
                description: Whether this participant is the meeting organizer. Defaults to false when omitted. Exactly one participant must be the organizer for a COLLECTIVE meeting; a round-robin availabilityMethod needs none.
                default: false
                example: true
              isCalendarConnected:
                type: boolean
                title: Is Calendar Connected
                description: Whether this participant has a connected calendar in Popp.
                example: true
              name:
                type: string
                title: Name
                description: The full name of the participant.
                example: John Doe
              email:
                type: string
                format: email
                title: Email
                description: The email address of the participant.
                example: john@example.com
              autoCollectAvailability:
                type: boolean
                title: Auto Collect Availability
                description: If true, Popp emails this participant to ask for their availability instead of reading a calendar. Requires isCalendarConnected to be false. Any number of participants on the template can have this enabled — for a COLLECTIVE meeting Popp collects from each of them and books a slot that works for the whole panel.
              availabilityOutreachSettings:
                type: object
                title: Availability Outreach Settings
                description: Per-participant overrides for availability outreach. Fields not specified fall back to template-level settings, then system defaults.
                properties:
                  requiredHours:
                    type: integer
                    description: Hours of availability to ask this participant for. A target the agent nudges toward, not a minimum that gates booking — Popp will book inside a shorter overlap if that is all it has.
                    minimum: 1
                    maximum: 168
                  periodDays:
                    type: integer
                    description: The window this participant is asked to offer availability within, in days, and the window their reply is read against. Distinct from the top-level availableDaysInTheFuture, which controls how far ahead a candidate may book.
                    minimum: 7
                    maximum: 60
                  customTemplatedSubjectLine:
                    type: string
                    description: 'Custom email subject line for the outreach email to this participant. Supports placeholders: {{INTERVIEWER_NAME}}, {{CANDIDATE_FIRST_NAME}}, {{AGENT_NAME}}, {{ORGANIZATION_NAME}}, {{CAMPAIGN_OWNER_NAME}}, {{MEETING_AVAILABILITY_TEXT}}.'
                  customTemplatedMessage:
                    type: string
                    description: Custom email body for the outreach email to this participant. Supports the same placeholders as customTemplatedSubjectLine. {{MEETING_AVAILABILITY_TEXT}} expands to the concrete ask (window, hours, timezone) derived from requiredHours and periodDays; it is optional and not validated, so a message that omits it is accepted and the participant receives no concrete availability request.
                  nudgeSettings:
                    type: array
                    description: Follow-up nudge configuration. Each entry represents one nudge with a delayHours field. Array length determines total nudges. Empty array disables nudging.
                    items:
                      type: object
                      properties:
                        delayHours:
                          type: integer
                          description: Hours to wait since the previous message before sending this nudge.
                          minimum: 1
                      required:
                      - delayHours
                    maxItems: 10
                  additionalRecipients:
                    type: array
                    description: Email addresses CC'd on all outreach communications (initial email, reply-backs, nudges, cancellation).
                    items:
                      type: string
                      format: email
              availability:
                type: object
                title: Availability
                description: Pre-defined availability time slots for the participant. Only applicable when isCalendarConnected is false.
                properties:
                  timezone:
                    type: string
                    title: Timezone
                    description: IANA timezone string (e.g., 'America/New_York', 'Europe/London'). Must be a valid IANA timezone identifier.
                    example: Europe/London
                  timeSlots:
                    type: array
                    title: Time Slots
                    description: Array of available time windows. All time slots must be in the future.
                    minItems: 1
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          pattern: ^\d{4}-([0][1-9]|1[0-2])-([0][1-9]|[12]\d|3[01])$
                          title: Date
                          description: The date in YYYY-MM-DD format (e.g., '2025-01-15').
                        startTime:
                          type: string
                          pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                          title: Start Time
                          description: The start time in HH:mm format (e.g., '09:00').
                        endTime:
                          type: string
                          pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                          title: End Time
                          description: The end time in HH:mm format (e.g., '17:00').
                      required:
                      - date
                      - startTime
                      - endTime
                required:
                - timezone
                - timeSlots
            required:
            - isCalendarConnected
            - name
            - email
        availabilityMethod:
          type: string
          title: Availability Method
          description: 'Determines who must attend the meeting. Optional on update: omitting it leaves the template''s current method unchanged rather than resetting it to COLLECTIVE, and the participants you send are validated against that resulting method. COLLECTIVE books a slot that works for every participant on the panel and requires exactly one organizer. ROUND_ROBIN_MAX_AVAILABILITY routes each meeting to a single participant from a pool of 2 to 10, chosen to give the candidate the widest choice of slots, and requires no organizer.'
          enum:
          - COLLECTIVE
          - ROUND_ROBIN_MAX_AVAILABILITY
          example: COLLECTIVE
        title:
          type: string
          title: Title
          description: The title of the meeting.
          example: Interview Call
        description:
          type: string
          title: Description
          description: A description for the meeting that will be included in the calendar invite.
          example: Initial screening interview
        openHours:
          type: array
          title: Open Hours
          description: Available time windows for scheduling the meeting.
          minItems: 1
          items:
            type: object
            properties:
              days:
                type: array
                title: Days
                items:
                  type: integer
                  minimum: 0
                  maximum: 6
                minItems: 1
                example:
                - 1
                - 2
                - 3
                - 4
                - 5
              start:
                type: string
                pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                example: 09:00
              end:
                type: string
                pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                example: '17:00'
            required:
            - days
            - start
            - end
        timezone:
          type: string
          title: Timezone
          description: IANA timezone string for the meeting.
          example: Europe/London
        duration:
          type: integer
          title: Duration
          description: The duration of the meeting in minutes.
          minimum: 1
          maximum: 1440
          example: 30
        videoConferencing:
          type: boolean
          title: Video Conferencing
          description: Whether to include video conferencing for the meeting. If true, videoConferencingProvider is required and location cannot be specified. If false, location is required.
          example: true
        videoConferencingProvider:
          type: string
          title: Video Conferencing Provider
          description: The video conferencing provider to use. Required when videoConferencing is true.
          enum:
          - Google Meet
          - Microsoft Teams
          example: Google Meet
        location:
          type: string
          title: Location
          description: The physical location for the meeting. Required when videoConferencing is false; must contain at least one non-space character and is trimmed. Cannot be used when videoConferencing is enabled.
        buffer:
          type: integer
          title: Buffer
          description: Buffer time in minutes before/after meetings. Must be a multiple of 5.
          minimum: 0
          maximum: 120
          multipleOf: 5
          example: 15
        reminderMinutesBeforeMeeting:
          type: integer
          title: Reminder Minutes Before Meeting
          description: How many minutes before the meeting to send a reminder notification.
          minimum: 1
          example: 1440
        noticePeriodMinutes:
          type: integer
          title: Notice Period Minutes
          description: Minimum notice required for booking in minutes.
          minimum: 0
          example: 60
        availableDaysInTheFuture:
          type: integer
          title: Available Days In The Future
          description: How far ahead a candidate may book on the booking page, in days. Distinct from availabilityOutreachSettings.periodDays, which controls the window interviewers are asked to offer availability within. Neither field caps the other.
          minimum: 1
          example: 30
        guestLabel:
          type:
          - string
          - 'null'
          title: Guest Label
          description: Noun used in the availability-outreach email for the counterparty the interviewer is scheduled to meet — the person who books the slot. Applies to the whole meeting. Defaults to "candidate"; override with e.g. "recruiter". Must not begin with "the" (Popp prefixes it automatically). Send null to clear a custom label and fall back to the default.
          minLength: 1
          maxLength: 50
          example: recruiter
        availabilityOutreachSettings:
          type: object
          title: Availability Outreach Settings
          description: Template-level settings for availability outreach emails sent to participants with autoCollectAvailability enabled. Per-participant overrides take priority over these values. On update these are merged field by field onto the stored settings — send only the keys you want to change; omitted keys keep their current value, and omitting the object entirely leaves all of them unchanged. See the Scheduling with Availability Collection guide for details.
          properties:
            requiredHours:
              type: integer
              description: 'Hours of availability to ask for. Default: 6. A target the agent nudges toward, not a minimum that gates booking — Popp will book inside a shorter overlap if that is all it has.'
              minimum: 1
              maximum: 168
              example: 4
            periodDays:
              type: integer
              description: 'The window interviewers are asked to offer availability within, in days, and the window their replies are read against. Default: 14. Distinct from the top-level availableDaysInTheFuture, which controls how far ahead a candidate may book.'
              minimum: 7
              maximum: 60
              example: 10
            customTemplatedSubjectLine:
              type: string
              description: 'Custom email subject line. Supports placeholders: {{INTERVIEWER_NAME}}, {{CANDIDATE_FIRST_NAME}}, {{AGENT_NAME}}, {{ORGANIZATION_NAME}}, {{CAMPAIGN_OWNER_NAME}}, {{MEETING_AVAILABILITY_TEXT}}.'
              example: Hi {{INTERVIEWER_NAME}}, availability needed
            customTemplatedMessage:
              type: string
              description: Custom email body. Supports the same placeholders as customTemplatedSubjectLine. {{MEETING_AVAILABILITY_TEXT}} expands to the concrete ask (window, hours, timezone) derived from requiredHours and periodDays; it is optional and not validated, so a message that omits it is accepted and the interviewer receives no concrete availability request.
              example: 'Hi {{INTERVIEWER_NAME}},


                {{MEETING_AVAILABILITY_TEXT}}


                Thanks,

                {{AGENT_NAME}}'
            nudgeSettings:
              type: array
              description: 'Follow-up nudge configuration. Each entry represents one nudge. Array length determines total nudges. Default: 3 nudges at 24h intervals.'
              items:
                type: object
                properties:
                  delayHours:
                    type: integer
                    description: Hours to wait since the previous message before sending this nudge.
                    minimum: 1
                required:
                - delayHours
              maxItems: 10
              example:
              - delayHours: 12
              - delayHours: 24
            additionalRecipients:
              type: array
              description: Email addresses CC'd on all outreach communications.
              items:
                type: string
                format: email
              example:
              - recruiter@company.com
      required:
      - meetingParticipants
      - title
      - openHours
      - timezone
      - duration
      - videoConferencing
      - buffer
      - reminderMinutesBeforeMeeting
      - noticePeriodMinutes
      - availableDaysInTheFuture
      additionalProperties: false
    ResendBookingUrlInput:
      type: object
      title: Resend Booking URL Input
      description: Input for resending a booking URL to a conversation. Provide either conversationId OR externalConversationId to identify the conversation, and either calendarMeetingTemplateId OR meetingConfiguration with meetingParticipants for the meeting setup.
      properties:
        conversationId:
          type: string
          title: Conversation ID
          description: Popp's internal conversation ID. Provide either this OR externalConversationId.
          example: 15dff535-2e85-4155-8dd5-21d9f1b52e0d
        externalConversationId:
          type: string
          title: External Conversation ID
          description: Your external/custom conversation ID. Provide either this OR conversationId.
          example: my-external-id-123
        calendarMeetingTemplateId:
          type: string
          title: Calendar Meeting Template ID
          description: The ID of an existing calendar meeting template to reuse. Use this when you have already created a meeting template with the desired configuration.
        meetingParticipants:
          type: array
          title: Meeting Participants
          description: List of participants for the meeting. Required when providing meetingConfiguration. At least one participant must be marked as organizer.
          minItems: 1
          items:
            type: object
            properties:
              isOrganizer:
                type: boolean
                title: Is Organizer
                description: Whether this participant is the meeting organizer. Exactly one participant should be marked as organizer.
              isCalendarConnected:
                type: boolean
                title: Is Calendar Connected
                description: Whether this participant has a connected calendar in Popp.
              name:
                type: string
                title: Name
                description: The full name of the participant.
                example: John Doe
              email:
                type: string
                format: email
                title: Email
                description: The email address of the participant.
                example: john@example.com
              autoCollectAvailability:
                type: boolean
                title: Auto Collect Availability
                description: 'NOT SUPPORTED for resend booking URL. This is an asynchronous flow that requires conversation interaction. Use connected calendars (isCalendarConnected: true) or provide availability time slots directly instead.'
                enum:
                - false
              availability:
                type: object
                title: Availability
                description: Pre-defined availability time slots for the participant. Only applicable when isCalendarConnected is false.
                properties:
                  timezone:
                    type: string
                    title: Timezone
                    description: IANA timezone string (e.g., 'America/New_York', 'Europe/London').
                    example: Europe/London
                  timeSlots:
                    type: array
                    title: Time Slots
                    description: Array of available time windows. All time slots must be in the future.
                    minItems: 1
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          pattern: ^\d{4}-([0][1-9]|1[0-2])-([0][1-9]|[12]\d|3[01])$
                          title: Date
                          description: The date in YYYY-MM-DD format (e.g., '2025-01-15').
                        startTime:
                          type: string
                          pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                          title: Start Time
                          description: The start time in HH:mm format (e.g., '09:00').
                        endTime:
                          type: string
                          pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                          title: End Time
                          description: The end time in HH:mm format (e.g., '17:00').
                      required:
                      - date
                      - startTime
                      - endTime
                required:
                - timezone
                - timeSlots
            required:
            - isOrganizer
            - isCalendarConnected
            - name
            - email
        closePreviousConversations:
          type: boolean
          title: Close Previous Conversations
          description: When true, any ongoing conversations for the same phone number and channel will be automatically closed (marked as COMPLETED). Useful for testing with the same phone number. Defaults to false.
          default: false
          example: true
        meetingConfiguration:
          type: object
          title: Meeting Configuration
          description: Configuration for the new meeting template. Required when not using calendarMeetingTemplateId.
          properties:
            title:
              type: string
              title: Title
              description: The title of the meeting.
              example: Interview Call
            description:
              type: string
              title: Description
              description: A description for the meeting that will be included in the calendar invite.
              example: Initial screening interview
            openHours:
              type: array
              title: Open Hours
              description: Available time windows for scheduling the meeting.
              minItems: 1
              items:
                type: object
                properties:
                  days:
                    type: array
                    title: Days
                    description: Array of day numbers (0=Sunday, 1=Monday, ..., 6=Saturday).
                    items:
                      type: integer
                      minimum: 0
                      maximum: 6
                    minItems: 1
                  start:
                    type: string
                    pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                    title: Start Time
                    description: The start time in HH:mm format (e.g., '09:00').
                  end:
                    type: string
                    pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                    title: End Time
                    description: The end time in HH:mm format (e.g., '17:00').
                required:
                - days
                - start
                - end
            timezone:
              type: string
              title: Timezone
              description: IANA timezone string for the meeting (e.g., 'America/New_York').
              example: Europe/London
            duration:
              type: integer
              title: Duration
              description: The duration of the meeting in minutes.
              minimum: 1
              example: 30
            videoConferencing:
              type: boolean
              title: Video Conferencing
              description: Whether to include video conferencing for the meeting. If true, location is not allowed. If false, location is required.
              example: true
            videoConferencingProvider:
              type: string
              title: Video Conferencing Provider
              description: The video conferencing provider to use.
              enum:
              - Google Meet
              - Microsoft Teams
              example: Google Meet
            location:
              type: string
              title: Location
              description: The physical location for the meeting. Required when videoConferencing is false; must contain at least one non-space character and is trimmed. Not allowed when videoConferencing is true.
          required:
          - title
          - openHours
          - timezone
          - duration
          - videoConferencing
      oneOf:
      - title: With Conversation ID and existing template
        required:
        - conversationId
        - calendarMeetingTemplateId
      - title: With Conversation ID and new template
        required:
        - conversationId
        - meetingConfiguration
        - meetingParticipants
      - title: With External Conversation ID and existing template
        required:
        - externalConversationId
        - calendarMeetingTemplateId
      - title: With External Conversation ID and new template
        required:
        - externalConversationId
        - meetingConfiguration
        - meetingParticipants
      additionalProperties: false
    limit-272b2660-f5ad-4a2e-aaf5-9174ff8f57b9:
      type: integer
      minimum: 1
      maximum: 100
    fromDateTime:
      type: string
      format: date-time
    status-fdf66607-6c16-48bb-bc03-7dea3c78657e:
      type: string
      enum:
      - SCHEDULED
      - CANCELLED
      - RESCHEDULED
      - RESCHEDULING_REQUESTED
    ListMeetingTemplatesResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
            - id
            - title
            - duration
            - videoConferencing
            - status
            - meetingParticipants
            - createdAt
            - updatedAt
            properties:
              id:
                type: string
                description: The unique identifier of the meeting template
                example: template-123
              title:
                type: string
                description: The title of the meeting template
                example: Interview Call
              duration:
                type: integer
                description: Duration of the meeting in minutes
                example: 30
              videoConferencing:
                type: boolean
                description: Whether video conferencing is enabled
                example: true
              location:
                type: string
                description: The meeting location
              status:
                type: string
                description: The status of the meeting template
                enum:
                - ACTIVE
                - ARCHIVED
                example: ACTIVE
              meetingParticipants:
                type: array
                description: List of participants in the meeting template
                items:
                  type: object
                  required:
                  - email
                  - name
                  - isOrganizer
                  - autoCollectAvailability
                  properties:
                    email:
                      type: string
                      description: The participant email address
                      example: john@example.com
                    name:
                      type: string
                      description: The participant name
                      example: John Doe
                    isOrganizer:
                      type: boolean
                      description: Whether this participant is the meeting organizer
                      example: true
                    autoCollectAvailability:
                      type: boolean
                      description: Whether Popp collects this participant's availability automatically via an outreach email
                      example: true
              createdAt:
                type: string
                format: date-time
                description: When the template was created
                example: '2025-01-01T09:00:00Z'
              updatedAt:
                type: string
                format: date-time
                description: When the template was last updated
                example: '2025-01-05T14:30:00Z'
        nextToken:
          type: string
          description: Pagination token for next page of results
        total:
          type: integer
          description: Total number of matching meeting templates
    CreateSchedulingConversationInput:
      type: object
      description: Request body for creating an auto-schedule conversation. Requires a campaign (campaignId or externalCampaignId), a way to reach the candidate (phoneNumber or emailAddress), the meeting participants, and the meeting configuration.
      properties:
        phoneNumber:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
          title: Phone Number
          description: The phone number of the candidate, in E.164 format. Either phoneNumber or emailAddress is required. For SMS and WHATSAPP campaigns a usable phone number is required unless the campaign's email fallback resolves to enabled (emailChannelFallbackEnabled on the campaign, inheriting the organization setting when unset) and an emailAddress is provided, in which case email is used as a fallback when the phone number cannot be parsed.
        countryCode:
          type: string
          title: Country Code
          description: The country code in ISO 3166-1 alpha-2 format. This is used to format the phone number if it is not in E.164 format.
        firstName:
          type: string
          title: First Name
          description: The first name of the candidate.
        lastName:
          type: string
          title: Last Name
          description: The last name of the candidate.
        emailAddress:
          type: string
          format: email
          title: Email Address
          description: The email address of the candidate. Either phoneNumber or emailAddress is required. For SMS and WHATSAPP campaigns, a request with no usable phone number is accepted only when the campaign's email fallback resolves to enabled; otherwise it is rejected with 400.
        campaignId:
          type: string
          title: Campaign ID
          description: The unique identifier for the campaign. Either campaignId or externalCampaignId is required.
        externalCampaignId:
          type: string
          title: External Campaign ID
          description: The unique identifier for the campaign in the external system. Either campaignId or externalCampaignId is required.
        externalId:
          type: string
          title: External ID
          description: The unique identifier for the conversation in the external system.
        skipDuplicationCheck:
          type: boolean
          title: Skip Duplication Check
          description: If true, skips the check for existing conversations with the same phone number/email and campaign.
        shouldSendDuringBusinessHours:
          type: boolean
          title: Should Send During Business Hours
          description: If true, the initial message will be scheduled to send during business hours. The timezone is inferred from the phone number.
        meetingParticipants:
          type: array
          title: Meeting Participants
          description: 'List of participants for the meeting. Exactly one participant must be marked as organizer — this endpoint always schedules a collective meeting, where every participant must be able to attend. Each participant must be able to supply availability one of three ways: a connected calendar (isCalendarConnected true), pre-defined availability.timeSlots, or autoCollectAvailability. Any combination of the three across the panel is allowed.'
          minItems: 1
          items:
            type: object
            properties:
              isOrganizer:
                type: boolean
                title: Is Organizer
                description: Whether this participant is the meeting organizer. Exactly one participant should be marked as organizer.
              isCalendarConnected:
                type: boolean
                title: Is Calendar Connected
                description: Whether this participant has a connected calendar in Popp.
              name:
                type: string
                title: Name
                description: The full name of the participant.
                example: John Doe
              email:
                type: string
                format: email
                title: Email
                description: The email address of the participant.
                example: john@example.com
              autoCollectAvailability:
                type: boolean
                title: Auto Collect Availability
                description: If true, Popp emails this participant to ask for their availability instead of reading a calendar. Requires isCalendarConnected to be false. Any number of participants can have this enabled — Popp collects from each of them and books a slot that works for the whole panel.
              availabilityOutreachSettings:
                type: object
                title: Availability Outreach Settings
                description: Per-participant availability outreach settings. This endpoint has no template-level equivalent — settings are per participant, and any field omitted falls back to the system default.
                properties:
                  requiredHours:
                    type: integer
                    description: 'Hours of availability to ask this participant for. Default: 6. A target the agent nudges toward, not a minimum that gates booking — Popp will book inside a shorter overlap if that is all it has.'
                    minimum: 1
                    maximum: 168
                  periodDays:
                    type: integer
                    description: 'The window this participant is asked to offer availability within, in days, and the window their reply is read against. Default: 14.'
                    minimum: 7
                    maximum: 60
                  customTemplatedSubjectLine:
                    type: string
                    description: 'Custom email subject line for the outreach email to this participant. Supports placeholders: {{INTERVIEWER_NAME}}, {{CANDIDATE_FIRST_NAME}}, {{AGENT_NAME}}, {{ORGANIZATION_NAME}}, {{CAMPAIGN_OWNER_NAME}}, {{MEETING_AVAILABILITY_TEXT}}.'
                  customTemplatedMessage:
                    type: string
                    description: Custom email body for the outreach email to this participant. Supports the same placeholders as customTemplatedSubjectLine. {{MEETING_AVAILABILITY_TEXT}} expands to the concrete ask (window, hours, timezone) derived from requiredHours and periodDays; it is optional and not validated, so a message that omits it is accepted and the participant receives no concrete availability request.
                  nudgeSettings:
                    type: array
                    description: Follow-up nudge configuration. Each entry represents one nudge with a delayHours field. Array length determines total nudges. Empty array disables nudging.
                    items:
                      type: object
                      properties:
                        delayHours:
                          type: integer
                          description: Hours to wait since the previous message before sending this nudge.
                          minimum: 1
                      required:
                      - delayHours
                    maxItems: 10
                  additionalRecipients:
                    type: array
                    description: Email addresses CC'd on all outreach communications (initial email, reply-backs, nudges, cancellation).
                    items:
                      type: string
                      format: email
              availability:
                type: object
                title: Availability
                description: Pre-defined availability time slots for the participant. Only applicable when isCalendarConnected is false.
                properties:
                  timezone:
                    type: string
                    title: Timezone
                    description: IANA timezone string (e.g., 'America/New_York', 'Europe/London').
                    example: Europe/London
                  timeSlots:
                    type: array
                    title: Time Slots
                    description: Array of available time windows. All time slots must be in the future.
                    minItems: 1
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          pattern: ^\d{4}-([0][1-9]|1[0-2])-([0][1-9]|[12]\d|3[01])$
                          title: Date
                          description: The date in YYYY-MM-DD format (e.g., '2025-01-15').
                        startTime:
                          type: string
                          pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                          title: Start Time
                          description: The start time in HH:mm format (e.g., '09:00').
                        endTime:
                          type: string
                          pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                          title: End Time
                          description: The end time in HH:mm format (e.g., '17:00').
                      required:
                      - date
                      - startTime
                      - endTime
                required:
                - timezone
                - timeSlots
            required:
            - isOrganizer
            - isCalendarConnected
            - name
            - email
        meetingConfiguration:
          type: object
          title: Meeting Configuration
          description: Configuration for the meeting to be scheduled.
          properties:
            title:
              type: string
              title: Title
              description: The title of the meeting.
              example: Interview Call
            description:
              type: string
              title: Description
              description: A description for the meeting that will be included in the calendar invite.
              example: Initial screening interview
            openHours:
              type: array
              title: Open Hours
              description: Available time windows for scheduling the meeting.
              minItems: 1
              items:
                type: object
                properties:
                  days:
                    type: array
                    title: Days
                    description: Array of day numbers (0=Sunday, 1=Monday, ..., 6=Saturday).
                    items:
                      type: integer
                      minimum: 0
                      maximum: 6
                    minItems: 1
                  start:
                    type: string
                    pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                    title: Start Time
                    description: The start time in HH:mm format (e.g., '09:00').
                  end:
                    type: string
                    pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                    title: End Time
                    description: The end time in HH:mm format (e.g., '17:00').
                required:
                - days
                - start
                - end
            timezone:
              type: string
              title: Timezone
              description: IANA timezone string for the meeting (e.g., 'America/New_York').
              example: Europe/London
            duration:
              type: integer
              title: Duration
              description: The duration of the meeting in minutes.
              minimum: 1
              example: 30
            videoConferencing:
              type: boolean
              title: Video Conferencing
              description: Whether to include video conferencing for the meeting. If true, location is not allowed. If false, location is required.
              example: true
            videoConferencingProvider:
              type: string
              title: Video Conferencing Provider
              description: The video conferencing provider to use.
              enum:
              - Google Meet
              - Microsoft Teams
              example: Google Meet
            location:
              type: string
              title: Location
              description: The physical location for the meeting. Required when videoConferencing is false; must contain at least one non-space character and is trimmed. Not allowed when videoConferencing is true.
          required:
          - title
          - openHours
          - timezone
          - duration
          - videoConferencing
      required:
      - firstName
      - meetingParticipants
      - meetingConfiguration
      oneOf:
      - title: Campaign ID Required
        description: Either campaignId or externalCampaignId is required.
        required:
        - campaignId
      - title: External Campaign ID Required
        description: Either campaignId or externalCampaignId is required.
        required:
        - externalCampaignId
      additionalProperties: false
