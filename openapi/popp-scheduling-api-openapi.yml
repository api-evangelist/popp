openapi: 3.2.0
info:
  title: Popp Scheduling API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Scheduling
paths:
  /v1/availability/parse:
    post:
      summary: Parse Availability
      description: Parses natural-language availability text into structured time slots. Supports multi-turn clarification via the messages array. Does NOT save the availability — call PUT /v1/user-calendars/{userCalendarId}/availability after the user confirms.
      operationId: parse-availability
      parameters: []
      tags:
      - Scheduling
      requestBody:
        description: Conversation messages and date/timezone context
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseAvailabilityInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseAvailabilityResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/bookings:
    get:
      summary: List calendar bookings
      description: 'List calendar bookings belonging to the authenticated organization.


        All filters are optional. Results are always scoped to the authenticated organization.


        Results are paginated using a cursor (`nextToken`). To fetch the next page, pass the

        `nextToken` from the previous response back as a query parameter.'
      operationId: list-bookings
      parameters:
      - name: campaignId
        in: query
        description: Filter by the campaign that generated the booking
        required: false
        schema:
          $ref: '#/components/schemas/campaignId'
      - name: conversationId
        in: query
        description: Filter by the conversation that generated the booking
        required: false
        schema:
          $ref: '#/components/schemas/conversationId'
      - name: status
        in: query
        description: Filter by booking status
        required: false
        schema:
          $ref: '#/components/schemas/status-fdf66607-6c16-48bb-bc03-7dea3c78657e'
      - name: fromDateTime
        in: query
        description: Only include bookings starting on or after this ISO-8601 datetime
        required: false
        schema:
          $ref: '#/components/schemas/fromDateTime'
      - name: toDateTime
        in: query
        description: Only include bookings starting on or before this ISO-8601 datetime
        required: false
        schema:
          $ref: '#/components/schemas/toDateTime'
      - name: limit
        in: query
        description: 'Maximum number of results to return (1-100, default: 20)'
        required: false
        schema:
          $ref: '#/components/schemas/limit-b96ef13b-e584-424a-928f-64183cf295c1'
      - name: nextToken
        in: query
        description: Pagination cursor from a previous response
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Scheduling
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/bookings/{bookingId}:
    patch:
      summary: Update Booking
      description: 'Update an existing booking. Supports updating the title, time, duration,

        description, location, and attendees of the meeting. The underlying calendar

        event is updated and participants are notified by default.


        Cannot be used on cancelled bookings or to set a start time in the past.


        When you change the time, the new slot is validated against the meeting

        template it was booked from. The request returns 400, with the reason in the

        response message, if the new slot:


        - falls outside the template''s open hours

        - falls inside the template''s minimum notice period

        - falls beyond the template''s booking window

        - overlaps another meeting on the assigned interviewer''s calendar,

        including the template''s buffer either side


        Moving a booking within its own existing slot is always allowed. Changes

        that do not alter the time are not validated against the template.


        The request also returns 400 if the template''s rules cannot be read at all —

        for example if its scheduler configuration is missing open hours, a notice

        period or a booking window, or if the booking''s organizer calendar cannot be

        resolved. These are reported separately from a rule that was evaluated and

        failed, so you can tell "your time is outside the open hours" from "we could

        not read this template".


        Returns 404 if the booking does not exist, or if it belongs to a different

        organisation than the one tied to the API key.'
      operationId: update-booking
      parameters:
      - name: bookingId
        in: path
        description: The unique identifier of the booking
        required: true
        schema:
          $ref: '#/components/schemas/bookingId'
      tags:
      - Scheduling
      requestBody:
        description: The fields to update on the booking
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    get:
      summary: Get a calendar booking
      description: 'Get full details of a calendar booking by ID.


        Returns the booking record only if it belongs to the authenticated organization.'
      operationId: get-booking
      parameters:
      - name: bookingId
        in: path
        description: The unique identifier of the calendar booking
        required: true
        schema:
          $ref: '#/components/schemas/bookingId'
      tags:
      - Scheduling
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/bookings/{bookingId}/cancel:
    post:
      summary: Cancel Booking
      description: 'Cancel an existing booking. The underlying calendar event is cancelled

        via Nylas and a cancellation notification is sent to all participants

        by default.


        Returns 404 if the booking does not exist, or if it belongs to a different

        organisation than the one tied to the API key. Returns 409 if the booking

        has already been cancelled. Returns 400 if the booking has already started.'
      operationId: cancel-booking
      parameters:
      - name: bookingId
        in: path
        description: The unique identifier of the booking
        required: true
        schema:
          $ref: '#/components/schemas/bookingId'
      tags:
      - Scheduling
      requestBody:
        description: Optional cancellation reason and notification settings
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelBookingResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/conversations/resend-booking-url:
    post:
      summary: Resend booking URL
      description: Resends a booking URL to an existing conversation with updated meeting configuration. Use this when a candidate cannot find suitable time slots and you need to provide new availability options. Identify the conversation using either conversationId or externalConversationId. You can either reference an existing meeting template or create a new one with custom configuration.
      operationId: resend-booking-url
      parameters: []
      tags:
      - Scheduling
      requestBody:
        description: Conversation identifier (conversationId or externalConversationId) and meeting template ID or new meeting configuration
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendBookingUrlInput'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendBookingUrlResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/invite-calendar-contact:
    post:
      summary: Invite Calendar Contact
      description: Invites an external contact to connect their calendar. This sends an invitation to the contact allowing them to share their calendar availability.
      operationId: invite-calendar-contact
      parameters: []
      tags:
      - Scheduling
      requestBody:
        description: The input to invite a calendar contact
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCalendarContactInput'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCalendarContactResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
