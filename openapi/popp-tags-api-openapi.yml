openapi: 3.2.0
info:
  title: Popp Tags API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Tags
paths:
  /v1/candidates/tags:
    get:
      summary: List tags
      description: Returns the tag catalog for the caller's organization, sorted by tag. This is the vocabulary the candidate tag filter offers. Paginated with `limit` + `nextToken`. Pass `tag` to look up a single tag by its exact value, for example to find the id to delete.
      operationId: list-tags
      parameters:
      - name: limit
        in: query
        description: Maximum number of items per page (1-100). Defaults to 50.
        required: false
        schema:
          $ref: '#/components/schemas/limit-8a25ecd2-52be-42ee-857e-07474702c332'
      - name: nextToken
        in: query
        description: Pagination token returned by a previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      - name: tag
        in: query
        description: Return only the tag with exactly this value. Case-sensitive. At most 1024 bytes in UTF-8, the longest value a stored tag can have.
        required: false
        schema:
          $ref: '#/components/schemas/tag'
      tags:
      - Tags
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagsResponse'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/candidates/tags/{id}:
    delete:
      summary: Delete a tag
      description: 'Removes a tag from the catalog, so it no longer appears in the candidate tag filter. Candidates are not changed: any candidate carrying the tag keeps it, and the tag returns to the catalog the next time one of those candidates is updated. Remove the tag from your candidates first, then delete it here. Returns 204 on success and 404 when the tag is not found in the caller''s organization.'
      operationId: delete-tag
      parameters:
      - name: id
        in: path
        description: Tag id (UUID), from `GET /v1/candidates/tags`.
        required: true
        schema:
          $ref: '#/components/schemas/candidate_profile_id'
      tags:
      - Tags
      responses:
        '204':
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    limit-8a25ecd2-52be-42ee-857e-07474702c332:
      type: integer
      minimum: 1
      maximum: 100
    nextToken:
      type: string
    tag:
      type: string
    ErrorResponse:
      type: object
    candidate_profile_id:
      type: string
      format: uuid
    ListTagsResponse:
      type: object
      properties:
        items:
          type: array
          description: Tags in the caller's catalog, sorted by tag.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              tag:
                type: string
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
            required:
            - id
            - tag
            - createdAt
            - updatedAt
            additionalProperties: false
        nextToken:
          type:
          - string
          - 'null'
          description: Pass back as `nextToken` to fetch the next page. Null when there are no more results.
      required:
      - items
      - nextToken
      additionalProperties: false
  securitySchemes:
    popp_api_key:
      description: Your Popp API key for authentication
      type: apiKey
      name: x-api-key
      in: header
    organization_id:
      description: Your organization's unique identifier
      type: apiKey
      name: x-organization-id
      in: header
