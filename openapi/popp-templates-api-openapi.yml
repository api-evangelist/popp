openapi: 3.2.0
info:
  title: Popp Templates API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Templates
paths:
  /v1/templates:
    get:
      summary: List templates
      description: List all message templates belonging to the authenticated organization
      operationId: list-templates
      parameters:
      - name: nextToken
        in: query
        description: Pagination token for fetching the next page of results
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      - name: type
        in: query
        description: Filter templates by type
        required: false
        schema:
          $ref: '#/components/schemas/type'
      - name: channel
        in: query
        description: Filter templates by channel
        required: false
        schema:
          $ref: '#/components/schemas/channel'
      - name: campaignType
        in: query
        description: Filter templates by campaign type
        required: false
        schema:
          $ref: '#/components/schemas/campaignType'
      tags:
      - Templates
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTemplatesResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
components:
  schemas:
    type:
      type: string
      enum:
      - NUDGE_MESSAGE_1
      - NUDGE_MESSAGE_2
      - NUDGE_MESSAGE_3
      - OPENING_MESSAGE
      - RESTART_OPEN_MESSAGE
      - CALENDAR_BOOKING_CANCELLED
      - CALENDAR_BOOKING_CONFIRMATION
      - CALENDAR_BOOKING_NUDGE_1
      - CALENDAR_BOOKING_NUDGE_2
      - CALENDAR_BOOKING_NUDGE_3
      - CALENDAR_BOOKING_REMINDER
      - CALENDAR_BOOKING_RESCHEDULE_CONFIRMATION
      - CALENDAR_BOOKING_RESCHEDULE_REQUEST
      - CALENDAR_BOOKING_URL_READY
    nextToken:
      type: string
    campaignType:
      type: string
      enum:
      - APPLICANT_OUTREACH
      - ENGAGEMENT_OUTREACH
      - NEW_CANDIDATE_OUTREACH
      - SCHEDULING
    channel:
      type: string
      enum:
      - SMS
      - WHATSAPP
    ErrorResponse:
      type: object
    ListTemplatesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - type
            - channel
            - campaignType
            properties:
              id:
                type: string
                description: Unique identifier for the template
              type:
                type: string
                description: The type of message template
                enum:
                - NUDGE_MESSAGE_1
                - NUDGE_MESSAGE_2
                - NUDGE_MESSAGE_3
                - OPENING_MESSAGE
                - RESTART_OPEN_MESSAGE
                - WELCOME_MESSAGE
              channel:
                type: string
                description: The channel through which the template will be sent
                enum:
                - SMS
                - WEB_CHAT
                - WEB_CHAT_VIA_EMAIL
                - WHATSAPP
              campaignType:
                type: string
                description: The type of campaign this template is used for
                enum:
                - APPLICANT_OUTREACH
                - ENGAGEMENT_OUTREACH
                - NEW_CANDIDATE_OUTREACH
        nextToken:
          type: string
          description: Pagination token for fetching the next page of results
      required:
      - data
      additionalProperties: false
  securitySchemes:
    popp_api_key:
      description: Your Popp API key for authentication
      type: apiKey
      name: x-api-key
      in: header
    organization_id:
      description: Your organization's unique identifier
      type: apiKey
      name: x-organization-id
      in: header
