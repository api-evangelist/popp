openapi: 3.2.0
info:
  title: Popp Users API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Users
paths:
  /v1/organizations/{id}/users:
    get:
      summary: List Organization Users
      description: List the users in a specific organization (paginated), each with their per-organization access. Scoped to the organization group behind your API key; an organization in another group returns 404. Authenticated with your API key alone.
      operationId: list-organization-users
      parameters:
      - name: id
        in: path
        description: The organization id.
        required: true
        schema:
          $ref: '#/components/schemas/id'
      - name: limit
        in: query
        description: Maximum number of items per page (1-50). Defaults to 20.
        required: false
        schema:
          $ref: '#/components/schemas/limit-27c292e0-baed-45b9-91e6-4dbd3491ffdd'
      - name: nextToken
        in: query
        description: Pagination token returned by a previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Users
      security:
      - popp_api_key: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/users:
    get:
      summary: List Users
      description: List the users in the organization group behind your API key (paginated), each with their per-organization access.
      operationId: list-users
      parameters:
      - name: limit
        in: query
        description: Maximum number of items per page (1-50). Defaults to 20.
        required: false
        schema:
          $ref: '#/components/schemas/auth_service_limit'
      - name: nextToken
        in: query
        description: Pagination token returned by a previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Users
      security:
      - popp_api_key: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    post:
      summary: Create User
      description: Create or invite a user with access to one or more organizations in the organization group behind your API key. Name each organization either by its Popp organizationId or by your own externalOrganizationId (exactly one per entry). Returns 409 if a user with the email already exists. Set sendInvite=false to provision silently (SSO) with no invitation email.
      operationId: create-user
      parameters: []
      tags:
      - Users
      security:
      - popp_api_key: []
      requestBody:
        description: The user to create and their organization access.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/users/by-email/{email}:
    get:
      summary: Get User by Email
      description: Get a single user, with their per-organization access, by email address.
      operationId: get-user-by-email
      parameters:
      - name: email
        in: path
        description: The URL-encoded email address of the user.
        required: true
        schema:
          $ref: '#/components/schemas/auth_service_email'
      tags:
      - Users
      security:
      - popp_api_key: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    patch:
      summary: Update User by Email
      description: Update a user's name, organization access and/or group-level role, identified by email. The organizations array uses replace-semantics (send the full desired set), while a field you omit is left unchanged; name each organization either by its Popp organizationId or by your own externalOrganizationId (exactly one per entry).
      operationId: update-user-by-email
      parameters:
      - name: email
        in: path
        description: The user's email address.
        required: true
        schema:
          $ref: '#/components/schemas/email-36a90113-55ff-4550-a801-6fdb688e2ce8'
      tags:
      - Users
      security:
      - popp_api_key: []
      requestBody:
        description: The updated name, organization access and/or group role.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    delete:
      summary: Delete User by Email
      description: 'Permanently delete a user, identified by email. **This cannot be undone.** Their sign-in is removed, all organization access is revoked and their personal details are erased. Records they created, such as campaigns and conversations, are kept and still show them as the author. Their email address becomes free to invite again. Returns 409 if the user still has an enabled API key: revoke it first, or every call made with that key will stop working. To remove access reversibly, use Deactivate User instead.'
      operationId: delete-user-by-email
      parameters:
      - name: email
        in: path
        description: The user's email address.
        required: true
        schema:
          $ref: '#/components/schemas/email-bb440892-608c-4cfb-a29a-de9aa6928dd5'
      tags:
      - Users
      security:
      - popp_api_key: []
      responses:
        '204':
          description: ''
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/users/by-email/{email}/deactivate:
    post:
      summary: Deactivate User by Email
      description: 'Deactivate a user, identified by email: revoke all of their organization access and disable their sign-in, keeping the account so it can be restored. The user still resolves by id and by email with an empty organizations array, and drops out of organization user listings. Reversible through Reactivate User. Repeating the call is a no-op.'
      operationId: deactivate-user-by-email
      parameters:
      - name: email
        in: path
        description: The user's email address.
        required: true
        schema:
          $ref: '#/components/schemas/email-9ec7a2c8-b487-4a52-8e53-f47e2e6299b1'
      tags:
      - Users
      security:
      - popp_api_key: []
      responses:
        '204':
          description: ''
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/users/by-email/{email}/reactivate:
    post:
      summary: Reactivate User by Email
      description: 'Restore a deactivated user, identified by email: re-enable their sign-in and give them access to the organizations in the request body. That access is the set they end up with, not an addition to whatever they held before deactivation. The user keeps the group-level role they held before deactivation; supply organizationGroupRole only to change it on the way back in. Reactivating an active user simply applies the access in the body.'
      operationId: reactivate-user-by-email
      parameters:
      - name: email
        in: path
        description: The user's email address.
        required: true
        schema:
          $ref: '#/components/schemas/email-c7deb42d-a6bc-4791-b06e-058ce32111e8'
      tags:
      - Users
      security:
      - popp_api_key: []
      requestBody:
        description: The organization access to restore.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactivateUserRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/users/by-email/{email}/sign-out:
    post:
      summary: Sign Out User by Email
      description: Sign a user out of all of their active sessions, identified by email.
      operationId: sign-out-user-by-email
      parameters:
      - name: email
        in: path
        description: The user's email address.
        required: true
        schema:
          $ref: '#/components/schemas/email-f8e7b5d9-eed7-4b7b-83e1-b15551158ddc'
      tags:
      - Users
      security:
      - popp_api_key: []
      responses:
        '204':
          description: ''
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/users/{id}:
    get:
      summary: Get User
      description: Get a single user, with their per-organization access, by Popp user id.
      operationId: get-user
      parameters:
      - name: id
        in: path
        description: The Popp user id.
        required: true
        schema:
          $ref: '#/components/schemas/id'
      tags:
      - Users
      security:
      - popp_api_key: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers: {}
        '400':
