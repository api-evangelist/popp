      security:
      - popp_api_key: []
      requestBody:
        description: The updated name, organization access and/or group role.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
