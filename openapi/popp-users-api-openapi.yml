          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    patch:
      summary: Update User
      description: Update a user's name, organization access and/or group-level role. The organizations array uses replace-semantics (send the full desired set), while a field you omit is left unchanged; name each organization either by its Popp organizationId or by your own externalOrganizationId (exactly one per entry).
      operationId: update-user
      parameters:
      - name: id
        in: path
        description: The Popp user id.
        required: true
