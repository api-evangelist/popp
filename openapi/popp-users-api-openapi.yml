components:
  schemas:
    ReactivateUserRequest:
      title: ReactivateUserRequest
      type: object
      required:
      - organizations
      properties:
        organizationGroupRole:
          type: string
          description: 'The group-level role to restore. Optional: omitted, the user keeps the role they had before deactivation. Send it only to change that role on the way back in.'
          enum:
          - ORGANIZATION_GROUP_ADMIN
          - ORGANIZATION_GROUP_MEMBER
        organizations:
          type: array
          minItems: 1
          description: The organizations the user regains access to. This is the access they end up with, not an addition to what they had before deactivation.
          items:
            type: object
            description: Names one organization either by its Popp id or by your own externalOrganizationId, never both. A hidden organization is not a valid target under either id and returns 404.
            oneOf:
            - title: By Popp organization id
              type: object
              required:
              - organizationId
              properties:
                organizationId:
                  type: string
                  description: The Popp organization id.
                role:
                  type: string
                  enum:
                  - ADMIN
                  - MEMBER
              additionalProperties: false
            - title: By your own external id
              type: object
              required:
              - externalOrganizationId
              properties:
                externalOrganizationId:
                  type: string
                  description: Your own id for the organization, as set through PATCH /v1/organizations/{id}.
                role:
                  type: string
                  enum:
                  - ADMIN
                  - MEMBER
              additionalProperties: false
      additionalProperties: false
    auth_service_email:
      type: string
    email-9ec7a2c8-b487-4a52-8e53-f47e2e6299b1:
      type: string
      format: email
    nextToken:
      type: string
    UpdateUserRequest:
      title: UpdateUserRequest
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: The user's display name. Left unchanged when omitted.
        organizationGroupRole:
          type: string
          enum:
          - ORGANIZATION_GROUP_ADMIN
          - ORGANIZATION_GROUP_MEMBER
        organizations:
          type: array
          items:
            type: object
            description: Names one organization either by its Popp id or by your own externalOrganizationId, never both. A hidden organization is not a valid target under either id and returns 404.
            oneOf:
            - title: By Popp organization id
              type: object
              required:
              - organizationId
              properties:
                organizationId:
                  type: string
                  description: The Popp organization id.
                role:
                  type: string
                  enum:
                  - ADMIN
                  - MEMBER
              additionalProperties: false
            - title: By your own external id
              type: object
              required:
              - externalOrganizationId
              properties:
                externalOrganizationId:
                  type: string
                  description: Your own id for the organization, as set through PATCH /v1/organizations/{id}.
                role:
                  type: string
                  enum:
                  - ADMIN
                  - MEMBER
              additionalProperties: false
      additionalProperties: false
    email-36a90113-55ff-4550-a801-6fdb688e2ce8:
      type: string
      format: email
    ListUsersResponse:
      type: object
      properties:
        items:
          type: array
          description: Users in the organization group, each with their per-organization access.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type:
                - string
                - 'null'
              email:
                type: string
                format: email
              organizationGroupRole:
                type:
                - string
                - 'null'
                enum:
