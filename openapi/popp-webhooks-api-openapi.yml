openapi: 3.2.0
info:
  title: Popp Webhooks API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Webhooks
paths:
  /v1/webhook-events:
    get:
      summary: List Webhook Events
      description: List all webhook event types available for subscription, with their descriptions and categories
      operationId: list-webhook-events
      parameters: []
      tags:
      - Webhooks
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWebhookEventsResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/webhooks:
    get:
      summary: List Webhooks
      description: List all webhooks configured for the organization
      operationId: list-webhooks
      parameters: []
      tags:
      - Webhooks
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWebhooksResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    post:
      summary: Create Webhook
      description: Create a new webhook for the organization. Subscribing to an event that is not yet available returns 400.
      operationId: create-webhook
      parameters: []
      tags:
      - Webhooks
      requestBody:
        description: Create Webhook Request
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhookResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/webhooks/{webhookId}:
    put:
      summary: Update Webhook
      description: Update an existing webhook configuration. Subscribing to an event that is not yet available returns 400.
      operationId: update-webhook
      parameters:
      - name: webhookId
        in: path
        description: The ID of the webhook to update
        required: true
        schema:
          $ref: '#/components/schemas/webhookId'
      tags:
      - Webhooks
      requestBody:
        description: Update Webhook Request
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    delete:
      summary: Delete Webhook
      description: Delete a webhook configuration
      operationId: delete-webhook
      parameters:
      - name: webhookId
        in: path
        description: The ID of the webhook to delete
        required: true
        schema:
          $ref: '#/components/schemas/webhookId'
      tags:
      - Webhooks
      responses:
        '204':
          description: ''
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
components:
  schemas:
    UpdateWebhookRequest:
      description: Request to update a webhook
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the webhook
        url:
          type: string
          format: uri
          description: HTTPS URL to receive webhook events
        subscribedEvents:
          type: array
          items:
            type: string
            enum:
            - CONVERSATION_STARTED
            - CONVERSATION_COMPLETED
            - CONVERSATION_NEEDS_REVIEW
            - CONVERSATION_QUEUED
            - CONVERSATION_OPTED_OUT
            - START_CONVERSATION_FAILED
            - ANALYSIS_CREATED
            - CANDIDATE_ANALYSIS_COMPLETED
            - CANDIDATE_ANALYSIS_RESCORED
            - CANDIDATE_ANALYSIS_RESCORED_AFTER_ACTED_ON
            - CANDIDATE_ANALYSIS_FAILED
            - DOCUMENT_UPLOADED
            - CALENDAR_MEETING_SCHEDULED
            - CALENDAR_MEETING_RESCHEDULED
            - CALENDAR_MEETING_CANCELLED
            - CALENDAR_NOTE_TAKER_COMPLETED
            - CAMPAIGN_STOPPED
            - CALENDAR_AVAILABILITY_NOT_FOUND
            - CALENDAR_MORE_TIME_REQUESTED
            - WORKFLOW_RUN_STARTED
            - WORKFLOW_RUN_COMPLETED
            - WORKFLOW_RUN_FAILED
            - WORKFLOW_RUN_CANCELLED
            - WORKFLOW_CONTACT_RESOLVED
            - WORKFLOW_CONTACT_RESOLUTION_FAILED
            - WORKFLOW_CONTACT_RESOLUTION_SKIPPED
            - WORKFLOW_NODE_COMPLETED
            - WORKFLOW_PUBLISHED
            - CANDIDATE_LIST_CREATED
            - CANDIDATE_LIST_UPDATED
            - CANDIDATE_LIST_DELETED
            - CANDIDATE_LIST_MEMBERSHIP_UPDATED
          description: List of event types to subscribe to. `CANDIDATE_ANALYSIS_RESCORED`, `CANDIDATE_ANALYSIS_RESCORED_AFTER_ACTED_ON` and `CANDIDATE_ANALYSIS_FAILED` are not yet available to subscribe to, and a request that includes any of them returns 400.
      additionalProperties: false
    ListWebhookEventsResponse:
      description: Response containing the list of available webhook events
      type: object
      properties:
        data:
          type: array
          description: List of available webhook events
          items:
            type: object
            properties:
              name:
                type: string
                description: The webhook event type identifier (e.g. CONVERSATION_STARTED)
              description:
                type: string
                description: Human-readable description of when the event fires
              category:
                type: string
                description: Category the event belongs to (e.g. Conversations, Scheduling, Workflows)
    CreateWebhookResponse:
      description: Response after creating a webhook
      type: object
      properties:
        id:
          type: string
          description: Unique webhook identifier
        name:
          type: string
          description: Name of the webhook
        url:
          type: string
          format: uri
          description: Webhook URL
        subscribedEvents:
          type: array
          items:
            type: string
            enum:
            - CONVERSATION_STARTED
            - CONVERSATION_COMPLETED
            - CONVERSATION_NEEDS_REVIEW
            - CONVERSATION_QUEUED
            - CONVERSATION_OPTED_OUT
            - START_CONVERSATION_FAILED
            - ANALYSIS_CREATED
            - CANDIDATE_ANALYSIS_COMPLETED
            - DOCUMENT_UPLOADED
            - CALENDAR_MEETING_SCHEDULED
            - CALENDAR_MEETING_RESCHEDULED
            - CALENDAR_MEETING_CANCELLED
            - CALENDAR_NOTE_TAKER_COMPLETED
            - CAMPAIGN_STOPPED
            - CALENDAR_AVAILABILITY_NOT_FOUND
            - CALENDAR_MORE_TIME_REQUESTED
            - WORKFLOW_RUN_STARTED
            - WORKFLOW_RUN_COMPLETED
            - WORKFLOW_RUN_FAILED
            - WORKFLOW_RUN_CANCELLED
            - WORKFLOW_CONTACT_RESOLVED
            - WORKFLOW_CONTACT_RESOLUTION_FAILED
            - WORKFLOW_CONTACT_RESOLUTION_SKIPPED
            - WORKFLOW_NODE_COMPLETED
            - WORKFLOW_PUBLISHED
            - CANDIDATE_LIST_CREATED
            - CANDIDATE_LIST_UPDATED
            - CANDIDATE_LIST_DELETED
            - CANDIDATE_LIST_MEMBERSHIP_UPDATED
          description: Subscribed event types
        signingSecret:
          type: string
          description: HMAC signing secret for verifying webhook payloads. Only returned on creation.
    ListWebhooksResponse:
      description: Response containing list of webhooks
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique webhook identifier
              name:
                type: string
                description: Name of the webhook
              url:
                type: string
                format: uri
                description: HTTPS URL to receive webhook events
              signingSecret:
                type: string
                description: HMAC signing secret for verifying webhook payloads
              subscribedEvents:
                type: array
                items:
                  type: string
                  enum:
                  - CONVERSATION_STARTED
                  - CONVERSATION_COMPLETED
                  - CONVERSATION_NEEDS_REVIEW
                  - CONVERSATION_QUEUED
                  - CONVERSATION_OPTED_OUT
                  - START_CONVERSATION_FAILED
                  - ANALYSIS_CREATED
                  - CANDIDATE_ANALYSIS_COMPLETED
                  - DOCUMENT_UPLOADED
                  - CALENDAR_MEETING_SCHEDULED
                  - CALENDAR_MEETING_RESCHEDULED
                  - CALENDAR_MEETING_CANCELLED
                  - CALENDAR_NOTE_TAKER_COMPLETED
                  - CAMPAIGN_STOPPED
                  - CALENDAR_AVAILABILITY_NOT_FOUND
                  - CALENDAR_MORE_TIME_REQUESTED
                  - WORKFLOW_RUN_STARTED
                  - WORKFLOW_RUN_COMPLETED
                  - WORKFLOW_RUN_FAILED
                  - WORKFLOW_RUN_CANCELLED
                  - WORKFLOW_CONTACT_RESOLVED
                  - WORKFLOW_CONTACT_RESOLUTION_FAILED
                  - WORKFLOW_CONTACT_RESOLUTION_SKIPPED
                  - WORKFLOW_NODE_COMPLETED
                  - WORKFLOW_PUBLISHED
                  - CANDIDATE_LIST_CREATED
                  - CANDIDATE_LIST_UPDATED
                  - CANDIDATE_LIST_DELETED
                  - CANDIDATE_LIST_MEMBERSHIP_UPDATED
                description: List of event types this webhook is subscribed to
              organizationId:
                type: string
                description: Organization ID
              createdAt:
                type: string
                format: date-time
                description: Creation timestamp
              updatedAt:
                type: string
                format: date-time
                description: Last update timestamp
          description: List of webhook configurations
    Webhook:
      description: Webhook configuration
      type: object
      properties:
        id:
          type: string
          description: Unique webhook identifier
        name:
          type: string
          description: Name of the webhook
        url:
          type: string
          format: uri
          description: HTTPS URL to receive webhook events
        subscribedEvents:
          type: array
          items:
            type: string
            enum:
            - CONVERSATION_STARTED
            - CONVERSATION_COMPLETED
            - CONVERSATION_NEEDS_REVIEW
            - CONVERSATION_QUEUED
            - CONVERSATION_OPTED_OUT
            - START_CONVERSATION_FAILED
            - ANALYSIS_CREATED
            - CANDIDATE_ANALYSIS_COMPLETED
            - DOCUMENT_UPLOADED
            - CALENDAR_MEETING_SCHEDULED
            - CALENDAR_MEETING_RESCHEDULED
            - CALENDAR_MEETING_CANCELLED
            - CALENDAR_NOTE_TAKER_COMPLETED
            - CAMPAIGN_STOPPED
            - CALENDAR_AVAILABILITY_NOT_FOUND
            - CALENDAR_MORE_TIME_REQUESTED
            - WORKFLOW_RUN_STARTED
            - WORKFLOW_RUN_COMPLETED
            - WORKFLOW_RUN_FAILED
            - WORKFLOW_RUN_CANCELLED
            - WORKFLOW_CONTACT_RESOLVED
            - WORKFLOW_CONTACT_RESOLUTION_FAILED
            - WORKFLOW_CONTACT_RESOLUTION_SKIPPED
            - WORKFLOW_NODE_COMPLETED
            - WORKFLOW_PUBLISHED
            - CANDIDATE_LIST_CREATED
            - CANDIDATE_LIST_UPDATED
            - CANDIDATE_LIST_DELETED
            - CANDIDATE_LIST_MEMBERSHIP_UPDATED
          description: List of event types this webhook is subscribed to
        organizationId:
          type: string
          description: Organization ID
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    webhookId:
      type: string
    ErrorResponse:
      type: object
    CreateWebhookRequest:
      description: Request to create a webhook
      type: object
      required:
      - name
      - url
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the webhook
        url:
          type: string
          format: uri
          description: HTTPS URL to receive webhook events
        subscribedEvents:
          type: array
          items:
            type: string
            enum:
            - CONVERSATION_STARTED
            - CONVERSATION_COMPLETED
            - CONVERSATION_NEEDS_REVIEW
            - CONVERSATION_QUEUED
            - CONVERSATION_OPTED_OUT
            - START_CONVERSATION_FAILED
            - ANALYSIS_CREATED
            - CANDIDATE_ANALYSIS_COMPLETED
            - CANDIDATE_ANALYSIS_RESCORED
            - CANDIDATE_ANALYSIS_RESCORED_AFTER_ACTED_ON
            - CANDIDATE_ANALYSIS_FAILED
            - DOCUMENT_UPLOADED
            - CALENDAR_MEETING_SCHEDULED
            - CALENDAR_MEETING_RESCHEDULED
            - CALENDAR_MEETING_CANCELLED
            - CALENDAR_NOTE_TAKER_COMPLETED
            - CAMPAIGN_STOPPED
            - CALENDAR_AVAILABILITY_NOT_FOUND
            - CALENDAR_MORE_TIME_REQUESTED
            - WORKFLOW_RUN_STARTED
            - WORKFLOW_RUN_COMPLETED
            - WORKFLOW_RUN_FAILED
            - WORKFLOW_RUN_CANCELLED
            - WORKFLOW_CONTACT_RESOLVED
            - WORKFLOW_CONTACT_RESOLUTION_FAILED
            - WORKFLOW_CONTACT_RESOLUTION_SKIPPED
            - WORKFLOW_NODE_COMPLETED
            - WORKFLOW_PUBLISHED
            - CANDIDATE_LIST_CREATED
            - CANDIDATE_LIST_UPDATED
            - CANDIDATE_LIST_DELETED
            - CANDIDATE_LIST_MEMBERSHIP_UPDATED
          description: List of event types to subscribe to. `CANDIDATE_ANALYSIS_RESCORED`, `CANDIDATE_ANALYSIS_RESCORED_AFTER_ACTED_ON` and `CANDIDATE_ANALYSIS_FAILED` are not yet available to subscribe to, and a request that includes any of them returns 400.
      additionalProperties: false
  securitySchemes:
    popp_api_key:
      description: Your Popp API key for authentication
      type: apiKey
      name: x-api-key
      in: header
    organization_id:
      description: Your organization's unique identifier
      type: apiKey
      name: x-organization-id
      in: header
