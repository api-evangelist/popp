          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflows/by-external-id/{externalId}/archive:
    post:
      summary: Archive workflow by external ID
      description: Same as Archive workflow, but finds the workflow by your external ID.
      operationId: archive-workflow-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Your external ID for the workflow.
        required: true
        schema:
