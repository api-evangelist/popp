                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    patch:
      summary: Update workflow by external ID
      description: Same as Update workflow, but finds the workflow by your external ID.
      operationId: update-workflow-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Your external ID for the workflow.
        required: true
        schema:
          $ref: '#/components/schemas/externalId-cf970db4-b45b-4b86-9c70-a0eeecfb2777'
      tags:
      - Workflows
      requestBody:
        description: The fields to change.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
