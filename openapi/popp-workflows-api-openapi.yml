  /v1/workflows/{workflowId}/runs:
    post:
      summary: Start workflow runs
      description: Enrols candidates in a published workflow, one run per candidate. Runs start after the call returns, so the response reports what Popp accepted rather than the runs. Follow the runs with List workflow runs or the `WORKFLOW_CONTACT_RESOLVED` and `WORKFLOW_RUN_STARTED` webhooks.
      operationId: start-workflow-runs
      parameters:
      - name: workflowId
        in: path
        description: The workflow ID.
        required: true
        schema:
          $ref: '#/components/schemas/workflowId'
      tags:
      - Workflows
      requestBody:
        description: Candidates to enrol into the workflow.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkflowRunsInput'
      responses:
        '202':
          description: Popp accepted the request. `summary` accounts for every entry. An entry that can't be enrolled doesn't fail the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartWorkflowRunsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    get:
      summary: List workflow runs
      description: Lists a workflow's runs. Each run includes the candidate's name, so you don't need a call per run to look the candidate up.
      operationId: list-workflow-runs
      parameters:
      - name: workflowId
        in: path
        description: The workflow ID.
        required: true
        schema:
          $ref: '#/components/schemas/workflowId'
      - name: limit
        in: query
        description: Maximum number of runs to return per page.
        required: false
        schema:
          $ref: '#/components/schemas/limit'
      - name: nextToken
        in: query
        description: Pagination cursor returned by the previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      - name: status
        in: query
        description: 'Comma-separated list of statuses to filter by. Allowed values: `RUNNING`, `COMPLETED`, `FAILED`, `CANCELLED`. Example: `RUNNING,COMPLETED`.'
        required: false
        schema:
          $ref: '#/components/schemas/status-77eec34f-669b-4d05-86b2-0457ccb4ae30'
      - name: candidateProfileId
        in: query
        description: Filter to runs for the given candidate profile.
        required: false
        schema:
          $ref: '#/components/schemas/candidateProfileId'
      - name: candidateName
        in: query
        description: Only runs whose candidate name matches these words in this order, ignoring case. `John Smith` matches `John Smith` but not `Smith John`, and `John` matches every candidate named John.
        required: false
        schema:
          $ref: '#/components/schemas/candidateName'
      tags:
      - Workflows
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowRunsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
components:
  schemas:
    candidateName:
      type: string
      minLength: 1
    WorkflowAnalysisApplication:
      type: object
      properties:
        candidateId:
          type: string
          description: Identifier of the application's Candidate on this analysis node. The analysis webhooks carry it as `data.recordId`.
        candidateProfileId:
          type:
          - string
          - 'null'
          description: Identifier of the candidate profile.
        firstName:
          type: string
          description: The candidate's first name.
        lastName:
          type: string
          description: The candidate's last name.
        totalScoreScaled:
          type:
          - number
          - 'null'
          description: The application's effective score, from 0 to 1. Once the workflow acts on a score, that score stays. Until then, it is the most recent score on the newest requirements. `null` when the first score failed and no re-score has replaced it, and `analysisErrorCode` says why. Once the workflow acts on that failure, it stays `null`.
          minimum: 0
          maximum: 1
        isAllRequirementsMet:
          type:
          - boolean
          - 'null'
          description: Whether the application met every mandatory requirement.
        analysisErrorCode:
          type:
          - string
          - 'null'
          description: 'Why scoring failed, if it did. A failed re-score leaves the application''s score in place. `DOCUMENT_TOO_LARGE`: the CV''s text is too long to score. `ANALYSIS_INPUT_UNAVAILABLE`: there was no CV text and no screening answer to score. `ANALYSIS_FAILED`: scoring failed on Popp''s side. More values may be added, so handle a value you don''t recognize.'
        metRequirementSlugs:
          type: array
          description: Slugs of the requirements the application met.
          items:
            type: string
        unmetRequirementSlugs:
          type: array
          description: Slugs of the requirements the application did not meet.
          items:
            type: string
        analysisOutcomeActedOnAt:
          type:
          - string
          - 'null'
          description: 'When the workflow acted on the score, or on a failure to score the application: the run entered the first outreach, scheduling, add-to-ATS-job or update-ATS-application node after the analysis node. Once set, later re-scores appear only in the application''s history.'
          format: date-time
        createdAt:
          type: string
          description: When the application was first scored on this node.
          format: date-time
        updatedAt:
          type: string
          description: When the application's record last changed.
          format: date-time
        requirementOutcomes:
          type: array
          description: The outcome of each requirement behind the effective score.
          items:
            type: object
            properties:
              requirementId:
                type:
                - string
                - 'null'
                description: Identifier of the requirement the outcome was scored against.
              slug:
                type:
                - string
                - 'null'
                description: The requirement's slug, fixed once published.
              text:
                type:
                - string
                - 'null'
                description: The requirement as it was worded when this outcome was scored.
              weight:
                type:
                - number
                - 'null'
                description: The requirement's scoring weight when this outcome was scored.
              isMandatory:
                type:
                - boolean
                - 'null'
                description: Whether the requirement was mandatory when this outcome was scored.
              isMet:
                type: boolean
                description: Whether the application met the requirement.
              evidence:
                type: string
                description: The evidence for the outcome, from the CV or screening answers.
              scoredAt:
                type:
                - string
                - 'null'
                description: When the outcome was scored.
                format: date-time
    WorkflowStatusActionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          title: Workflow ID
          description: Identifier of the workflow.
        organizationId:
          type: string
          format: uuid
          title: Organization ID
          description: Identifier of the organization that owns the workflow.
        name:
          type: string
          title: Name
          description: Workflow name.
        status:
          type: string
          enum:
          - UNPUBLISHED
          - PUBLISHED
          - PAUSED
          - ARCHIVED
          title: Status
          description: 'The status after the call: `PAUSED` after a pause, `PUBLISHED` after a resume.'
        updatedAt:
          type: string
          format: date-time
          title: Updated At
          description: Timestamp when the status change took effect.
      required:
      - id
      - organizationId
      - name
      - status
      - updatedAt
      additionalProperties: false
    Retry-After:
      type: integer
    PublishWorkflowRefusedResponse:
      type: object
      properties:
        message:
          type: string
          title: Message
          description: A summary. The problems are in `validation.errors`.
        workflowId:
          type: string
          format: uuid
          title: Workflow ID
          description: The workflow ID.
        versionId:
          type: string
          enum:
          - ''
          title: Version ID
          description: 'Always empty: no version was created.'
        versionNumber:
          type: integer
          enum:
          - 0
          title: Version Number
          description: 'Always 0: no version was created.'
        status:
          type: string
          enum:
          - ARCHIVED
          title: Status
          description: 'Always `ARCHIVED`: no version went live.'
        publishedAt:
          type: string
          format: date-time
          title: Published At
          description: When Popp refused the draft.
        validation:
          type: object
          title: Validation
          description: Why Popp refused the draft.
          properties:
            valid:
              type: boolean
              enum:
              - false
              title: Valid
              description: Always `false`.
            errors:
              type: array
              title: Errors
              description: One entry per problem. [Configuration validation](/docs/workflow-configuration#configuration-validation) lists the error codes.
              items:
                type: object
                properties:
                  nodeId:
                    type:
                    - string
                    - 'null'
                    title: Node ID
                    description: The node with the problem, when the problem belongs to one node.
                  errorCode:
                    type: string
                    title: Error Code
                    description: Stable machine-readable validation error code.
                  message:
                    type: string
                    title: Message
                    description: Human-readable explanation of the error.
                  path:
                    type:
                    - string
                    - 'null'
                    title: Path
                    description: Where in the configuration the problem is, for example `nodes.q1.config.questions`.
                required:
                - errorCode
                - message
                additionalProperties: false
              minItems: 1
          required:
          - valid
          - errors
          additionalProperties: false
      required:
      - message
      - workflowId
      - versionId
      - versionNumber
      - status
      - publishedAt
      - validation
      additionalProperties: false
      example:
        message: 'Workflow not published: the draft failed validation. See validation.errors.'
        workflowId: 2f0c3c0e-6a43-4d7b-9a55-0b4a8a3f6c21
        versionId: ''
        versionNumber: 0
        status: ARCHIVED
        publishedAt: '2026-10-12T09:30:00.000Z'
        validation:
          valid: false
          errors:
          - nodeId: move-to-interview
            errorCode: ATS_STAGE_NOT_FOUND
            message: stage 'stage-abc' is not on the stage list of job 'job-hgv-class-1', which offers 4
            path: nodes.move-to-interview.config.targets[0].atsInterviewStageId
          - nodeId: collect-documents
            errorCode: DOCUMENT_TYPE_ARCHIVED
            message: 'Archived documentTypeId: document-type-1'
            path: nodes.collect-documents.config.questions[0].documentItems
    CandidateProfile:
      type: object
      description: Candidate profile — the canonical record of a candidate within Popp. Profiles can be enrolled into workflows.
      properties:
        id:
          type: string
          format: uuid
          title: Candidate Profile ID
          description: Unique identifier for the candidate profile.
        organizationGroupId:
          type: string
          format: uuid
          title: Organization Group ID
          description: Identifier of the organization group that owns the candidate profile. Profiles are scoped to an organization group, not a single organization.
        organizationIds:
          type: array
          title: Organization IDs
          description: Organizations within the group that the candidate has been associated with.
          items:
            type: string
            format: uuid
        externalId:
          type:
          - string
          - 'null'
          title: External ID
          description: Caller-supplied identifier in the format ^[\w.-]+$.
        firstName:
          type:
          - string
          - 'null'
          title: First Name
          description: Candidate's first name.
        lastName:
          type:
          - string
          - 'null'
          title: Last Name
          description: Candidate's last name.
        email:
          type:
          - string
          - 'null'
          format: email
          title: Email
          description: Candidate's email address.
        phoneNumber:
          type:
          - string
          - 'null'
          title: Phone Number
          description: Candidate's phone number in E.164 format.
      required:
      - id
      - organizationGroupId
      - organizationIds
      additionalProperties: false
    limit-e9f88c9d-d5d5-4697-9eb4-e3130e3e10d8:
      type: integer
      minimum: 1
      maximum: 100
    limit:
      type: integer
    CancelWorkflowRunInput:
      type: object
      properties:
        reason:
          type: string
          title: Reason
          description: Why you cancelled the run.
        closeActiveConversations:
          type: boolean
          title: Close Active Conversations
          description: Also closes the run's active conversation. Defaults to `false`, which lets the conversation finish.
      additionalProperties: false
    workflowNodeSlug:
      type: string
    externalId-5f12bc47-4166-4883-942a-f025b72dd582:
      type: string
      pattern: ^[\w.-]+$
      minLength: 1
