openapi: 3.2.0
info:
  title: Popp Workflows API
  description: Popp API documentation
  version: '1'
servers:
- url: https://api.joinpopp.com
  description: Development server
security:
- popp_api_key: []
  organization_id: []
tags:
- name: Workflows
paths:
  /v1/candidate-profiles/by-external-id/{externalId}:
    get:
      summary: Get candidate profile by external ID
      description: Returns the candidate profile in the caller's organization group with the given external ID. Returns 404 when no profile matches.
      operationId: get-candidate-profile-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Caller-supplied external identifier matching ^[\w.-]+$ (1-256 characters).
        required: true
        schema:
          $ref: '#/components/schemas/externalId-0bcf915f-e8ad-4225-b43f-89471a8edea4'
      tags:
      - Workflows
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflow-runs/{runId}:
    get:
      summary: Get workflow run
      description: Returns a workflow run by ID, including its full `context` JSON string.
      operationId: get-workflow-run
      parameters:
      - name: runId
        in: path
        description: The run ID. Some older run IDs contain reserved characters such as `#`. URL-encode them in the path (`#` becomes `%23`).
        required: true
        example: 60c912c1-db30-4415-8486-103d059e1c87
        schema:
          $ref: '#/components/schemas/runId'
      tags:
      - Workflows
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflow-runs/{runId}/cancel:
    post:
      summary: Cancel workflow run
      description: Cancels a workflow run in progress.
      operationId: cancel-workflow-run
      parameters:
      - name: runId
        in: path
        description: The run ID. Some older run IDs contain reserved characters such as `#`. URL-encode them in the path (`#` becomes `%23`).
        required: true
        example: 60c912c1-db30-4415-8486-103d059e1c87
        schema:
          $ref: '#/components/schemas/runId'
      tags:
      - Workflows
      requestBody:
        description: Optional.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelWorkflowRunInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelWorkflowRunResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflows:
    post:
      summary: Create workflow
      description: 'Creates a workflow in the `UNPUBLISHED` state. It accepts runs once you publish it.


        Workflow configuration describes the `configuration` format. Some checks, such as analysis node slugs, run only at publish.'
      operationId: create-workflow
      parameters: []
      tags:
      - Workflows
      requestBody:
        description: The workflow to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowInput'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    get:
      summary: List workflows
      description: Lists your organization's workflows, most recently updated first.
      operationId: list-workflows
      parameters:
      - name: limit
        in: query
        description: Maximum number of workflows to return per page.
        required: false
        schema:
          $ref: '#/components/schemas/limit'
      - name: nextToken
        in: query
        description: Pagination cursor returned by the previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      - name: status
        in: query
        description: 'Comma-separated list of statuses to filter by. Allowed values: `UNPUBLISHED`, `PUBLISHED`, `PAUSED`, `ARCHIVED`. Example: `PUBLISHED,PAUSED`.'
        required: false
        schema:
          $ref: '#/components/schemas/status-4a2a30ad-8ae1-4aa0-b803-3b9cea83720a'
      tags:
      - Workflows
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflows/by-external-id/{externalId}:
    get:
      summary: Get workflow by external ID
      description: Same as Get workflow, but finds the workflow by your external ID.
      operationId: get-workflow-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Your external ID for the workflow.
        required: true
        schema:
          $ref: '#/components/schemas/externalId-78d822e1-15b1-4cbe-95c7-b08c04b3c084'
      tags:
      - Workflows
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
