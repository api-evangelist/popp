          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflows/{workflowId}/analyses/{workflowNodeSlug}:
    get:
      summary: Get workflow analysis (Beta)
      description: '**Beta.** Fields and behaviour may change before general availability. Returns the analysis behind one of a workflow''s analysis nodes, with its counts, score bands and requirements. Counts leave out erased candidates. See Reading a workflow analysis.'
      operationId: get-workflow-analysis
      parameters:
      - name: workflowId
        in: path
        description: The workflow ID.
        required: true
        schema:
          $ref: '#/components/schemas/workflowId'
      - name: workflowNodeSlug
        in: path
        description: The slug you gave the analysis node in the workflow configuration. It is fixed once published.
        required: true
        schema:
          $ref: '#/components/schemas/workflowNodeSlug'
      tags:
      - Workflows
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAnalysis'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: The workflow belongs to another organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: The workflow doesn't exist, or has no analysis for this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflows/{workflowId}/analyses/{workflowNodeSlug}/applications:
    get:
      summary: List workflow analysis applications (Beta)
      description: '**Beta.** Fields and behaviour may change before general availability. Lists the applications scored on a workflow analysis node, one row per application with its effective score. Erased candidates are left out.'
      operationId: list-workflow-analysis-applications
      parameters:
      - name: workflowId
        in: path
        description: The workflow ID.
        required: true
        schema:
          $ref: '#/components/schemas/workflowId'
      - name: workflowNodeSlug
        in: path
        description: The slug you gave the analysis node in the workflow configuration. It is fixed once published.
        required: true
        schema:
          $ref: '#/components/schemas/workflowNodeSlug'
      - name: limit
        in: query
        description: Maximum number of items per page, 1 to 100. Defaults to 50.
        required: false
        schema:
          $ref: '#/components/schemas/limit-a4d690c1-cfce-4546-95a7-fe367ba350a7'
      - name: nextToken
        in: query
        description: Pagination cursor returned by the previous call.
        required: false
        schema:
          $ref: '#/components/schemas/nextToken'
      tags:
      - Workflows
      responses:
        '200':
          description: ''
