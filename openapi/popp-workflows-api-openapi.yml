  /v1/workflows/{workflowId}/publish:
    post:
      summary: Publish workflow
      description: 'Publishes the workflow''s working draft as a new live version. Popp checks the draft first, and a failed publish changes nothing.


        Configuration validation lists every check and error code.'
      operationId: publish-workflow
      parameters:
      - name: workflowId
        in: path
        description: The workflow ID.
        required: true
        schema:
          $ref: '#/components/schemas/workflowId'
      tags:
      - Workflows
      requestBody:
        description: Optional.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishWorkflowInput'
      responses:
        '200':
          description: The new version is live and accepts runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishWorkflowResponse'
          headers: {}
        '400':
          description: Publish was refused, and the error says why. For example, the workflow is paused or archived, or the error is `ATS_JOB_ALREADY_CONNECTED`, `RUBRIC_GENERATION_FAILED` or `JOB_SUMMARY_GENERATION_FAILED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: Another publish of this workflow ran at the same time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '422':
          description: The draft failed one or more checks. `validation.errors` lists each one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishWorkflowRefusedResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '503':
          description: Popp could not finish a check, for example because your ATS was unreachable. Send the same request again after the `Retry-After` delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                $ref: '#/components/schemas/Retry-After'
  /v1/workflows/{workflowId}/resume:
