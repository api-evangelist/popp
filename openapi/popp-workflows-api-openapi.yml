          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflows/by-external-id/{externalId}/runs:
    post:
      summary: Start workflow runs by external ID
      description: Same as Start workflow runs, but finds the workflow by your external ID.
      operationId: start-workflow-runs-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Your external ID for the workflow.
        required: true
        schema:
          $ref: '#/components/schemas/externalId-5f12bc47-4166-4883-942a-f025b72dd582'
      tags:
      - Workflows
      requestBody:
        description: Candidates to enrol into the workflow.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkflowRunsInput'
      responses:
        '202':
          description: Popp accepted the request. `summary` accounts for every entry. An entry that can't be enrolled doesn't fail the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartWorkflowRunsResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflows/{workflowId}:
    get:
      summary: Get workflow
      description: Returns a workflow by ID, including its full `configuration` and `settings` JSON strings.
      operationId: get-workflow
      parameters:
      - name: workflowId
        in: path
        description: The workflow ID.
        required: true
        schema:
          $ref: '#/components/schemas/workflowId'
      tags:
      - Workflows
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
    patch:
      summary: Update workflow
      description: 'Updates the working draft of a workflow. Changes go live only when you publish.


        Some checks, such as analysis node slugs, run only at publish.'
      operationId: update-workflow
      parameters:
      - name: workflowId
        in: path
        description: The workflow ID.
        required: true
        schema:
          $ref: '#/components/schemas/workflowId'
      tags:
      - Workflows
      requestBody:
        description: The fields to change.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
