          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflows/by-external-id/{externalId}/pause:
    post:
      summary: Pause workflow by external ID
      description: Same as Pause workflow, but finds the workflow by your external ID.
      operationId: pause-workflow-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Your external ID for the workflow.
        required: true
        schema:
          $ref: '#/components/schemas/externalId-2798ed29-5811-4c0a-b03f-8f56f0dcc756'
      tags:
      - Workflows
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatusActionResponse'
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
  /v1/workflows/by-external-id/{externalId}/publish:
    post:
      summary: Publish workflow by external ID
      description: Same as Publish workflow, but finds the workflow by your external ID.
      operationId: publish-workflow-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Your external ID for the workflow.
        required: true
        schema:
          $ref: '#/components/schemas/externalId-08e7c69c-a20a-4a9e-a9f1-f1d76d25dfe4'
      tags:
      - Workflows
      requestBody:
        description: Optional.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishWorkflowInput'
      responses:
        '200':
          description: The new version is live and accepts runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishWorkflowResponse'
          headers: {}
        '400':
          description: Publish was refused, and the error says why. For example, the workflow is paused or archived, or the error is `ATS_JOB_ALREADY_CONNECTED`, `RUBRIC_GENERATION_FAILED` or `JOB_SUMMARY_GENERATION_FAILED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '409':
          description: Another publish of this workflow ran at the same time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '422':
          description: The draft failed one or more checks. `validation.errors` lists each one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishWorkflowRefusedResponse'
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
        '503':
          description: Popp could not finish a check, for example because your ATS was unreachable. Send the same request again after the `Retry-After` delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                $ref: '#/components/schemas/Retry-After'
  /v1/workflows/by-external-id/{externalId}/resume:
    post:
      summary: Resume workflow by external ID
      description: Same as Resume workflow, but finds the workflow by your external ID.
      operationId: resume-workflow-by-external-id
      parameters:
      - name: externalId
        in: path
        description: Your external ID for the workflow.
        required: true
        schema:
          $ref: '#/components/schemas/externalId-56390b04-5308-442b-aa33-b2a9318a4dbf'
      tags:
      - Workflows
      responses:
        '200':
